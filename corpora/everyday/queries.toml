# Everyday Snowflake queries, as a demo visitor or a dbt project writes them, over sources/tables.yml.
# `expect` is its outcome from SQLQuack under the built-in default policy, which the playground
# offers as "strict": "translated", "parse <code>", "check <code>" or "refused <code> <construct>".
# `expect_repository` is the outcome under the repository's sqlquack.toml with a UTC session, the
# playground's default. The test fails when an outcome changes, except a refusal that now
# translates, which it only reports; `make corpus-rerecord` records every change, intended ones
# in the same commit. `snowflake` is Snowflake's own verdict where one was recorded, "compiles" or
# "rejects <errno>", from snowflake-receipts.json; it decides whether a query counts as valid SQL in
# the translation rates, over its category.

