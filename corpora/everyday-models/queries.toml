[[query]]
category = "dbt_snapshot"
sql = '''with snapshot_query as (
        select order_id, customer_id, order_date, status, amount, updated_at from analytics.dbt_dev.stg_orders
    ),
    snapshotted_data as (
        select *,
        order_id as dbt_unique_key
        from analytics.snapshots.orders_snapshot
        where
                dbt_valid_to is null
    ),
    insertions_source_data as (
        select *,
        order_id as dbt_unique_key
,
            to_timestamp_ntz(convert_timezone('UTC', current_timestamp())) as dbt_updated_at,
            to_timestamp_ntz(convert_timezone('UTC', current_timestamp())) as dbt_valid_from,
  coalesce(nullif(to_timestamp_ntz(convert_timezone('UTC', current_timestamp())), to_timestamp_ntz(convert_timezone('UTC', current_timestamp()))), null)
  as dbt_valid_to
,
            md5(coalesce(cast(order_id as varchar ), '')
         || '|' || coalesce(cast(to_timestamp_ntz(convert_timezone('UTC', current_timestamp())) as varchar ), '')
        ) as dbt_scd_id
        from snapshot_query
    ),
    updates_source_data as (
        select *,
        order_id as dbt_unique_key
,
            to_timestamp_ntz(convert_timezone('UTC', current_timestamp())) as dbt_updated_at,
            to_timestamp_ntz(convert_timezone('UTC', current_timestamp())) as dbt_valid_from,
            to_timestamp_ntz(convert_timezone('UTC', current_timestamp())) as dbt_valid_to
        from snapshot_query
    ),
    insertions as (
        select
            'insert' as dbt_change_type,
            source_data.*
        from insertions_source_data as source_data
        left outer join snapshotted_data
            on
        snapshotted_data.dbt_unique_key = source_data.dbt_unique_key
            where
        snapshotted_data.dbt_unique_key is null
            or (
        snapshotted_data.dbt_unique_key is not null
 and (
               (snapshotted_data.status != source_data.status
        or
        (
            ((snapshotted_data.status is null) and not (source_data.status is null))
            or
            ((not snapshotted_data.status is null) and (source_data.status is null))
        ) or snapshotted_data.amount != source_data.amount
        or
        (
            ((snapshotted_data.amount is null) and not (source_data.amount is null))
            or
            ((not snapshotted_data.amount is null) and (source_data.amount is null))
        ))
            )
        )
    ),
    updates as (
        select
            'update' as dbt_change_type,
            source_data.*,
            snapshotted_data.dbt_scd_id
        from updates_source_data as source_data
        join snapshotted_data
            on
        snapshotted_data.dbt_unique_key = source_data.dbt_unique_key
        where (
            (snapshotted_data.status != source_data.status
        or
        (
            ((snapshotted_data.status is null) and not (source_data.status is null))
            or
            ((not snapshotted_data.status is null) and (source_data.status is null))
        ) or snapshotted_data.amount != source_data.amount
        or
        (
            ((snapshotted_data.amount is null) and not (source_data.amount is null))
            or
            ((not snapshotted_data.amount is null) and (source_data.amount is null))
        ))
        )
    )
    select * from insertions
    union all
    select * from updates'''
expect = "refused SQ0008 fn:CONVERT_TIMEZONE at 445..489"
expect_repository = "refused SQ0003 fn:TO_TIMESTAMP_NTZ at 428..490"

