# dbt-style Snowflake models, over schema.json: staging, CTE chains, incremental filters, QUALIFY
# deduplication, FLATTEN, MERGE and other materialization DML, date spines, window frames,
# PIVOT/UNPIVOT, marts, snapshots and the SQL generic tests compile to. The fields are those of
# corpora/everyday/queries.toml: `expect` under the built-in default policy, `expect_repository`
# under the repository's sqlquack.toml with a UTC session, `snowflake` for Snowflake's recorded
# verdict from snowflake-receipts.json, and `uncertain` for a query whose validity is not recorded.
# The test fails and reports changes as for that corpus; `make corpus-rerecord` records them.

[[query]]
category = "dbt_staging"
sql = '''with source as (
    select * from raw_orders
),
renamed as (
    select
        id as order_id,
        user_id as customer_id, order_date, status
    from source
)
select * from renamed
'''
expect = "translated"
expect_repository = "translated"

