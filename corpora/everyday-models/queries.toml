[[query]]
category = "dbt_cte_chain"
sql = '''with base as (
    select * from orders
),
monthly as (
    select
        date_trunc(month, ordered_at)::date as month,
        count(*) as row_count
    from base
    group by 1
),
with_growth as (
    select
        month,
        row_count,
        lag(row_count) over (order by month) as previous_count
    from monthly
),
final as (
    select
        month,
        row_count,
        previous_count,
        row_count - previous_count as change
    from with_growth
)
select * from final
'''
expect = "translated"
expect_repository = "translated"

