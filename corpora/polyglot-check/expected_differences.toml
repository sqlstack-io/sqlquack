dialects = ["Snowflake"]
sqlquack_error = "Expected AS before the CTE body"
note = "Snowflake needs AS between a CTE's name and its body: it refuses WITH v1 ( SELECT 1 ) SELECT 1 with syntax error 1003 (case sf.query.with.select.k8b29420d51a4)"

[[rejection]]
