# Statements both parsers parse where polyglot drops the quoting of a name SQLQuack keeps quoted.
# The check counts an entry as kept quoting only when the statement, without whitespace and ignoring
# case, contains `marker`, and the trees differ in nothing but identifiers whose `quoted` is false in
# polyglot's tree and true in SQLQuack's; crates/sqlquack-polyglot-check/tests/runs/test_kept_quoting.rs
# pins both.

[[kept_quoting]]
id = "star_exclude_quoted_name"
marker = "EXCLUDE(\""
note = "SELECT * EXCLUDE (\"note\") excludes the case-sensitive column note, not NOTE; polyglot drops the quotes of a star's EXCLUDE names"

[[kept_quoting]]
id = "comment_on_quoted_name"
marker = "COMMENTON"
note = "COMMENT ON TABLE \"v1\" names the case-sensitive object v1, not V1; polyglot drops the quotes of a COMMENT ON name; crates/sqlquack-syntax/tests/parser/test_fixes.rs pins the tree"

# Wrapper nodes SQLQuack keeps where polyglot drops them. The check counts an entry only when the
# statement, without whitespace and ignoring case, contains `marker`, and both trees are equal once
# every `{ "<node>": { "this": … } }` in SQLQuack's tree is replaced by its operand.

[[kept_node]]
id = "unary_plus"
marker = "+"
node = "pos"
note = "SELECT + 1 keeps its unary plus, a documented Snowflake operator; polyglot drops it and keeps only the operand; crates/sqlquack-syntax/tests/parser/test_fixes.rs pins the tree"

# Fields SQLQuack keeps as written where polyglot drops or infers them. The check counts an entry
# only when the statement, without whitespace and ignoring case, contains `marker`, the trees differ,
# and both are equal once every `<field>` key is removed from each.

[[kept_field]]
id = "snowflake_secondary_role_list"
marker = "SECONDARYROLES"
field = "roles"
note = "USE SECONDARY ROLES a, b, c lists its roles one by one with their quoting; polyglot joins them into one unquoted name; crates/sqlquack-syntax/tests/parser/test_fixes.rs pins the tree"

[[kept_field]]
id = "snowflake_show_unnamed_container"
marker = "SHOW"
field = "scope_kind"
note = "SHOW ... IN a.b names no container kind, so SQLQuack records none; polyglot infers SCHEMA from the two-part name, which makes IN a.b and IN SCHEMA a.b one tree"

[[kept_field]]
id = "snowflake_timestamp_without_time_zone"
marker = "WITHOUTTIMEZONE"
field = "to"
note = "Snowflake documents TIMESTAMP WITHOUT TIME ZONE as a synonym of TIMESTAMP_NTZ, so SQLQuack's cast target is TIMESTAMPNTZ, as for TIMESTAMP_NTZ; polyglot reads it as bare TIMESTAMP, whose meaning follows TIMESTAMP_TYPE_MAPPING; crates/sqlquack-syntax/tests/parser/test_fixes.rs pins the tree"

[[kept_field]]
id = "snowflake_clone_time_travel"
marker = "CLONE"
field = "at_clause"
note = "a database or schema clone's AT | BEFORE ( TIMESTAMP | OFFSET | STATEMENT => <expr> ) parses into its keyword, kind and expression; polyglot keeps the clause as raw text; crates/sqlquack-syntax/tests/parser/test_snowflake_create_clone.rs pins the tree"

[[kept_field]]
id = "snowflake_table_clone_time_travel"
marker = "CLONE"
field = "clone_at_clause"
note = "a table clone's AT | BEFORE ( TIMESTAMP | OFFSET | STATEMENT => <expr> ) parses into its keyword, kind and expression; polyglot keeps the clause as raw text; crates/sqlquack-syntax/tests/parser/test_snowflake_create_clone.rs pins the tree"

# Clauses whose ALL SQLQuack keeps apart from its keys, where polyglot reads ALL as a bare-word key.
# The check counts an entry only when the statement, without whitespace and ignoring case, contains
# `marker`, the trees differ, and both are equal once each `<clause>` in SQLQuack's tree that has no
# keys and an `all` is rewritten as polyglot's one key `{ "var": { "this": "ALL" } }` with the same
# DESC and NULLS options. The run counts them with the kept fields.

[[kept_all]]
id = "snowflake_order_by_all"
marker = "ORDERBYALL"
clause = "order_by"
note = "ORDER BY ALL sorts by every SELECT-list column in order, so SQLQuack records it as an ALL of the clause with its DESC and NULLS options; polyglot reads ALL as a key named ALL, which a column called ALL would also give; crates/sqlquack-syntax/tests/parser/test_fixes.rs pins the tree"

# Statements polyglot keeps as one opaque command where SQLQuack parses them into structured nodes.
# The check counts an entry only when polyglot's tree is a single command, SQLQuack's tree starts
# with `sqlquack_node`, and the statement, without whitespace and ignoring case, contains `marker`.

[[structured]]
id = "snowflake_storage_integration_properties"
marker = "CREATESTORAGEINTEGRATION"
sqlquack_node = "create_object"
note = "a Snowflake CREATE STORAGE INTEGRATION parses into its name and its property list, each property's kind and value; polyglot keeps the statement as raw SQL; crates/sqlquack-syntax/tests/parser/test_snowflake_create_properties.rs pins the tree"

[[structured]]
id = "snowflake_scripting_block"
marker = "BEGIN"
sqlquack_node = "scripting_block"
note = "a Snowflake Scripting block parses into its declarations, statements and handlers; crates/sqlquack-syntax/tests/parser/test_scripting.rs pins the tree"

[[structured]]
id = "snowflake_create_stage"
marker = "STAGE"
sqlquack_node = "create_object"
note = "a Snowflake CREATE STAGE parses into a STAGE object with its properties, such as FILE_FORMAT = ( FORMAT_NAME = ... ); polyglot keeps it as raw text; crates/sqlquack-syntax/tests/parser/test_fixes.rs pins the tree"

[[structured]]
id = "snowflake_create_file_format"
marker = "FILEFORMAT"
sqlquack_node = "create_object"
note = "a Snowflake CREATE FILE FORMAT parses into a FILE FORMAT object with its modifier and options; polyglot keeps it as raw text; crates/sqlquack-syntax/tests/parser/test_fixes.rs pins the tree"

# Calls polyglot keeps as functions where SQLQuack parses them into their own nodes. The check counts
# an entry only when the statement contains `marker` and the trees are equal once each listed node,
# holding only `expressions`, is written back as polyglot's call of `call` with those arguments.

[[structured_call]]
id = "group_by_rollup_node"
marker = "ROLLUP("
sqlquack_node = "rollup"
call = "ROLLUP"
note = "GROUP BY ROLLUP (...) is a grouping construct, not a function, so SQLQuack parses it into a rollup node that rules can match (D322); crates/sqlquack-syntax/src/parser/tests/test_parser.rs pins the tree"

[[structured_call]]
id = "group_by_cube_node"
marker = "CUBE("
sqlquack_node = "cube"
call = "CUBE"
