# Valid Snowflake polyglot rejects and SQLQuack parses. The check counts an entry as fixed only
# when polyglot's error contains one of `polyglot_errors` and the statement, without whitespace and
# ignoring case, contains `marker`; crates/sqlquack-syntax/tests/parser/test_fixes.rs pins
# SQLQuack's tree for each fix.

[[fix]]
id = "index_then_key_path"
marker = "]:"
polyglot_errors = ["Invalid expression / Unexpected token", "Expected RParen, got Colon (':')"]
note = "v[3]:a is a key path on an array element; polyglot accepts a path only after a column, path or call"

[[fix]]
id = "double_colon_object_type"
marker = "::OBJECT("
polyglot_errors = ["Invalid expression / Unexpected token", "Expected RParen, got LParen ('(')"]
note = "x::OBJECT(a INT) is the structured OBJECT type CAST(x AS OBJECT(a INT)) parses; polyglot's :: types stop at OBJECT"

[[fix]]
id = "nested_object_type_in_array"
marker = "(OBJECT("
polyglot_errors = ["Expected RParen, got LParen ('(')"]
note = "x::ARRAY(OBJECT(k INT)) nests a structured OBJECT as CAST(x AS ARRAY(OBJECT(k INT))) does"

[[fix]]
id = "nested_object_type_in_map"
marker = ",OBJECT("
polyglot_errors = ["Expected RParen, got LParen ('(')"]
note = "x::MAP(VARCHAR, OBJECT(k INT)) nests a structured OBJECT as the CAST form does"

[[fix]]
id = "negative_autoincrement_step"
marker = "INCREMENT-"
polyglot_errors = ["Unexpected token: Dash"]
note = "AUTOINCREMENT START <num> INCREMENT <num> takes a negative step, which counts down; polyglot's INCREMENT reads only an unsigned number"

[[fix]]
id = "parenthesized_typed_lambda"
marker = "varchar)->"
polyglot_errors = ["Expected RParen, got Var ('VARCHAR')"]
note = "(x VARCHAR) -> ... is a lambda with a typed parameter; polyglot reads a parenthesized lambda's parameters as names only"

[[fix]]
id = "parenthesized_typed_lambda_parameters"
marker = "variant)->"
polyglot_errors = ["Expected RParen, got Var ('NUMBER')"]
note = "(acc NUMBER(18, 2), i VARIANT) -> ... is a lambda with several typed parameters, one parameterised; polyglot reads a parenthesized lambda's parameters as names only"

[[fix]]
id = "parenthesized_typed_lambda_int"
marker = "int)->"
polyglot_errors = ["Expected RParen, got Var ('INT')"]
note = "(v INT) -> ... is a lambda with an INT parameter, as ACCUMULATE's documented examples write it; polyglot reads a parenthesized lambda's parameters as names only"

[[fix]]
id = "hash_agg_distinct"
marker = "HASH_AGG(DISTINCT"
polyglot_errors = ["Expected RParen, got Var"]
note = "HASH_AGG(DISTINCT a) is documented and recorded; polyglot reads no DISTINCT in HASH_AGG"

[[fix]]
id = "object_agg_distinct"
marker = "OBJECT_AGG(DISTINCT"
polyglot_errors = ["Expected RParen, got Var"]
note = "OBJECT_AGG(DISTINCT k, v) is documented and recorded; polyglot reads no DISTINCT in OBJECT_AGG"

[[fix]]
id = "snowflake_star_ilike"
marker = "*ILIKE'"
polyglot_errors = ["Invalid expression / Unexpected token"]
note = "SELECT * ILIKE 'pattern' is documented and recorded, alone and before REPLACE or RENAME; polyglot reads no ILIKE after a star"

[[fix]]
id = "snowflake_interval_day_time_cast"
marker = "::INTERVALDAY"
polyglot_errors = ["Invalid expression / Unexpected token"]
note = "x::INTERVAL DAY(2) TO SECOND(2) casts to a day-time interval type with its qualifiers, as the interval data type page documents; polyglot reads no qualifier after INTERVAL in a :: cast"

[[fix]]
id = "snowflake_interval_year_month_cast"
marker = "::INTERVALYEAR"
polyglot_errors = ["Invalid expression / Unexpected token"]
note = "x::INTERVAL YEAR(2) TO MONTH casts to a year-month interval type with its qualifiers, as the interval data type page documents; polyglot reads no qualifier after INTERVAL in a :: cast"

[[fix]]
id = "snowflake_ipaddress_literal"
marker = "IPADDRESS'"
polyglot_errors = ["Invalid expression / Unexpected token"]
note = "IPADDRESS '<address>' is the documented typed literal of the IPADDRESS type and is recorded; polyglot knows no IPADDRESS literal"

[[fix]]
id = "snowflake_array_spread"
marker = "(**"
polyglot_errors = ["Unexpected token: DStar"]
note = "** spreads an array into an IN list or a function's arguments, as the expansion operator page documents and Snowflake recorded; polyglot reads ** only as a binary operator"

[[fix]]
id = "snowflake_resample"
marker = "RESAMPLE(USING"
polyglot_errors = ['Expected identifier, got \"Using\"']
note = "FROM t RESAMPLE(USING col INCREMENT BY step ...) is documented and recorded; polyglot reads RESAMPLE as a table alias"

[[fix]]
id = "snowflake_bare_trailing_limit"
marker = "1LIMIT"
polyglot_errors = ["Unexpected token: Limit"]
note = "Snowflake accepts a bare trailing LIMIT (recorded as accepted) and reads it as LIMIT NULL; polyglot needs a count"

# Statements SQLQuack rejects where polyglot parses them or fails with another error. The check counts an entry as rejected only
# for this exact statement in a listed dialect when SQLQuack's error contains `sqlquack_error`;
# crates/sqlquack-syntax/src/parser/tests/test_typed_expressions.rs pins the error.

[[rejection]]
id = "malformed_typed_type_text"
sql = "SELECT __polyglot_typed(amount, 'NOT A TYPE (') FROM orders"
dialects = ["DuckDB"]
sqlquack_error = "Unexpected token after data type"
note = "malformed typed-expression type text errors instead of degrading to an ordinary call"

[[rejection]]
id = "snowflake_reserved_type_name"
sql = "SELECT __polyglot_typed(amount, 'NOT A TYPE (') FROM orders"
dialects = ["Snowflake"]
sqlquack_error = "Reserved word NOT cannot be an unquoted type name"
note = "the same malformed type text fails earlier in Snowflake, where NOT is reserved and cannot name a type"

[[rejection]]
id = "snowflake_cte_without_as"
