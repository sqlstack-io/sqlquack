# The call spellings SQLQuack keeps as written where polyglot lowers them into a cross-dialect
# node, in Snowflake. The exact check (crates/sqlquack-polyglot-check) puts each kept call back
# into polyglot's form by parsing the call's own text with polyglot's lowering; the result must
# equal polyglot's tree, and every (name, node) pair it puts back must be listed here.
#
# Every entry changes spelling only: the kept call is the written name and arguments, covering
# exactly the tokens polyglot's node covers. Where a note says polyglot merges spellings, keeping
# the call is what stops a rule written for one spelling from silently converting another.
# Calls in keyword syntax (EXTRACT(x FROM y), POSITION(a IN b), TRIM(BOTH ...)) stay typed.

[[spelling]]
name = "ABS"
polyglot = ["abs"]
note = "polyglot lowers it to node:abs"

