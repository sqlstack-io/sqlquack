sources:
  - name: orders
    columns:
      - name: order_id
        type: NUMBER(38,0)
      - name: customer_id
        type: NUMBER(38,0)
      - name: status
        type: VARCHAR
      - name: total
        type: NUMBER(12,2)
      - name: ordered_at
        type: TIMESTAMP_NTZ
  - name: customers
    columns:
      - name: customer_id
        type: NUMBER(38,0)
      - name: email
        type: VARCHAR
      - name: first_name
        type: VARCHAR
      - name: country
        type: VARCHAR
      - name: signup_date
        type: DATE
  - name: products
    columns:
      - name: product_id
        type: NUMBER(38,0)
      - name: name
        type: VARCHAR
      - name: category
        type: VARCHAR
      - name: price
        type: NUMBER(10,2)
  - name: order_items
    columns:
      - name: order_id
        type: NUMBER(38,0)
      - name: product_id
        type: NUMBER(38,0)
      - name: quantity
        type: NUMBER(38,0)
      - name: unit_price
        type: NUMBER(10,2)
  - name: events
    columns:
      - name: event_id
        type: NUMBER(38,0)
      - name: customer_id
        type: NUMBER(38,0)
      - name: event_type
        type: VARCHAR
      - name: occurred_at
        type: TIMESTAMP_NTZ
