valid = true

[[scenario]]
name = "qualify/with_group_by"
sql = "SELECT region, SUM(amount) AS total FROM orders GROUP BY region QUALIFY RANK() OVER (ORDER BY total DESC) = 1"
valid = true

[[scenario]]
name = "qualify/aggregate_window"
sql = "SELECT region FROM orders GROUP BY region QUALIFY SUM(SUM(amount)) OVER () > 1"
valid = true

[[scenario]]
name = "qualify/ungrouped_column"
sql = "SELECT region FROM orders GROUP BY region QUALIFY ROW_NUMBER() OVER (ORDER BY amount) = 1"

[[scenario]]
name = "qualify/before_order"
sql = "SELECT order_id FROM orders QUALIFY ROW_NUMBER() OVER (ORDER BY order_id) <= 3 ORDER BY order_id"
valid = true

[[scenario]]
name = "qualify/window_in_having"
sql = "SELECT region FROM orders GROUP BY region HAVING ROW_NUMBER() OVER (ORDER BY region) = 1"

