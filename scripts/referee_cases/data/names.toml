# Lateral joins and FLATTEN
[[scenario]]
name = "lateral/flatten"
sql = "SELECT p.product_id, f.value FROM products AS p, LATERAL FLATTEN(input => p.tags) AS f"
valid = true

[[scenario]]
name = "lateral/flatten_table"
sql = "SELECT f.value FROM products AS p, TABLE(FLATTEN(p.tags)) AS f"
valid = true

[[scenario]]
name = "lateral/flatten_unqualified"
sql = "SELECT value, index FROM products, LATERAL FLATTEN(input => tags)"
valid = true

[[scenario]]
name = "lateral/flatten_missing_column"
sql = "SELECT f.values FROM products AS p, LATERAL FLATTEN(input => p.tags) AS f"

[[scenario]]
name = "lateral/flatten_path"
sql = "SELECT f.key, f.path FROM orders AS o, LATERAL FLATTEN(input => o.details, recursive => TRUE) AS f"
valid = true

[[scenario]]
name = "lateral/subquery"
sql = "SELECT o.order_id, l.n FROM orders AS o, LATERAL (SELECT COUNT(*) AS n FROM order_lines AS x WHERE x.order_id = o.order_id) AS l"
valid = true

[[scenario]]
name = "lateral/variant_path"
sql = "SELECT details:customer.name::VARCHAR AS customer_name FROM orders"
valid = true

[[scenario]]
name = "lateral/variant_bracket"
sql = "SELECT details['items'][0] AS first_item FROM orders"
valid = true

# QUALIFY rules
[[scenario]]
name = "qualify/without_window"
