# Name-resolution scenarios. `valid = true` marks a statement written to compile, which the
# mutant generator then breaks one way at a time; the rest are left for Snowflake to decide.

# Lateral column aliases
[[scenario]]
name = "lateral/select"
sql = "SELECT amount * 2 AS doubled, doubled + 1 AS bumped FROM orders"
valid = true

[[scenario]]
name = "lateral/chain"
sql = "SELECT amount AS a, a * 2 AS b, b * 2 AS c FROM orders"
valid = true

[[scenario]]
name = "lateral/where"
sql = "SELECT amount * 2 AS doubled FROM orders WHERE doubled > 10"
valid = true

[[scenario]]
name = "lateral/group_by"
sql = "SELECT UPPER(status) AS s, COUNT(*) AS n FROM orders GROUP BY s"
valid = true

[[scenario]]
name = "lateral/having"
sql = "SELECT region, SUM(amount) AS total FROM orders GROUP BY region HAVING total > 1"
valid = true

[[scenario]]
name = "lateral/order_by"
sql = "SELECT amount * 2 AS doubled FROM orders ORDER BY doubled"
valid = true

[[scenario]]
name = "lateral/qualify"
sql = "SELECT order_id, ROW_NUMBER() OVER (ORDER BY amount) AS rn FROM orders QUALIFY rn = 1"
valid = true

[[scenario]]
name = "lateral/forward"
sql = "SELECT b + 1 AS a, amount AS b FROM orders"

[[scenario]]
name = "lateral/self"
sql = "SELECT a + 1 AS a FROM orders"

[[scenario]]
name = "lateral/aggregate_in_where"
sql = "SELECT SUM(amount) AS total FROM orders WHERE total > 1"

[[scenario]]
name = "lateral/window_in_where"
sql = "SELECT ROW_NUMBER() OVER (ORDER BY amount) AS rn FROM orders WHERE rn = 1"

[[scenario]]
name = "lateral/on_clause"
sql = "SELECT o.customer_id AS k FROM orders AS o JOIN customers AS c ON k = c.customer_id"

[[scenario]]
name = "lateral/in_subquery"
sql = "SELECT amount AS a, (SELECT a) AS b FROM orders"

# Shadowing: an alias with a column's name
[[scenario]]
name = "shadow/where_alias_named_column"
sql = "SELECT amount * 2 AS amount FROM orders WHERE amount > 10"
valid = true

[[scenario]]
name = "shadow/group_by_alias_named_column"
sql = "SELECT status AS region, COUNT(*) AS n FROM orders GROUP BY region"

[[scenario]]
name = "shadow/order_by_alias_named_column"
sql = "SELECT -amount AS amount FROM orders ORDER BY amount"
valid = true

[[scenario]]
name = "shadow/having_alias_named_column"
sql = "SELECT region, COUNT(*) AS amount FROM orders GROUP BY region HAVING amount > 1"

[[scenario]]
name = "shadow/cte_named_table"
sql = "WITH orders AS (SELECT 1 AS order_id) SELECT order_id FROM orders"
valid = true

[[scenario]]
name = "shadow/cte_missing_column"
sql = "WITH orders AS (SELECT 1 AS order_id) SELECT status FROM orders"

[[scenario]]
name = "shadow/subquery_alias_named_table"
sql = "SELECT customers.order_id FROM (SELECT order_id FROM orders) AS customers"
valid = true

[[scenario]]
name = "shadow/correlated_outer"
sql = "SELECT order_id FROM orders AS o WHERE EXISTS (SELECT 1 FROM customers AS c WHERE c.customer_id = o.customer_id)"
valid = true

[[scenario]]
name = "shadow/correlated_inner_wins"
sql = "SELECT order_id FROM orders WHERE region IN (SELECT region FROM customers)"
valid = true

[[scenario]]
name = "shadow/correlated_unqualified_outer"
sql = "SELECT order_id FROM orders WHERE EXISTS (SELECT 1 FROM customers WHERE customers.customer_id = orders.customer_id AND status = 'open')"
valid = true

[[scenario]]
name = "shadow/derived_column_list"
sql = "SELECT x FROM (SELECT order_id, status FROM orders) AS t (x, y)"
valid = true

[[scenario]]
name = "shadow/derived_column_list_hidden"
sql = "SELECT order_id FROM (SELECT order_id, status FROM orders) AS t (x, y)"

[[scenario]]
name = "shadow/derived_column_list_too_long"
sql = "SELECT x FROM (SELECT order_id FROM orders) AS t (x, y)"

[[scenario]]
name = "shadow/cte_column_list"
sql = "WITH t (x) AS (SELECT order_id FROM orders) SELECT x FROM t"
valid = true

[[scenario]]
name = "shadow/cte_reused"
sql = "WITH t AS (SELECT order_id FROM orders) SELECT a.order_id FROM t AS a JOIN t AS b ON a.order_id = b.order_id"
valid = true

[[scenario]]
name = "shadow/table_alias_hides_name"
sql = "SELECT orders.order_id FROM orders AS o"

[[scenario]]
name = "shadow/values_columns"
sql = "SELECT column1, column2 FROM (VALUES (1, 'a'), (2, 'b'))"
valid = true

[[scenario]]
name = "shadow/values_alias_list"
sql = "SELECT v.n FROM (VALUES (1), (2)) AS v (n)"
valid = true

[[scenario]]
name = "shadow/values_positional"
sql = "SELECT $1 FROM (VALUES (1), (2))"
valid = true

