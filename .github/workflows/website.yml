name: Website

# Builds and checks the playground engine and the site with Website Build, and deploys sqlquack.io to
# GitHub Pages from main. Pull requests build the site in CI.
on:
  public:
  push:
    branches: [main]
    paths:
      - website/**
      - crates/sqlquack-diagnostics/**
      - crates/sqlquack-parse/**
      - crates/sqlquack-blocks/**
      - crates/sqlquack-convert/**
      - crates/sqlquack-derive/**
      - crates/sqlquack-policy/**
      - crates/sqlquack-semantics/**
      - crates/sqlquack-syntax/**
      - crates/sqlquack-syntax-snowflake/**
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    uses: ./.github/workflows/website-build.yml
    with:
      upload: true

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
