name: Distributions

# Builds and smoke tests the linux-x86_64 wheels when a pull request changes what goes into them,
# and on every push to main, so a distribution-only failure shows at the landing rather than at the
# next release. Both also run the command line's convert tests with DuckDB compiled in. Every
# platform and the sdists build nightly and for each release. Neither blocks a landing.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "python/**"
      - "crates/sqlquack/pyproject.toml"
      - "crates/sqlquack-python/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/build-distributions.yml"
      - ".github/workflows/distributions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  distributions:
    name: Distributions
    uses: ./.github/workflows/build-distributions.yml
    with:
      platforms: ${{ github.event_name == 'workflow_dispatch' && '' || 'linux-x86_64' }}
      sdist: ${{ github.event_name == 'workflow_dispatch' }}

  # The command line built with `bundled` alone, as the sqlquack wheel compiles DuckDB in: no system
  # DuckDB.
  bundled-convert:
    name: Convert with DuckDB compiled in
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Run the convert tests
        run: >-
          cargo test --locked -p sqlquack --features bundled --test cli --
          given_snowflake_sql_when_converting_then_duckdb_sql_or_named_refusals_are_printed
          given_zone_free_snowflake_sql_when_converting_then_the_checking_engine_binds_it
          given_the_linked_duckdb_when_asked_its_version_then_it_names_the_pinned_release
