name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # The Snowflake recorder is never built or run in CI.
      RECORDER: "0"
      # `uv run` would otherwise sync the default groups, recorder included.
      UV_NO_SYNC: "1"
      # The append-only guard compares recorded results with the pull request base or the
      # previous main commit.
      EVIDENCE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      # Caches the dependency builds, polyglot above all, keyed by Cargo.lock and the toolchain.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: verify
      - name: Install Python
        run: uv python install 3.12
      - name: Install development tools without the recorder
        run: uv sync --locked --no-group recorder
      - name: Run static checks
        run: make check-ci
      - name: Run tests
        run: make test
