name: Build Distributions

# The single owner of the wheel platform matrix, the maturin settings and the distribution smoke
# tests. Distributions builds the wheels for pull requests that touch packaging, Release
# Distributions builds and keeps every distribution for a release pull request, and Publish either
# smoke tests and reuses those distributions or builds them here from the release tag.
on:
  workflow_call:
    inputs:
      ref:
        description: "Commit, tag or branch to build; empty builds the triggering commit"
        required: false
        type: string
        default: ""
      sdist:
        description: "Also build the source distributions"
        required: false
        type: boolean
        default: true
      upload:
        description: "Upload the distributions and a manifest recording their source commit and tree"
        required: false
        type: boolean
        default: false
      prebuilt-run-id:
        description: >-
          Release Distributions run whose distributions are smoke tested and uploaded instead of
          building; its manifest must record the tree of ref. The caller grants actions: read.
        required: false
        type: string
        default: ""
      retention-days:
        description: "Retention of uploaded artifacts in days; 0 uses the repository default"
        required: false
        type: number
        default: 0
      platforms:
        description: "Comma-separated wheel platforms to build, such as linux-x86_64; empty builds all"
        required: false
        type: string
        default: ""
    outputs:
      sha:
        description: "Commit the distributions were built from"
        value: ${{ jobs.source.outputs.sha }}
      tree:
        description: "Tree of the commit the distributions were built from"
        value: ${{ jobs.source.outputs.tree }}

jobs:
  source:
    name: Resolve source
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tree: ${{ steps.source.outputs.tree }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Pin the source commit
        id: source
        run: |
          sha="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "tree=${tree}" >> "${GITHUB_OUTPUT}"
          echo "Distributions for commit ${sha} with tree ${tree}" >> "${GITHUB_STEP_SUMMARY}"
      # The wheel platform matrix. DuckDB's C++ needs aligned deallocation, available from macOS 10.13.
      # The Intel macOS wheels cross-compile on Apple silicon, which builds faster than the Intel
      # runners, and are smoke tested there under Rosetta 2 with an Intel Python (`python-arch`).
      - name: Choose the wheel platforms
        id: platforms
        env:
          ONLY: ${{ inputs.platforms }}
        run: |
          all='[
            {"name": "linux-x86_64", "runner": "ubuntu-24.04", "target": "x86_64"},
            {"name": "linux-aarch64", "runner": "ubuntu-24.04-arm", "target": "aarch64"},
            {"name": "macos-x86_64", "runner": "macos-15", "target": "x86_64", "macos-target": "10.15", "python-arch": "x64"},
            {"name": "macos-arm64", "runner": "macos-15", "target": "aarch64", "macos-target": "11.0"},
            {"name": "windows-x86_64", "runner": "windows-2025", "target": "x86_64"}
          ]'
          chosen="$(jq -c --arg only "${ONLY}" \
            'if $only == "" then . else [.[] | select(.name as $name | $only | split(",") | index($name))] end' \
            <<< "${all}")"
          if [[ "${chosen}" == "[]" ]]; then
            echo "No wheel platform is named ${ONLY}" >&2
            exit 1
          fi
          echo "platforms=${chosen}" >> "${GITHUB_OUTPUT}"
          echo "Wheel platforms: $(jq -r 'map(.name) | join(", ")' <<< "${chosen}")" >> "${GITHUB_STEP_SUMMARY}"
      - name: Download the prebuilt manifest
        if: inputs.prebuilt-run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/prebuilt
          run-id: ${{ inputs.prebuilt-run-id }}
          github-token: ${{ github.token }}
      - name: Require prebuilt distributions from this exact tree
        if: inputs.prebuilt-run-id != ''
        env:
          MANIFEST: ${{ runner.temp }}/prebuilt/release-manifest.json
          PREBUILT_RUN_ID: ${{ inputs.prebuilt-run-id }}
          TREE: ${{ steps.source.outputs.tree }}
        run: |
          recorded="$(jq -r '.tree // empty' "${MANIFEST}")"
          if [[ "${recorded}" != "${TREE}" ]]; then
            echo "Run ${PREBUILT_RUN_ID} built tree ${recorded:-<none>}, not ${TREE}" >&2
            exit 1
          fi
          echo "Reusing distributions of run ${PREBUILT_RUN_ID}, built from tree ${TREE}" \
            >> "${GITHUB_STEP_SUMMARY}"

  wheels:
    name: Build wheels (${{ matrix.platform.name }})
    needs: source
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.source.outputs.platforms) }}
    env:
      # sccache's object cache for DuckDB's C and C++, inside the workspace so the manylinux
      # container, which mounts the workspace at the same path, reads and writes it too.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache-cache
      SCCACHE_CACHE_SIZE: 4G
    steps:
      - uses: actions/checkout@v4
        if: inputs.prebuilt-run-id == ''
        with:
          ref: ${{ needs.source.outputs.sha }}
      - name: Install Rosetta 2 for the Intel Python
        if: matrix.platform.python-arch == 'x64' && runner.os == 'macOS'
        run: |
          if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python-arch }}
      # Both maturin steps compile DuckDB's C and C++ through sccache, so the second step reads the
      # first one's objects instead of compiling them again, and the cache restored below carries
      # them across runs. Compiler launchers need a Makefile or Ninja generator, so Windows builds
      # DuckDB with Ninja instead of the default Visual Studio generator.
      - name: Install sccache for DuckDB's C and C++
        if: inputs.prebuilt-run-id == ''
        shell: bash
        env:
          VERSION: v0.19.0
        run: |
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset=x86_64-unknown-linux-musl sum=aa73c7270c997894038c0d8f0d297865f57569e1687883322bc431713d4bb9dd ;;
            Linux-ARM64) asset=aarch64-unknown-linux-musl sum=3e47fc4a71b1ddd1b4294a0de9d34498922fdf41e3cd0bda5df3954e3d6deb9d ;;
            macOS-ARM64) asset=aarch64-apple-darwin sum=a35a0b7d622618774bc1bb8102d72562dfb21e619f88b153b370d7f89bc286af ;;
            Windows-X64) asset=x86_64-pc-windows-msvc sum=130e4f8eb672e76590e9993c2ab890c4763b88238577bb11d8062158c7698353 ;;
            *) echo "No pinned sccache for ${RUNNER_OS}-${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          sha256() { if command -v sha256sum > /dev/null; then sha256sum "$@"; else shasum -a 256 "$@"; fi; }
          name="sccache-${VERSION}-${asset}"
          curl -fsSL -o "${RUNNER_TEMP}/${name}.tar.gz" \
            "https://github.com/mozilla/sccache/releases/download/${VERSION}/${name}.tar.gz"
          echo "${sum}  ${RUNNER_TEMP}/${name}.tar.gz" | sha256 -c -
          tools="${GITHUB_WORKSPACE}/.sccache-bin"
          mkdir -p "${tools}"
          tar -xzf "${RUNNER_TEMP}/${name}.tar.gz" -C "${tools}" --strip-components 1
          launcher="${tools}/sccache"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            launcher="$(cygpath -m "${tools}/sccache.exe")"
            python -m pip install --quiet "ninja==1.13.0"
            echo "CMAKE_GENERATOR=Ninja" >> "${GITHUB_ENV}"
          fi
          "${launcher}" --version
          echo "CMAKE_C_COMPILER_LAUNCHER=${launcher}" >> "${GITHUB_ENV}"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=${launcher}" >> "${GITHUB_ENV}"
          # The cache key names DuckDB's sources, its version name, its features, the profile, the
          # target and the CMake settings; sccache itself still checks every object's exact inputs.
          duckdb="$(grep -m 1 -o 'duckdb-rs?rev=[0-9a-f]*' Cargo.lock)"
          describe="$(grep -m 1 '^OVERRIDE_GIT_DESCRIBE' .cargo/config.toml)"
          features="$(grep -E '^(bundled|extensions) =' crates/sqlquack-blocks/Cargo.toml)"
          settings="${duckdb} ${describe} ${features} release ${{ matrix.platform.target }}"
          settings="${settings} ${{ matrix.platform.macos-target }} ${RUNNER_OS} ${VERSION}"
          key="$(sha256 <<< "${settings}" | cut -c 1-16)"
          echo "DUCKDB_CACHE_KEY=duckdb-objects-v1-${{ matrix.platform.name }}-${key}" >> "${GITHUB_ENV}"
      # Restored on every build, but saved only from main (below), so a release or publish build
      # never reads objects another branch compiled.
      - name: Restore DuckDB's compiled objects
        if: inputs.prebuilt-run-id == ''
        uses: actions/cache/restore@v4
        with:
          path: .sccache-cache
          key: ${{ env.DUCKDB_CACHE_KEY }}-${{ github.run_id }}
          restore-keys: ${{ env.DUCKDB_CACHE_KEY }}-
      # Both wheels compile DuckDB in (the `bundled` feature), so neither needs a system DuckDB.
      - name: Set the oldest macOS the wheels support
        if: matrix.platform.macos-target
        shell: bash
        run: echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.platform.macos-target }}" >> "$GITHUB_ENV"
      # DuckDB's CMake build nests object paths deep enough to pass Windows' path limit under the
      # default target directory, and MSVC then fails with C1083; a short target directory avoids it.
      - name: Shorten the build path on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"
      # The DuckDB sources checkout the workspace patches duckdb to, fetched once per lock.
      - name: Cache Cargo's git checkouts
        if: inputs.prebuilt-run-id == ''
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git/db
          key: cargo-git-${{ matrix.platform.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-git-${{ matrix.platform.name }}-
      - uses: PyO3/maturin-action@v1
        if: inputs.prebuilt-run-id == ''
        with:
          command: build
          args: --release --locked --out ../dist
          working-directory: python
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"
      - uses: PyO3/maturin-action@v1
        if: inputs.prebuilt-run-id == ''
        with:
          command: build
          args: --release --locked --out ../../dist
          working-directory: crates/sqlquack
          target: ${{ matrix.platform.target }}
          manylinux: "2_28"
      - name: Report sccache's hits
        if: inputs.prebuilt-run-id == '' && runner.os != 'Linux'
        shell: bash
        run: '"${CMAKE_C_COMPILER_LAUNCHER}" --stop-server'
      - name: Save DuckDB's compiled objects from main
        if: inputs.prebuilt-run-id == '' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: .sccache-cache
          key: ${{ env.DUCKDB_CACHE_KEY }}-${{ github.run_id }}
      - name: Download prebuilt wheels
        if: inputs.prebuilt-run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: dist-wheel-${{ matrix.platform.name }}
          path: dist
          run-id: ${{ inputs.prebuilt-run-id }}
          github-token: ${{ github.token }}
      - name: Smoke test the installed wheels as the site's quick start runs them
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-smoke"
          if [[ -x "${RUNNER_TEMP}/wheel-smoke/Scripts/python.exe" ]]; then
            bin="${RUNNER_TEMP}/wheel-smoke/Scripts"
          else
            bin="${RUNNER_TEMP}/wheel-smoke/bin"
          fi
          ls -l dist | tee -a "${GITHUB_STEP_SUMMARY}"
          # Only the wheels just built: sqlquack-cli must resolve from dist, never from an index.
          "${bin}/python" -m pip install --no-index --find-links dist sqlquack
          cd "${RUNNER_TEMP}"
          "${bin}/sqlquack" --version
          "${bin}/python" -c "import sqlquack.api"
          set +e
          check="$(echo "SELECT 1 QUALIFY TRUE" | "${bin}/sqlquack" check 2>&1)"
          status=$?
          set -e
          echo "${check}"
          if [[ ${status} -ne 1 ]] || ! grep -q 'error\[SQ0203\]' <<< "${check}"; then
            echo "check should refuse QUALIFY without a window function with SQ0203 and exit 1" >&2
            exit 1
          fi
          converted="$(echo "SELECT 1 AS total" | "${bin}/sqlquack" convert --builtin-policy)"
          echo "${converted}"
          grep -qx 'SELECT CAST(1 AS DECIMAL(1,0)) AS "TOTAL"' <<< "${converted}"
          # A file converted in a project folder, with no sqlquack.toml in it: the built-in policy.
          mkdir readme-smoke && cd readme-smoke
          printf "SELECT customer_id, SUM(total) AS revenue\nFROM orders\nGROUP BY customer_id\n" > query.sql
          mkdir sources
          printf 'sources:\n  - name: orders\n    columns:\n      - name: customer_id\n        type: NUMBER(38,0)\n      - name: total\n        type: NUMBER(12,2)\n' > sources/orders.yml
          "${bin}/sqlquack" check query.sql
          converted="$("${bin}/sqlquack" convert query.sql)"
          echo "${converted}"
          grep -q 'CAST(sum("ORDERS"."TOTAL") AS DECIMAL(24,2)) AS "REVENUE"' <<< "${converted}"
          # run executes the conversion on the bundled DuckDB, over inline rows and over a CSV file.
          "${bin}/sqlquack" run query.sql --fixture 'orders=[[1, 2.5], [1, 4]]' --expect '[[1, 6.5]]'
          printf 'customer_id,total\n2,1.25\n' > orders.csv
          ran="$("${bin}/sqlquack" run query.sql --fixture orders=./orders.csv)"
          echo "${ran}"
          grep -q '^2 *1.25$' <<< "${ran}"
          # The README's Python example.
          "${bin}/python" -c 'import sqlquack
          result = sqlquack.convert(sql="SELECT 1 AS total", options=sqlquack.ConvertOptions(builtin_policy=True))
          assert result.sql == "SELECT CAST(1 AS DECIMAL(1,0)) AS \"TOTAL\"", result.sql'
      - uses: actions/upload-artifact@v4
        if: inputs.upload
        with:
          name: dist-wheel-${{ matrix.platform.name }}
          path: dist
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  sdist:
    name: Build sdists
    needs: source
    if: inputs.sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        if: inputs.prebuilt-run-id == ''
        with:
          ref: ${{ needs.source.outputs.sha }}
      - uses: PyO3/maturin-action@v1
        if: inputs.prebuilt-run-id == ''
        with:
          command: sdist
          args: --out ../dist
          working-directory: python
      - uses: PyO3/maturin-action@v1
        if: inputs.prebuilt-run-id == ''
        with:
          command: sdist
          args: --out ../../dist
          working-directory: crates/sqlquack
      - name: Download prebuilt source distributions
        if: inputs.prebuilt-run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: dist-sdist
          path: dist
          run-id: ${{ inputs.prebuilt-run-id }}
          github-token: ${{ github.token }}
      - name: Inspect source distribution contents
        run: |
          for archive in dist/*.tar.gz; do
            tar -tzf "$archive" > "${RUNNER_TEMP}/archive-contents.txt"
            if grep -E '(__pycache__/|\.pyc$|\.tmp$)' "${RUNNER_TEMP}/archive-contents.txt"; then
              echo "Source distribution contains generated or temporary script files"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        if: inputs.upload
        with:
          name: dist-sdist
          path: dist
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  manifest:
    name: Record distribution source
    needs: [source, wheels, sdist]
    if: >-
      ${{ !cancelled() && inputs.upload && needs.wheels.result == 'success'
      && (needs.sdist.result == 'success' || needs.sdist.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Write the manifest
        env:
          SHA: ${{ needs.source.outputs.sha }}
          TREE: ${{ needs.source.outputs.tree }}
        run: |
          jq -n --arg sha "${SHA}" --arg tree "${TREE}" --arg run_id "${GITHUB_RUN_ID}" \
            '{sha: $sha, tree: $tree, run_id: $run_id}' \
            > "${RUNNER_TEMP}/release-manifest.json"
          cat "${RUNNER_TEMP}/release-manifest.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
