# SQLQuack's own project configuration: it allows every known difference its recorded cases
# replay with, so converting here behaves as the evidence does. The evidence policy itself, with
# the built-in defaults every user gets, is crates/sqlquack-policy/evidence.toml.

[allow]
numeric_range = true
text_similarity = true
array_sort_order = true
case_folding = true
json_fidelity = true
variant_chain_type = true
source_variant_json = true
user_override = true
python_value_crossing = true
declared_offset = true
session_timezone_utc = true
percentile_interpolation = true
time_zone_spelling = true
mode_of_no_rows = true
timestamp_tz_offset = true
date_text_spelling = true
variant_typed_values = true
timestamp_range = true
timestamp_tz_submicro = true
float_text = true
regexp_pattern_syntax = true
float_sum_order = true
extreme_key_ties = true
mode_ties = true
array_agg_order = true
listagg_order = true
text_number_scale = true
random = true
uuid = true
sequences = true
initcap_text = true
current_time = true
time_submicro = true
any_value_choice = true
float_decimal_digits = true
timestamp_text_rounding = true
