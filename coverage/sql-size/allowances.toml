ruling = "Accepted: 100 cases grow by 8,384 bytes in total (0.09%) because rounded decimal quotients use integer doubling again instead of a narrowing DECIMAL cast. The cast cost ~4,350 instructions per row in DuckDB; the change halves decimal_divide's instructions (7,489 to 3,593 per row) with identical results across the full replay. Reviewed by the release orchestrator."

