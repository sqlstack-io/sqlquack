[[no_form]]
constructs = ["node:column", "node:alias", "node:null", "node:boolean", "node:paren", "node:annotated"]
reason = "Column references, aliases, NULL, TRUE and FALSE, parentheses and comments are part of every form's grammar rather than forms of their own."

[[no_form]]
constructs = ["node:var"]
reason = "A date or time part keyword such as YEAR is an argument of the function that takes it."

[[no_form]]
constructs = ["node:lambda", "node:named_argument", "node:within_group"]
reason = "Lambda arguments, named arguments and WITHIN GROUP belong to the function forms that take them, which link by name."

[[no_form]]
constructs = ["node:method_call"]
reason = "A schema-qualified call such as SNOWFLAKE.CORE.NULL_COUNT(...) links by its qualified name and call shape, like any other call."

[[no_form]]
constructs = ["fn:<udf>"]
reason = "A project function the case itself defines, which is not documented Snowflake syntax."
