[[group]]
id = "data-metrics-approximate-or-parser-defined"
reason = "System data metric functions whose result is approximate or defined by Snowflake's own parsing: the approximate quantiles use APPROX_PERCENTILE, so the value is an estimate, and the invalid JSON, numeric type cast and timestamp string counts take a value as valid when Snowflake's own parse or TRY_TO_ function accepts it. No DuckDB expression can be shown to give the same result."
