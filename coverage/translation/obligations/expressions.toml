reading = "the date and time page: DATETIME is synonymous with TIMESTAMP_NTZ"
cases = ["cases/translation/expressions/data-types-datetime.datetime.toml#t003_null"]
required = true

[[obligation]]
id = "sf.expressions.data-types-datetime.interval.t001"
form = "sf.expressions.data-types-datetime.interval"
kind = "type_combination"
target = "DATE + INTERVAL 'Y-MM' YEAR TO MONTH"
note = "The page's examples: 2024-01-01 plus INTERVAL '1-1' YEAR TO MONTH is 2025-02-01, and plus '-1-1' is 2022-12-01; a month-end date shows how the month step clamps, which the page doesn't state, so the recording decides."
catches = "the year and month parts swapped, the sign applied to one part only, or the interval read as days"
reading = "the date and time page, interval literals: INTERVAL '[sign]<string>' with a year-month or day-time qualifier; singular and plural parts are equivalent; the year-month format is Y-MM and the day-time format D HH24:MI:SS.F; a date plus INTERVAL '1-1' YEAR TO MONTH from 2024-01-01 is 2025-02-01"
cases = ["cases/translation/expressions/data-types-datetime.interval.toml#t001_year_month"]
required = true

[[obligation]]
id = "sf.expressions.data-types-datetime.interval.t002"
form = "sf.expressions.data-types-datetime.interval"
kind = "type_combination"
target = "TIMESTAMP_NTZ + INTERVAL 'D HH:MI:SS.F' DAY TO SECOND"
note = "A day-time literal with fractional seconds added to a timestamp, as in the page's example."
catches = "the fraction dropped, the day part read as hours, or the timestamp converted to a zone"
reading = "the date and time page, interval literals: INTERVAL '[sign]<string>' with a year-month or day-time qualifier; singular and plural parts are equivalent; the year-month format is Y-MM and the day-time format D HH24:MI:SS.F; a date plus INTERVAL '1-1' YEAR TO MONTH from 2024-01-01 is 2025-02-01"
cases = ["cases/translation/expressions/data-types-datetime.interval.toml#t002_day_second"]
required = true

[[obligation]]
id = "sf.expressions.data-types-datetime.interval.t003"
form = "sf.expressions.data-types-datetime.interval"
kind = "type_combination"
target = "INTERVAL '3' DAYS"
note = "The page: INTERVAL '3' DAY and INTERVAL '3' DAYS are equivalent; 2026-04-01 plus three days is 2026-04-04."
catches = "the plural part rejected or read as another unit"
reading = "the date and time page, interval literals: INTERVAL '[sign]<string>' with a year-month or day-time qualifier; singular and plural parts are equivalent; the year-month format is Y-MM and the day-time format D HH24:MI:SS.F; a date plus INTERVAL '1-1' YEAR TO MONTH from 2024-01-01 is 2025-02-01"
cases = []
required = true
held = "waits on #118: DATE + INTERVAL 'n' DAYS converts as TIMESTAMP_NTZ(9)"

