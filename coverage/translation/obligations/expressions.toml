[[obligation]]
id = "sf.expressions.data-types-datetime.time.t001"
form = "sf.expressions.data-types-datetime.time"
kind = "type_combination"
target = "TIME, TIME(3) and TIME(0)"
note = "TIME keeps all nine fractional digits by default; TIME(3) keeps three and TIME(0) none, read here as the nanosecond part, since the connector carries TIME only to microseconds. Whether the cut rounds or truncates is not on the page, so the recording decides."
catches = "the default read as 6 digits or 0, or the precision ignored"
reading = "the date and time page: TIME holds wall-clock HH:MI:SS with an optional precision of 0 to 9 fractional digits, 9 by default, between 00:00:00 and 23:59:59.999999999, with no time zone; TIMESTAMP is an alias of the TIMESTAMP_* type that TIMESTAMP_TYPE_MAPPING names, TIMESTAMP_NTZ by default, and takes the same optional precision"
cases = ["cases/translation/expressions/data-types-datetime.time.toml#t001_precision"]
required = true

