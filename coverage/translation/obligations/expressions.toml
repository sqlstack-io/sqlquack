kind = "null_argument"
target = "query"
note = "A subquery returning only a NULL value still returns a row, so EXISTS is TRUE."
catches = "a row of NULL counted as no row"
reading = "operators-subquery: expr op ALL/ANY (query) and [NOT] IN (query) compare against every value the subquery returns, in a WHERE clause; IN is = ANY and NOT IN is != ALL; [NOT] EXISTS is TRUE when the subquery returns rows (or none)"
cases = ["cases/translation/expressions/operators-subquery.exists.toml#t003_null_row"]
required = true

