# Translation obligations of family expressions: per form, the documented type
# combinations, NULL in each argument, boundaries and error parity, each met by its
# cases under cases/translation. Hand-written; see coverage/translation/README.md.

[[obligation]]
id = "sf.expressions.data-types-datetime.datetime.t001"
form = "sf.expressions.data-types-datetime.datetime"
kind = "type_combination"
target = "VARCHAR to DATETIME"
note = "Text cast to DATETIME and to TIMESTAMP_NTZ side by side, with fractional seconds; the two must be equal and keep the wall-clock time."
catches = "DATETIME read as a time-zone-aware type (an offset applied) or as DATE (time dropped)"
reading = "the date and time page: DATETIME is synonymous with TIMESTAMP_NTZ"
cases = ["cases/translation/expressions/data-types-datetime.datetime.toml#t001_from_text"]
required = true

[[obligation]]
id = "sf.expressions.data-types-datetime.datetime.t002"
form = "sf.expressions.data-types-datetime.datetime"
kind = "type_combination"
target = "DATE to DATETIME"
note = "A DATE cast to DATETIME is that day at midnight."
catches = "the date shifted by a time zone, or a DATE result"
reading = "the date and time page: DATETIME is synonymous with TIMESTAMP_NTZ"
cases = ["cases/translation/expressions/data-types-datetime.datetime.toml#t002_from_date"]
required = true

[[obligation]]
id = "sf.expressions.data-types-datetime.datetime.t003"
form = "sf.expressions.data-types-datetime.datetime"
