[[obligation]]
id = "sf.query.asof-join.t001"
form = "sf.query.asof-join"
kind = "type_combination"
target = "MATCH_CONDITION (l.ts >= r.ts) ON sym"
note = "Each trade with the latest quote at or before it, per symbol; the trade at time 1 has none."
catches = "the closest quote after the trade taken, or symbols mixed"
reading = "asof-join: for each left row, the right row with the closest time satisfying MATCH_CONDITION, within the ON keys; no match gives NULLs"
cases = ["cases/translation/query/asof-join.toml#t001_ge"]
required = true

