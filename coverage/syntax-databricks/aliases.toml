# Retired form ids of the Databricks catalogue. Each old id stays in the catalogue with status
# absent_from_source, is never reused, and counts in no total; `to` lists the forms that now carry
# its grammar, and `reason` cites the pinned page revision that shows it.

[[alias]]
from = "db.functions.ilike.any-some-all"
to = ["db.functions.ilike.ilike-any-some-all"]
reason = "the pinned functions/ilike page (page_sha256 a17d734d8e8b3864..., retrieved 2026-11-16) still shows str [ NOT ] ilike { ANY | SOME | ALL } ( [ pattern [, ...] ] ); this id read the lower-case ilike as a placeholder, and the line is now read with ILIKE as the operator, its pattern list required as hand.toml records (EMPTY_QUANTIFIED_PATTERN)"

