# Same-tree variants the tree screen (syntax-coverage screen) accepts, each with why the two texts
# are no collapse. Every other accepted variant that changes one token (drop, TEMP/TEMPORARY, quote,
# unquote, backquote) and parses to the same tree blocks a form's approval.
#
# [[allowed]]
# form = "<form id>"
# mutation = "drop | swap | backquote | string | unquote"
# token = "<the token as the case writes it>"   # optional: only this token
# reason = "<why the grammar treats the two texts the same>"

[[allowed]]
form = "db.expressions.comment"
mutation = "drop"
reason = "the changed token is inside a /* ... */ comment, whose text the grammar never reads; the tree keeps no comment text"

[[allowed]]
form = "db.expressions.comment"
mutation = "backquote"
reason = "the changed token is inside a /* ... */ comment, whose text the grammar never reads; the tree keeps no comment text"

[[allowed]]
form = "db.expressions.comment"
mutation = "string"
reason = "the changed token is inside a /* ... */ comment, whose text the grammar never reads; the tree keeps no comment text"

[[allowed]]
form = "db.query.select-hints.join-hint-alias"
mutation = "backquote"
reason = "a hint is a comment the warehouse reads as hint text: a backquoted hint name or relation inside /*+ ... */ is no identifier the statement's grammar parses, so the statement's tree is the same"

[[allowed]]
form = "db.transaction_session.conf-mgmt-set-query-tags.query-tags.syntax"
mutation = "drop"
token = ";"
reason = "a trailing ; ends the statement and is no part of it; the text with and without it is the same statement"
