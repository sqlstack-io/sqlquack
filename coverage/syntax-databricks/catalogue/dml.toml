[[form]]
id = "db.dml.copy-into"
family = "dml"
source = "doc.delta-copy-into"
anchor = "Syntax"
kind = "statement"
grammar = [
  "COPY INTO <target_table> [ BY POSITION | ( <col_name> [ , <col_name> ... ] ) ] FROM { <source_clause> | ( SELECT <expression_list> FROM <source_clause> ) } FILEFORMAT = <data_source> [ VALIDATE [ ALL | <num_rows> ROWS ] ] [ FILES = ( <file_name> [ , ... ] ) | PATTERN = <glob_pattern> ] [ FORMAT_OPTIONS ( { <data_source_reader_option> = <value> } [ , ... ] ) ] [ COPY_OPTIONS ( { <copy_option> = <value> } [ , ... ] ) ]",
]
grammar_sha256 = "80dd8afa8fc618542b6e7dc8ada3679ef52ffd9c089412d69f0ca6f7d5cf0560"
uses = [
  "source_clause",
]
status = "catalogued"

