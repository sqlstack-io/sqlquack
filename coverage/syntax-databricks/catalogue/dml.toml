[[definition]]
id = "doc.delta-copy-into::source_clause"
source = "doc.delta-copy-into"
name = "source_clause"
grammar = "<source_clause> ::= <source> [ WITH ( [ CREDENTIAL { <credential_name> | ( <temporary_credential_options> ) } ] [ ENCRYPTION ( <encryption_options> ) ] ) ]"

[[definition]]
id = "doc.delta-merge-into::matched_action"
source = "doc.delta-merge-into"
name = "matched_action"
grammar = "<matched_action> ::= { DELETE | UPDATE SET * [ EXCEPT ( <column> [ , ... ] ) ] | UPDATE SET { <column> = { <expr> | DEFAULT } } [ , ... ] }"

[[definition]]
id = "doc.delta-merge-into::not_matched_action"
source = "doc.delta-merge-into"
name = "not_matched_action"
grammar = "<not_matched_action> ::= { INSERT * [ EXCEPT ( <column> [ , ... ] ) ] | INSERT ( <column1> [ , ... ] ) VALUES ( { <expr> | DEFAULT } [ , ... ] ) }"

[[definition]]
id = "doc.delta-merge-into::not_matched_by_source_action"
source = "doc.delta-merge-into"
name = "not_matched_by_source_action"
grammar = "<not_matched_by_source_action> ::= { DELETE | UPDATE SET { <column> = { <expr> | DEFAULT } } [ , ... ] }"
