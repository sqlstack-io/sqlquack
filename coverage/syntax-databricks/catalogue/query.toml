source = "doc.sql-ref-syntax-qry-select-cte"
name = "recursive_query"
grammar = "<recursive_query> ::= <base_case_query> UNION ALL <step_case_query>"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-groupby::grouping_set"
source = "doc.sql-ref-syntax-qry-select-groupby"
name = "grouping_set"
grammar = "<grouping_set> ::= { <expression> | ( [ <expression> [ , ... ] ] ) }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-hints::join_hint"
source = "doc.sql-ref-syntax-qry-select-hints"
name = "join_hint"
grammar = "<join_hint> ::= BROADCAST ( <table_name> ) | MERGE ( <table_name> ) | SHUFFLE_HASH ( <table_name> ) | SHUFFLE_REPLICATE_NL ( <table_name> )"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-hints::partition_hint"
source = "doc.sql-ref-syntax-qry-select-hints"
name = "partition_hint"
grammar = "<partition_hint> ::= COALESCE ( <part_num> ) | REPARTITION ( { <part_num> | [ <part_num> , ] <column_name> [ , ... ] } ) | REPARTITION_BY_RANGE ( <part_num> [ , <column_name> [ , ... ] ] | <column_name> [ , ... ] ) | REBALANCE [ ( <column_name> [ , ... ] ) ]"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-join::join_criteria"
source = "doc.sql-ref-syntax-qry-select-join"
name = "join_criteria"
grammar = "<join_criteria> ::= { ON <boolean_expression> | USING ( <column_name> [ , ... ] ) }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-join::join_type"
source = "doc.sql-ref-syntax-qry-select-join"
name = "join_type"
grammar = "<join_type> ::= { [ INNER ] | LEFT [ OUTER ] | [ LEFT ] SEMI | RIGHT [ OUTER ] | FULL [ OUTER ] | [ LEFT ] ANTI | CROSS }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-match-recognize-pattern::pattern_operator"
source = "doc.sql-ref-syntax-qry-select-match-recognize-pattern"
name = "pattern_operator"
grammar = "<pattern_operator> ::= { ( [ <row_pattern> ] ) | PERMUTE ( <row_pattern> [ , ... ] ) | <row_pattern> \\| <row_pattern> | <row_pattern> <row_pattern> }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-match-recognize-pattern::pattern_primary"
source = "doc.sql-ref-syntax-qry-select-match-recognize-pattern"
name = "pattern_primary"
grammar = "<pattern_primary> ::= { <variable> | $ | ^ }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-match-recognize-pattern::pattern_quantifier"
source = "doc.sql-ref-syntax-qry-select-match-recognize-pattern"
name = "pattern_quantifier"
grammar = "<pattern_quantifier> ::= { * | + | ? | { <n> } | { <min> , [ <max> ] } | { , <max> } }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-match-recognize-pattern::row_pattern"
source = "doc.sql-ref-syntax-qry-select-match-recognize-pattern"
name = "row_pattern"
grammar = "<row_pattern> ::= { { <pattern_primary> | <pattern_operator> } [ <pattern_quantifier> ] }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-match-recognize::measures"
source = "doc.sql-ref-syntax-qry-select-match-recognize"
name = "measures"
grammar = "<measures> ::= MEASURES { <measure_expr> AS <measure_name> } [ , ... ]"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-match-recognize::row_pattern_rows_per_match"
source = "doc.sql-ref-syntax-qry-select-match-recognize"
name = "row_pattern_rows_per_match"
grammar = "<row_pattern_rows_per_match> ::= { ONE ROW PER MATCH | ALL ROWS PER MATCH [ SHOW EMPTY MATCHES ] }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-match-recognize::row_pattern_skip_to"
source = "doc.sql-ref-syntax-qry-select-match-recognize"
name = "row_pattern_skip_to"
grammar = "<row_pattern_skip_to> ::= SKIP PAST LAST ROW"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-orderby::nulls_sort_order"
source = "doc.sql-ref-syntax-qry-select-orderby"
name = "nulls_sort_order"
grammar = "<nulls_sort_order> ::= [ NULLS FIRST | NULLS LAST ]"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-orderby::sort_direction"
source = "doc.sql-ref-syntax-qry-select-orderby"
name = "sort_direction"
grammar = "<sort_direction> ::= [ ASC | DESC ]"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-pipeop::aggregation"
source = "doc.sql-ref-syntax-qry-select-pipeop"
name = "aggregation"
grammar = "<aggregation> ::= AGGREGATE <aggregate_expr> [ [ AS ] <column_alias> ] [ , ... ] [ GROUP BY <grouping_expr> [ AS <column_alias> ] ]"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-pivot::column_list"
source = "doc.sql-ref-syntax-qry-select-pivot"
name = "column_list"
grammar = "<column_list> ::= { <column_name> | ( <column_name> [ , ... ] ) }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-pivot::expression_list"
source = "doc.sql-ref-syntax-qry-select-pivot"
name = "expression_list"
grammar = "<expression_list> ::= { <expression> [ AS ] [ <column_alias> ] | ( <expression> [ , ... ] ) [ AS ] [ <column_alias> ] } [ , ... ]"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-sortby::nulls_sort_order"
source = "doc.sql-ref-syntax-qry-select-sortby"
name = "nulls_sort_order"
grammar = "<nulls_sort_order> ::= [ NULLS FIRST | NULLS LAST ]"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-sortby::sort_direction"
source = "doc.sql-ref-syntax-qry-select-sortby"
name = "sort_direction"
grammar = "<sort_direction> ::= [ ASC | DESC ]"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-table-reference::table_reference"
source = "doc.sql-ref-syntax-qry-select-table-reference"
name = "table_reference"
grammar = "<table_reference> ::= { <table_name> [ TABLESAMPLE <tablesample_clause> ] [ <table_alias> ] | { STREAM <table_name> [ <table_alias> ] | STREAM ( <table_name> ) [ <table_alias> ] } | <view_name> [ <table_alias> ] | <table_reference> JOIN <join_clause> | <table_reference> NEAREST BY JOIN <nearest_by_join_clause> | <table_reference> PIVOT <pivot_clause> | <table_reference> UNPIVOT <unpivot_clause> | <table_reference> MATCH_RECOGNIZE <match_recognize_clause> | [ STREAM ] <table_valued_function> [ <table_alias> ] | [ LATERAL ] <table_valued_function> [ <table_alias> ] | VALUES <values_clause> | [ LATERAL ] ( <query> ) [ TABLESAMPLE <tablesample_clause> ] [ <table_alias> ] }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-unpivot::multi_value"
source = "doc.sql-ref-syntax-qry-select-unpivot"
name = "multi_value"
grammar = "<multi_value> ::= ( ( <value_column> [ , ... ] ) FOR <unpivot_column> IN ( { ( <column_name> [ , ... ] ) [ <column_alias> ] } [ , ... ] ) )"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-unpivot::single_value"
source = "doc.sql-ref-syntax-qry-select-unpivot"
name = "single_value"
grammar = "<single_value> ::= ( <value_column> FOR <unpivot_column> IN ( { <column_name> [ <column_alias> ] } [ , ... ] ) )"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-watermark::from_item"
source = "doc.sql-ref-syntax-qry-select-watermark"
name = "from_item"
grammar = "<from_item> ::= { <table_name> [ TABLESAMPLE <tablesample_clause> ] [ <watermark_clause> ] [ <table_alias> ] | JOIN <join_clause> | [ LATERAL ] <table_valued_function> [ <table_alias> ] | VALUE <value_clause> | [ LATERAL ] ( <query> ) [ TABLESAMPLE <tablesample_clause> ] [ <watermark_clause> ] [ <table_alias> ] }"

[[definition]]
id = "doc.sql-ref-syntax-qry-select-watermark::watermark_clause"
source = "doc.sql-ref-syntax-qry-select-watermark"
name = "watermark_clause"
grammar = "<watermark_clause> ::= WATERMARK <named_expression> DELAY OF <interval>"

[[definition]]
id = "doc.sql-ref-syntax-qry-select::except_clause"
source = "doc.sql-ref-syntax-qry-select"
name = "except_clause"
grammar = "<except_clause> ::= EXCEPT ( { <column_name> | <field_name> } [ , ... ] )"

[[definition]]
id = "doc.sql-ref-syntax-qry-select::named_expression"
source = "doc.sql-ref-syntax-qry-select"
name = "named_expression"
grammar = "<named_expression> ::= <expression> [ <column_alias> ]"

[[definition]]
id = "doc.sql-ref-syntax-qry-select::star_clause"
source = "doc.sql-ref-syntax-qry-select"
name = "star_clause"
grammar = "<star_clause> ::= [ { <table_name> | <view_name> } . ] * [ <except_clause> ]"

[[definition]]
id = "doc.sql-ref-syntax-qry-star::except_clause"
source = "doc.sql-ref-syntax-qry-star"
name = "except_clause"
grammar = "<except_clause> ::= EXCEPT ( { <column_name> | <field_name> } [ , ... ] )"

[[definition]]
id = "doc.sql-ref-syntax-qry-star::star_clause"
source = "doc.sql-ref-syntax-qry-star"
name = "star_clause"
grammar = "<star_clause> ::= [ <name> . ] * [ <except_clause> ]"
