[[definition]]
id = "doc.control-flow.compound-stmt::condition_values"
source = "doc.control-flow.compound-stmt"
name = "condition_values"
grammar = "<condition_values> ::= { { SQLSTATE [ VALUE ] <sqlstate> | <condition_name> } [ , ... ] | { SQLEXCEPTION | NOT FOUND } [ , ... ] }"

[[definition]]
id = "doc.control-flow.compound-stmt::declare_condition"
source = "doc.control-flow.compound-stmt"
name = "declare_condition"
grammar = "<declare_condition> ::= DECLARE <condition_name> CONDITION [ FOR SQLSTATE [ VALUE ] <sqlstate> ]"

[[definition]]
id = "doc.control-flow.compound-stmt::declare_cursor"
source = "doc.control-flow.compound-stmt"
name = "declare_cursor"
grammar = "<declare_cursor> ::= DECLARE <cursor_name> [ ASENSITIVE | INSENSITIVE ] CURSOR FOR <query> [ FOR READ ONLY ]"

[[definition]]
id = "doc.control-flow.compound-stmt::declare_handler"
source = "doc.control-flow.compound-stmt"
name = "declare_handler"
grammar = "<declare_handler> ::= DECLARE <handler_type> HANDLER FOR <condition_values> <handler_action>"

[[definition]]
id = "doc.control-flow.compound-stmt::declare_variable"
source = "doc.control-flow.compound-stmt"
name = "declare_variable"
grammar = "<declare_variable> ::= DECLARE <variable_name> [ , ... ] <datatype> [ DEFAULT <default_expr> ]"

[[definition]]
id = "doc.control-flow.compound-stmt::handler_type"
source = "doc.control-flow.compound-stmt"
name = "handler_type"
grammar = "<handler_type> ::= EXIT | CONTINUE"

[[definition]]
id = "doc.control-flow.get-diagnostics-stmt::condition_info_item"
source = "doc.control-flow.get-diagnostics-stmt"
name = "condition_info_item"
grammar = "<condition_info_item> ::= { MESSAGE_TEXT | RETURNED_SQLSTATE | MESSAGE_ARGUMENTS | CONDITION_IDENTIFIER | LINE_NUMBER }"

[[definition]]
id = "doc.control-flow.get-diagnostics-stmt::statement_info_item"
source = "doc.control-flow.get-diagnostics-stmt"
name = "statement_info_item"
grammar = "<statement_info_item> ::= { TRANSACTION_ACTIVE | ROW_COUNT }"
