[[reading]]
form = "db.ddl.create-function"
grammar_sha256 = "5ba5c6dc302b94dcb2fa3e48e56b0a0fa553018d9b5b6fae4ecf11f2dfdab547"
grammar = ["CREATE { OR REPLACE [ TEMPORARY ] FUNCTION | TEMPORARY FUNCTION | FUNCTION [ IF NOT EXISTS ] } <function_name> AS <class_name> [ <resource_locations> ]"]
reason = "OR REPLACE and IF NOT EXISTS cannot be written together, and a temporary function takes no IF NOT EXISTS: Spark's parse-tree builder refuses both combinations (the warehouse returns syntax_error for TEMPORARY with IF NOT EXISTS on the SQL function form), so the three openings are alternatives"

