form = "db.ddl.create-sql-function"
grammar_sha256 = "aa5a3494e70a3b857f8621a8c2af6a6f23839e6d60a2b2d46c22276ff793baef"
grammar = ["CREATE { OR REPLACE [ TEMPORARY ] FUNCTION | TEMPORARY FUNCTION | FUNCTION [ IF NOT EXISTS ] } <function_name> ( [ <function_parameter> [ , ... ] ] ) [ RETURNS <data_type> ] [ <characteristic> [ ... ] ] RETURN { <expression> | <query> }", "CREATE { OR REPLACE [ TEMPORARY ] FUNCTION | TEMPORARY FUNCTION | FUNCTION [ IF NOT EXISTS ] } <function_name> ( [ <function_parameter> [ , ... ] ] ) RETURNS TABLE [ ( <column_spec> [ , ... ] ) ] [ <characteristic> [ ... ] ] RETURN <query>", "CREATE { OR REPLACE [ TEMPORARY ] FUNCTION | TEMPORARY FUNCTION | FUNCTION [ IF NOT EXISTS ] } <function_name> ( [ <function_parameter> [ , ... ] ] ) RETURNS <data_type> LANGUAGE PYTHON [ <characteristic> [ ... ] ] { AS <dollar_quoted_string> | HANDLER <handler_name> AS <dollar_quoted_string> }", "CREATE { OR REPLACE FUNCTION | FUNCTION [ IF NOT EXISTS ] } <function_name> ( [ <function_parameter> [ , ... ] ] ) RETURNS <data_type> LANGUAGE { SCALA | JAVA } [ <characteristic> [ ... ] ] <environment> HANDLER <handler_name>"]
reason = "the page writes the SQL, Python and JVM functions on one line. OR REPLACE: 'You cannot specify this parameter with IF NOT EXISTS', so the two are alternatives. RETURN is 'the body of the function' of a SQL function, whose RETURNS 'is optional' for a SQL UDF and whose RETURNS TABLE is supported for LANGUAGE SQL; 'For a table function, it can only be a query', so the table function is its own line; AS dollar_quoted_definition is 'the Python function body', HANDLER names 'the Python function in the dollar-quoted definition' for a row-at-a-time LANGUAGE PYTHON function, and LANGUAGE SCALA or JAVA 'require ... a HANDLER clause that references compiled code supplied through the ENVIRONMENT clause'. Without a language the warehouse reads a SQL function and refuses a body other than RETURN ('Operation not allowed: SQL functions should have a function definition'), so each body goes with its language, and the JVM line, which 'require[s] Unity Catalog', takes no TEMPORARY and always writes the ENVIRONMENT that supplies its compiled code ('The compiled code must be provided as a JAR through the java_dependencies key of the ENVIRONMENT clause'). TEMPORARY with IF NOT EXISTS is refused by the warehouse's parser, so a temporary function takes no IF NOT EXISTS"

