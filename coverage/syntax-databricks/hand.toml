# Reviewed inputs of the Databricks SQL catalogue; read by scripts/build_syntax_catalogue_databricks.py.
#
# [[form]] is a form catalogued by hand from a page whose syntax is in prose, bound to the SHA-256
#   of the page's <article> element, since the rest of the page names per-deploy script bundles:
#   an alias page (`An alias for CREATE SCHEMA`) or a configuration parameter's settings.
# [[page]] is the reviewed status of a pinned page that catalogues no form, with its reason,
#   bound to the same article hash.
# [[reading]] reads one converted Syntax production as other lines, where the page's notation is
#   wrong or ambiguous; `written` is the production as the build converts it.

[[form]]
page = "sql-ref-syntax-ddl-create-database"
anchor = "CREATE DATABASE"
kind = "statement"
label = "create-database"
grammar = [
  "CREATE DATABASE [ IF NOT EXISTS ] <schema_name> [ COMMENT <schema_comment> | DEFAULT COLLATION <default_collation_name> | { LOCATION <schema_directory> | MANAGED LOCATION <location_path> } | RETAIN DROPPED FOR <number> { HOUR | HOURS | DAY | DAYS | WEEK | WEEKS } | WITH DBPROPERTIES ( { <property_name> = <property_value> } [ , ... ] ) ] [ ... ]",
]
basis = "prose"
article_sha256 = "52a4b928ad3c40a86bfadb4dc3ed6b0289cd1656d35fadec8eb6b65c85256864"

[[form]]
page = "sql-ref-syntax-ddl-alter-database"
anchor = "ALTER DATABASE"
kind = "statement"
label = "alter-database"
grammar = [
  "ALTER DATABASE <schema_name> { DEFAULT COLLATION <default_collation_name> | SET DBPROPERTIES ( { <key> = <val> } [ , ... ] ) | [ SET ] OWNER TO <principal> | SET TAGS ( { <tag_name> = <tag_value> } [ , ... ] ) | UNSET TAGS ( <tag_name> [ , ... ] ) | { ENABLE | DISABLE | INHERIT } PREDICTIVE OPTIMIZATION | SET MANAGED LOCATION <location> | [ SET ] RETAIN DROPPED TO <number> { HOUR | HOURS | DAY | DAYS | WEEK | WEEKS } }",
]
basis = "prose"
article_sha256 = "1429aed4b54b50ea77423947da3ec56e4c570b599f9a0eacee4faa1ee280dc2f"

