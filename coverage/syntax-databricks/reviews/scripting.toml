note = "Re-read on 17 Nov 2026 at 1ac76dd68 against the 2026.45 receipts in evidence set evL, after the scripting parser commits. It answers the (d) findings of db-scripting-001 to -017, whose bindings went stale with these trees: no case is opaque any more. Of the 237 cases, 112 are accepted locally and every one is a scripting tree that keeps each word of its text (the screen flags none); the warehouse parses all 112, accepting 53 and failing 59 only after parsing (UNRESOLVED_COLUMN 25, INVALID_LABEL_USAGE 10, CURSOR_NOT_FOUND 9, CONDITION_NOT_FOUND 8, UNRESOLVED_VARIABLE 3, USER_RAISED_EXCEPTION 2, UNBOUND_SQL_PARAMETER 1, DUPLICATE_ASSIGNMENTS 1). The trees keep begin and end labels apart, ATOMIC, nested blocks, handlers with their action, conditions and body, declared conditions and cursors, IF and CASE branches, FOR's optional variable and query, LEAVE and ITERATE with their label, FETCH's NEXT FROM or FROM and its targets, GET DIAGNOSTICS' condition number and items, SIGNAL's SQLSTATE, VALUE and SET item, RESIGNAL, and quoted names as quoted. Where a reading could be doubted, the receipts settle it: OPEN c1 USING 1 AS is accepted by the warehouse, so AS is the alias name, as the tree reads it; SIGNAL SQLSTATE fails with \"Condition SQLSTATE not found\", so SQLSTATE is a condition name, as the tree reads it; and in ITERATE's positive (kb2c39e2ec633) SET c1 = c1 + 1 is a variable assignment, which the loop's ending proves. execute-immediate is reviewed for the first time: a utility statement keeping the statement text, the INTO targets and the USING arguments, with an AS alias and a bare one apart (its INTO targets are table nodes, a fix-list item). The 125 rejects are all PARSE_SYNTAX_ERROR at the warehouse and syntax errors locally; 103 are at the warehouse's position. The other 22 are refused at an empty body's END or at a missing or misplaced keyword, up to 6 characters before the word the warehouse names, except three FOR texts the warehouse reports at the query with \"missing 'DO'\", which are refused at the actual defect, 15 to 19 characters later. The forms are bound at their current fingerprints and definitions."

