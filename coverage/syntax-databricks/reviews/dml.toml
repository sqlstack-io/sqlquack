note = "Re-read on 17 Nov 2026 at 79bd022b7 against the 2026.45 receipts in evidence set evK-17nov, after the DML parser fix. It answers db-dml-003 to db-dml-008 and db-dml-010 to db-dml-012, whose bindings went stale with this tree; each asked for clauses that were opaque, and no accepted case of these forms is opaque now. copy-into: BY POSITION (DBFS_DISABLED, parsed) is by_position and the target's column list is columns; VALIDATE, FILES, PATTERN, FORMAT_OPTIONS and COPY_OPTIONS stay params. copy-into.target-credential: WITH ( CREDENTIAL v1 ) on the target (WITH_CREDENTIAL for a table identifier, parsed) is target_credentials. insert-into.into, into.syntax and overwrite-into: the CTE is with, WITH SCHEMA EVOLUTION is schema_evolution, INTO TABLE or OVERWRITE TABLE is table_keyword, REPLACE WHERE is replace_where, REPLACE USING ( c1 , c2 ) is replace_using, PARTITION ( c1 = 1 ) is partition, and BY NAME is by_name; the all-options cases (INSERT_COLUMN_ARITY_MISMATCH, parsed) keep every one. into-replace-on: REPLACE ON 1 = 1 is replace_on, a parenthesised query is a subquery that keeps its alias, and an unparenthesised one is the query itself, so the two spellings the page writes differ. insert-overwrite-directory: an insert with a directory holding its path, LOCAL, USING format and OPTIONS; a value written without = is marked in options_without_equals, and a path given only as the 'path' option leaves path empty (DBFS_DISABLED, parsed, both spellings). insert-overwrite-directory-hive: ROW FORMAT DELIMITED is the row format, STORED AS a name is stored_as, and STORED AS INPUTFORMAT ... OUTPUTFORMAT ... are input_format and output_format (UNSUPPORTED_DATA_SOURCE_WRITE, parsed); its positives stay observed because the form is Runtime-only, so it remains awaiting observation. merge-into: the CTE is with_, WITH SCHEMA EVOLUTION is schema_evolution, AND conditions are each clause's condition, and NOT MATCHED BY SOURCE and BY TARGET set source true and false, apart from a bare NOT MATCHED, which has none. The mechanical check finds every name and literal in all 108 accepted trees. Of 171 local rejects, 139 are at the warehouse's position, 4 have no warehouse position (Values must be specified for key(s) twice, a directory with no path at all, and MERGE_WITHOUT_WHEN, each refused locally with the warehouse's own message), and 28 are elsewhere, all syntax errors on both sides and unchanged from the previous tree: the warehouse reports at the token after an unfinished clause (missing 'SCHEMA', 'EVOLUTION', 'NAME', '(' or ')') where the parser reports at the clause's start, or reads REPLACE after the target as an alias and fails at ON or USING with missing 'REPLACE' where the parser fails later at the clause's operand. The forms are bound at their current fingerprints and definitions."

