note = "Re-read in full on 17 Nov 2026 at 312903a4b (parser tree 880c142a) against the documentation page, the obligations, the 2026.45 receipts and the local parse trees, as part of the re-read of forms whose definitions changed. Held for these reasons, form by form: current-timestamp: db-functions-006's finding still holds: the catalogue writes CURRENT_TIMESTAMP [ ( [ <precision> ] ) ] while the page writes current_timestamp( [ precision ] ), and no [[reading]] row states the optional parentheses. Catalogue or reading fix; no recording needed. date-add3: db-functions-008's (d) finding is answered (a bare unit is now a keyword var, not a string literal), but its (b) finding still holds: o008, SELECT ( DATE_ADD 1 , 1 , 1 ), drops the unit as well as the parenthesis, so it does not isolate the missing (. Needs a new negative case and its receipt. dateadd: As date-add3: the unit is now a keyword var, but o008, SELECT ( DATEADD 1 , 1 , 1 ), still drops the unit with the parenthesis. Needs a new negative case and its receipt. datediff3: As date-add3: the unit is now a keyword var, but o008, SELECT ( DATEDIFF 1 , 1 , 1 ), still drops the unit with the parenthesis. Needs a new negative case and its receipt. extract: db-functions-012's finding still holds: o006, SELECT ( EXTRACT 1 FROM v1 ), replaces the field keyword as well as dropping the parenthesis, so it does not isolate the missing (. Needs a new negative case and its receipt. http-request: db-functions-013's finding still holds: the page writes } [, ..] ) and the catalogue } [ , ... ] ), with no [[reading]] row stating the change. Reading fix; no recording needed. read-kafka: db-functions-018's finding still holds: o007 (option_absent [ , ... ]) is still READ_KAFKA ( ), which drops the first pair too; no case has exactly one option. Needs a new case such as READ_KAFKA ( k1 => 'v' ) and its receipt. timediff: As date-add3: the unit is now a keyword var, but o008, SELECT ( TIMEDIFF 1 , 1 , 1 ), still drops the unit with the parenthesis. Needs a new negative case and its receipt. timestampadd: As date-add3: the unit is now a keyword var, but o008, SELECT ( TIMESTAMPADD 1 , 1 , 1 ), still drops the unit with the parenthesis. Needs a new negative case and its receipt. timestampdiff: As date-add3: the unit is now a keyword var, but o008, SELECT ( TIMESTAMPDIFF 1 , 1 , 1 ), still drops the unit with the parenthesis. Needs a new negative case and its receipt."

