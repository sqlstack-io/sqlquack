# Documented limits that Snowflake enforces only after parsing, or not at all (decision D85).
# Each obligation named here is an accept obligation in obligations/<family>.toml: the parser must
# not reject the input. This list is reported as a separate semantic measure and never counts
# towards the syntax numerator or denominator. Fields: obligation, form, anchor, rule (the
# documented wording), input, documented (the outcome the documentation implies), observed (the
# phase of the cited receipts: accepted, semantic_error or runtime_error), errno, agrees (whether
# Snowflake enforces the documented rule at any stage), and receipts, each with case_id, run_id and
# receipt_sha256, the sha256 of its line in the import file. Withdrawn and superseded receipts are
# not cited.

