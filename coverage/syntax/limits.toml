# RAISE (finding 2): "If you are handling an exception in an exception handler and you want to raise
# the same exception again, omit this argument." Omitting the name is valid inside a handler.

[[suppress]]
form = "sf.scripting.raise"
kind = "required_operand_missing"
target = "<exception_name>"
reason = "the page documents RAISE; without a name as a re-raise inside an exception handler"

[[limit]]
form = "sf.scripting.raise"
kind = "positive"
note = "RAISE; without a name inside a WHEN clause of an exception handler, re-raising the exception"
anchor = "doc.snowflake-scripting.raise / Syntax"
sql = "BEGIN SELECT 1 / 0 ; EXCEPTION WHEN OTHER THEN RAISE ; END ;"
context = "raw"

[[limit]]
form = "sf.scripting.raise"
kind = "negative_neighbour"
note = "RAISE; without a name outside an exception handler"
anchor = "doc.snowflake-scripting.raise / Syntax"
sql = "RAISE ;"

