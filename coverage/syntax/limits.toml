[[limit]]
form = "sf.scripting.while"
kind = "negative_neighbour"
note = "LOOP closed by END WHILE"
anchor = "doc.snowflake-scripting.while / Usage notes"
sql = "WHILE ( FALSE ) LOOP NULL ; END WHILE ;"

# RETURN: "A RETURN statement returns ... A table. Use TABLE(...) in the RETURN statement."

[[limit]]
form = "sf.scripting.return"
kind = "operand_type_class"
target = "<expression>"
note = "TABLE ( <resultset_name> ) returning a RESULTSET as a table"
anchor = "doc.snowflake-scripting.return / Usage notes"
sql = "LET r1 RESULTSET := ( SELECT 1 ) ; RETURN TABLE ( r1 ) ;"

# LET RESULTSET: the AWAIT page documents `LET res RESULTSET := ASYNC ( <query> )`, which the LET
# grammar does not show.

[[limit]]
form = "sf.scripting.let.let-resultset-default"
kind = "option_present"
target = "ASYNC before ( <query> )"
note = "an asynchronous child job: RESULTSET := ASYNC ( <query> )"
anchor = "doc.snowflake-scripting.await / Usage notes"
sql = "LET r1 RESULTSET := ASYNC ( SELECT 1 ) ;"

