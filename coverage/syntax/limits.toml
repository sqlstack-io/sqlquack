# Wrong-class negatives that Snowflake accepts as syntax (decision D82 keeps only lexically distinct
# wrong classes); withdrawn on the receipts of runs d82-scripting-3 and d82-scripting-2.

[[suppress]]
form = "sf.scripting.open"
kind = "negative_neighbour"
target = "bind_variable_1 in [ USING ( bind_variable_1 [ , bind_variable_2 ... ] ) ]"
reason = "OPEN ... USING takes expressions, so a string literal is valid syntax: Snowflake accepts OPEN c1 USING ( 'v1' ) (run d82-scripting-3-20261104T011650Z, receipt d5511dcf50f08a9437b56d42aa2359e78e51bc48830afd97a0e793e65db7ae2f)"

[[suppress]]
form = "sf.scripting.for.do-end-for"
kind = "negative_neighbour"
target = "<cursor_name>"
reason = "FOR <row_variable> IN <expression> also parses as a loop over an array or object expression, so a string literal reaches the loop and fails only when it runs: errno 92234 'Expression in variant for loop does not evaluate to an array or an object' (run d82-scripting-2-20261104T010552Z, refused as phase not established)"

# Double-quoted identifiers (decision D87 follow-up): blanks inside quotes are tested once, here, in a
# position where Snowflake answers them. Quoted labels and block-local procedure or argument names
# containing a blank give internal error 603 (unobservable/scripting.toml diagnostics), so the
# scripting forms test quoting without the blank.

[[limit]]
form = "sf.expressions.identifiers-syntax.double-quoted-identifier"
kind = "positive"
note = "a double-quoted identifier containing a blank and mixed case, as a column alias"
anchor = "doc.identifiers-syntax / Double-quoted identifiers"
sql = "SELECT 1 AS \"a B\" ;"
context = "raw"

# Extreme-value checks (decision D90): sizes the documentation gives no bound for, as a bounded probe
# set, never an exhaustive one. Each [[limit]] of kind extreme is one case of `size` levels or items;
# it carries no expect, because its outcome is what Snowflake's receipt shows, and a local parser
# crash, stack overflow or hang fails it. Scripting carries block nesting (50 and 100 levels) and
# its own repetition lists (1,000 and 5,000 items, branch lists 1,000 only: 5,000 branches hit
# internal error 603 and are diagnostic records in unobservable/scripting.toml); literals, identifiers, expressions, subqueries
# and IN or column lists get theirs once on the shared forms when their families are built.
[[limit]]
