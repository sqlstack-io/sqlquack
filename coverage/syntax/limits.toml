note = "TABLE ( <resultset_name> ) in a procedure declared RETURNS TABLE ( ... )"
anchor = "doc.snowflake-scripting.return / Usage notes"
sql = "WITH p1 AS PROCEDURE ( ) RETURNS TABLE ( ) LANGUAGE SQL AS $$ BEGIN LET r1 RESULTSET := ( SELECT 1 ) ; RETURN TABLE ( r1 ) ; END $$ CALL p1 ( ) ;"
context = "raw"

# IF (finding 5): several ELSEIF branches.

[[limit]]
form = "sf.scripting.if"
kind = "option_present"
target = "[ ELSEIF ( <condition> ) THEN <statement> ; [ <statement> ; ... ] ]"
note = "two or more ELSEIF branches"
anchor = "doc.snowflake-scripting.if / Syntax"
sql = "IF ( FALSE ) THEN NULL ; ELSEIF ( FALSE ) THEN NULL ; ELSEIF ( TRUE ) THEN NULL ; END IF ;"

# RETURNS TABLE and GEOGRAPHY (finding 6): "in the RETURNS TABLE(...) clause, you can't specify
# GEOGRAPHY as a column type". Run d82-scripting-2 accepts the call with no error at all, so the
# limit is an accept obligation and semantic-limits/scripting.toml records the discrepancy (D85).

[[limit]]
form = "sf.scripting.declare.procedure-returns-table-as"
kind = "positive"
note = "GEOGRAPHY as a column type in RETURNS TABLE ( ... ): a syntax-phase acceptance; Snowflake does not enforce the documented restriction"
anchor = "doc.snowflake-scripting.declare / Nested stored procedure declaration syntax"
sql = "DECLARE p1 PROCEDURE ( ) RETURNS TABLE ( g GEOGRAPHY ) AS BEGIN LET r1 RESULTSET := ( SELECT TO_GEOGRAPHY ( 'POINT(1 1)' ) AS g ) ; RETURN TABLE ( r1 ) ; END ; BEGIN CALL p1 ( ) ; END ;"
expect = "accept"
context = "raw"

