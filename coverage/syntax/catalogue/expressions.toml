[[definition]]
id = "doc.data-types-datetime::dayTimeQualifier"
source = "doc.data-types-datetime"
name = "dayTimeQualifier"
grammar = "dayTimeQualifier ::= { DAY [ (<precision>) ] [ TO { HOUR | MINUTE | SECOND [ (<fractional_seconds_precision>) ] } ] | HOUR [ (<precision>) ] [ TO { MINUTE | SECOND [ (<fractional_seconds_precision>) ] } ] | MINUTE [ (<precision>) ] [ TO SECOND [ (<fractional_seconds_precision>) ] ] | SECOND [ (<precision>) [ , (<fractional_seconds_precision>) ] ] }"

[[definition]]
id = "doc.data-types-datetime::yearMonthQualifier"
source = "doc.data-types-datetime"
name = "yearMonthQualifier"
grammar = "yearMonthQualifier ::= { YEAR [ (<precision>) ] [ TO MONTH ] | MONTH [ (<precision>) ] }"

[[definition]]
id = "doc.operators-subquery::comparisonOperator"
source = "doc.operators-subquery"
name = "comparisonOperator"
grammar = "comparisonOperator ::= { = | != | > | >= | < | <= }"
