[[definition]]
id = "doc.sql.alter-account::objectParams"
source = "doc.sql.alter-account"
name = "objectParams"
grammar = "objectParams ::= BASE_LOCATION_PREFIX = '<string>' CATALOG = <catalog_integration_name> CATALOG_SYNC = '<snowflake_open_catalog_integration_name>' CORTEX_MODELS_ALLOWLIST = {'<list_of_models>' | 'ALL' | 'NONE'} DATA_RETENTION_TIME_IN_DAYS = <integer> DEFAULT_DDL_COLLATION = '<collation_specification>' DEFAULT_NOTEBOOK_COMPUTE_POOL_CPU = <compute_pool_name> DEFAULT_NOTEBOOK_COMPUTE_POOL_GPU = <compute_pool_name> DEFAULT_STREAMLIT_COMPUTE_POOL = <compute_pool_name> DEFAULT_STREAMLIT_NOTEBOOK_WAREHOUSE = <warehouse_name> ENABLE_DATA_COMPACTION = { TRUE | FALSE } ICEBERG_MERGE_ON_READ_BEHAVIOR = { 'AUTO' | 'ENABLED' | 'DISABLED' } ENABLE_ICEBERG_MERGE_ON_READ = { TRUE | FALSE } ENABLE_TAG_PROPAGATION_EVENT_LOGGING = TRUE | FALSE ENABLE_UNREDACTED_QUERY_SYNTAX_ERROR = TRUE | FALSE ENABLE_UNREDACTED_SECURE_OBJECT_ERROR = TRUE | FALSE EVENT_TABLE = <string> EXTERNAL_VOLUME = <external_volume_name> ICEBERG_DEFAULT_DDL_COLLATION = '<collation_specification>' ICEBERG_VERSION_DEFAULT = <integer> LOG_LEVEL = <string> MAX_CONCURRENCY_LEVEL = <num> MAX_DATA_EXTENSION_TIME_IN_DAYS = <integer> METRIC_LEVEL = <string> NETWORK_POLICY = <string> OAUTH_AUTHORIZATION_SERVER = <integration_name> OAUTH_SCOPES_SUPPORTED = '<comma_separated_scopes>' PIPE_EXECUTION_PAUSED = TRUE | FALSE PREVENT_UNLOAD_TO_INLINE_URL = TRUE | FALSE PREVENT_UNLOAD_TO_INTERNAL_STAGES = TRUE | FALSE REPLACE_INVALID_CHARACTERS = TRUE | FALSE STAGE_UNDROP_RETENTION_TIME_IN_DAYS = <integer> STATEMENT_QUEUED_TIMEOUT_IN_SECONDS = <num> STATEMENT_TIMEOUT_IN_SECONDS = <num> STORAGE_SERIALIZATION_POLICY = COMPATIBLE | OPTIMIZED TRACE_LEVEL = <string>"

[[definition]]
