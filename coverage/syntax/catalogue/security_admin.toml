[[definition]]
id = "doc.sql.alter-account::accountParams"
source = "doc.sql.alter-account"
name = "accountParams"
grammar = "accountParams ::= ALLOW_ID_TOKEN = TRUE | FALSE ALLOWED_SPCS_WORKLOAD_TYPES = { '<list_of_workload_types>' | 'ALL' } CLIENT_ENCRYPTION_KEY_SIZE = <integer> CORTEX_ENABLED_CROSS_REGION = { 'DISABLED' | 'ANY_REGION' | '<list_of_regions>' } DISALLOWED_SPCS_WORKLOAD_TYPES = { '<list_of_workload_types>' | 'ALL' } DISABLE_EXECUTE_DATA_METRIC_FUNCTION_GRANT_TO_PUBLIC = TRUE | FALSE DISABLE_USER_PRIVILEGE_GRANTS = TRUE | FALSE DEFAULT_DBT_VERSION = { '<version>' } ENABLE_EGRESS_COST_OPTIMIZER = TRUE | FALSE ENABLE_INTERNAL_STAGES_PRIVATELINK = TRUE | FALSE ENABLE_SNOWFLAKE_MANAGED_STORAGE_VOLUME_PRIVATELINK = TRUE | FALSE ENFORCE_NETWORK_RULES_FOR_INTERNAL_STAGES = TRUE | FALSE ENFORCE_NETWORK_RULES_FOR_SNOWFLAKE_MANAGED_STORAGE_VOLUME = TRUE | FALSE ENFORCE_TAG_PROPAGATION_FOR_DATA_MOVEMENT_POLICIES = TRUE | FALSE ENABLE_NOTEBOOK_CREATION_IN_PERSONAL_DB = TRUE | FALSE ENABLE_SPCS_BLOCK_STORAGE_SNOWFLAKE_FULL_ENCRYPTION_ENFORCEMENT = TRUE | FALSE EXTERNAL_OAUTH_ADD_PRIVILEGED_ROLES_TO_BLOCKED_LIST = TRUE | FALSE INITIAL_REPLICATION_SIZE_LIMIT_IN_TB = <num> LISTING_AUTO_FULFILLMENT_INITIAL_REFRESH_SIZE_LIMIT_IN_TB = <num> LISTING_AUTO_FULFILLMENT_REPLICATION_REFRESH_SCHEDULE = <schedule> LLM_INFERENCE_PARSE_DOCUMENT_PRESIGNED_URL_EXPIRY_SECONDS = <integer> MIN_STAGE_UNDROP_RETENTION_TIME_IN_DAYS = <integer> NETWORK_POLICY = <string> OAUTH_ADD_PRIVILEGED_ROLES_TO_BLOCKED_LIST = TRUE | FALSE PERIODIC_DATA_REKEYING = TRUE | FALSE READ_CONSISTENCY_MODE = 'SESSION' | 'GLOBAL' REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_CREATION = TRUE | FALSE REQUIRE_STORAGE_INTEGRATION_FOR_STAGE_OPERATION = TRUE | FALSE SAML_IDENTITY_PROVIDER = <json_object> SQL_TRACE_QUERY_TEXT = ON | OFF SSO_LOGIN_PAGE = TRUE | FALSE USE_WORKSPACES_FOR_SQL = { 'always' | 'never' }"

