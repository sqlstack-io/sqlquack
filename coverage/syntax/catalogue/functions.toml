[[definition]]
id = "doc.functions-window-syntax::windowDefinition"
source = "doc.functions-window-syntax"
name = "windowDefinition"
grammar = "windowDefinition ::= [ PARTITION BY <expr1> [, ...] ] [ ORDER BY <expr2> [ { ASC | DESC } ] [ NULLS { FIRST | LAST } ] [, ...] ] [ <windowFrameClause> ]"

[[definition]]
id = "doc.functions-window-syntax::windowFrameClause"
source = "doc.functions-window-syntax"
name = "windowFrameClause"
grammar = "windowFrameClause ::= { { ROWS | RANGE } UNBOUNDED PRECEDING | { ROWS | RANGE } <n> PRECEDING | { ROWS | RANGE } CURRENT ROW | { ROWS | RANGE } BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW | { ROWS | RANGE } BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING | { ROWS | RANGE } BETWEEN UNBOUNDED PRECEDING AND UNBOUNDED FOLLOWING | { ROWS | RANGE } BETWEEN <n> { PRECEDING | FOLLOWING } AND <n> { PRECEDING | FOLLOWING } | { ROWS | RANGE } BETWEEN UNBOUNDED PRECEDING AND <n> { PRECEDING | FOLLOWING } | { ROWS | RANGE } BETWEEN <n> { PRECEDING | FOLLOWING } AND UNBOUNDED FOLLOWING }"

[[definition]]
id = "doc.functions.infer_schema::externalStage"
source = "doc.functions.infer_schema"
name = "externalStage"
grammar = "externalStage ::= @[<namespace>.]<ext_stage_name>[/<path>][/<filename>]"

[[definition]]
id = "doc.functions.infer_schema::internalStage"
source = "doc.functions.infer_schema"
name = "internalStage"
grammar = "internalStage ::= @[<namespace>.]<int_stage_name>[/<path>][/<filename>] | @~[/<path>][/<filename>]"

[[definition]]
id = "doc.functions.percent_rank::fixedRangeFrame"
source = "doc.functions.percent_rank"
name = "fixedRangeFrame"
grammar = "fixedRangeFrame ::= { RANGE UNBOUNDED PRECEDING | RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW | RANGE BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING }"

[[definition]]
id = "doc.functions.to_timestamp::timestampFunction"
source = "doc.functions.to_timestamp"
name = "timestampFunction"
grammar = "timestampFunction ::= TO_TIMESTAMP | TO_TIMESTAMP_LTZ | TO_TIMESTAMP_NTZ | TO_TIMESTAMP_TZ"

[[definition]]
id = "doc.functions.try_to_timestamp::timestampFunction"
source = "doc.functions.try_to_timestamp"
name = "timestampFunction"
grammar = "timestampFunction ::= TRY_TO_TIMESTAMP | TRY_TO_TIMESTAMP_LTZ | TRY_TO_TIMESTAMP_NTZ | TRY_TO_TIMESTAMP_TZ"
