grammar = "logicalTable ::= [ <table_alias> AS ] <table_name> [ PRIMARY KEY ( <primary_key_column_name> [ , ... ] ) ] [ UNIQUE ( <unique_column_name> [ , ... ] ) [ ... ] ] [ CONSTRAINT [ <constraint_name> ] DISTINCT RANGE BETWEEN <start_column> AND <end_column> EXCLUSIVE ] [ WITH SYNONYMS [ = ] ( '<synonym>' [ , ... ] ) ] [ COMMENT = '<comment_about_table>' ] [ [ WITH ] TAG ( <tag_name> = '<tag_value>' [ , <tag_name> = '<tag_value>' , ... ] ) ]"

[[definition]]
id = "doc.sql.create-semantic-view::metricExpression"
source = "doc.sql.create-semantic-view"
name = "metricExpression"
grammar = "metricExpression ::= [ { PRIVATE | PUBLIC } ] <table_alias>.<metric> [ USING ( <relationship_name> [ , ... ] ) ] [ NON ADDITIVE BY ( <dimension> [ { ASC | DESC } ] [ NULLS { FIRST | LAST } ] [ , ... ] ) ] AS <sql_expr> [ WITH SYNONYMS [ = ] ( '<synonym>' [ , ... ] ) ] [ [ WITH ] TAG ( <tag_name> = '<tag_value>' [ , <tag_name> = '<tag_value>' , ... ] ) ] [ COMMENT = '<comment_about_the_metric>' ]"

[[definition]]
id = "doc.sql.create-semantic-view::relationshipDef"
source = "doc.sql.create-semantic-view"
name = "relationshipDef"
grammar = "relationshipDef ::= [ <relationship_identifier> AS ] <table_alias> ( <column_name> [ , ... ] ) REFERENCES <ref_table_alias> [ ( [ ASOF ] <ref_column_name> [ , ... ] | BETWEEN <start_column> AND <end_column> EXCLUSIVE ) ]"

[[definition]]
id = "doc.sql.create-semantic-view::verifiedQuery"
source = "doc.sql.create-semantic-view"
name = "verifiedQuery"
grammar = "verifiedQuery ::= <verified_query_name> AS ( QUESTION '<question>' [ VERIFIED_AT <timestamp> ] [ ONBOARDING_QUESTION <boolean> ] [ VERIFIED_BY '( <purpose> = <contact> )' ] SQL '<verified_query>' )"

[[definition]]
id = "doc.sql.create-semantic-view::windowFunctionMetricExpression"
source = "doc.sql.create-semantic-view"
name = "windowFunctionMetricExpression"
grammar = "windowFunctionMetricExpression ::= [ { PRIVATE | PUBLIC } ] <table_alias>.<metric> AS <window_function>( <metric> ) OVER ( [ PARTITION BY { <exprs_using_dimensions_or_metrics> | EXCLUDING <dimensions> } ] [ ORDER BY <exprs_using_dimensions_or_metrics> [ ASC | DESC ] [ NULLS { FIRST | LAST } ] [, ...] ] [ <windowFrameClause> ] )"

[[definition]]
