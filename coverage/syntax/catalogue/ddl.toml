[[definition]]
id = "doc.sql.alter-dynamic-table::clusteringAction"
source = "doc.sql.alter-dynamic-table"
name = "clusteringAction"
grammar = "clusteringAction ::= { CLUSTER BY ( <expr> [ , <expr> , ... ] ) | { SUSPEND | RESUME } RECLUSTER | DROP CLUSTERING KEY }"

[[definition]]
id = "doc.sql.alter-dynamic-table::dataGovnPolicyTagAction"
source = "doc.sql.alter-dynamic-table"
name = "dataGovnPolicyTagAction"
grammar = "dataGovnPolicyTagAction ::= { ADD ROW ACCESS POLICY <policy_name> ON ( <col_name> [ , ... ] ) | DROP ROW ACCESS POLICY <policy_name> | DROP ROW ACCESS POLICY <policy_name> , ADD ROW ACCESS POLICY <policy_name> ON ( <col_name> [ , ... ] ) | DROP ALL ROW ACCESS POLICIES } | { SET AGGREGATION POLICY <policy_name> [ ENTITY KEY ( <col_name> [, ... ] ) ] [ FORCE ] | UNSET AGGREGATION POLICY } | { { ALTER | MODIFY } [ COLUMN ] <col1_name> SET MASKING POLICY <policy_name> [ USING ( <col1_name> , <cond_col_1> , ... ) ] [ FORCE ] | UNSET MASKING POLICY } | { ALTER | MODIFY } [ COLUMN ] <col1_name> SET TAG <tag_name> = '<tag_value>' [ , <tag_name> = '<tag_value>' ... ] , [ COLUMN ] <col2_name> SET TAG <tag_name> = '<tag_value>' [ , <tag_name> = '<tag_value>' ... ] | { { ALTER | MODIFY } [ COLUMN ] <col1_name> SET PROJECTION POLICY <policy_name> [ FORCE ] | UNSET PROJECTION POLICY } | { ALTER | MODIFY } [ COLUMN ] <col1_name> UNSET TAG <tag_name> [ , <tag_name> ... ] , [ COLUMN ] <col2_name> UNSET TAG <tag_name> [ , <tag_name> ... ] } | { SET TAG <tag_name> = '<tag_value>' [ , <tag_name> = '<tag_value>' ... ] | UNSET TAG <tag_name> [ , <tag_name> ... ] }"

[[definition]]
id = "doc.sql.alter-dynamic-table::searchOptimizationAction"
source = "doc.sql.alter-dynamic-table"
name = "searchOptimizationAction"
grammar = "searchOptimizationAction ::= { ADD SEARCH OPTIMIZATION [ ON <search_method_with_target> [ , <search_method_with_target> ... ] [ EQUALITY ] ] | DROP SEARCH OPTIMIZATION [ ON { <search_method_with_target> | <column_name> | <expression_id> } [ EQUALITY ] [ , ... ] ] | SUSPEND SEARCH OPTIMIZATION [ ON { <search_method_with_target> | <column_name> | <expression_id> } [ , ... ] ] | RESUME SEARCH OPTIMIZATION [ ON { <search_method_with_target> | <column_name> | <expression_id> } [ , ... ] ] }"

[[definition]]
id = "doc.sql.alter-dynamic-table::storageLifecyclePolicyAction"
source = "doc.sql.alter-dynamic-table"
name = "storageLifecyclePolicyAction"
grammar = "storageLifecyclePolicyAction ::= { ADD STORAGE LIFECYCLE POLICY <policy_name> ON ( <col_name> [ , <col_name> ... ] ) | DROP STORAGE LIFECYCLE POLICY }"

[[definition]]
id = "doc.sql.alter-dynamic-table::tableCommentAction"
source = "doc.sql.alter-dynamic-table"
name = "tableCommentAction"
grammar = "tableCommentAction ::= { ALTER | MODIFY [ ( ] [ COLUMN ] <col1_name> COMMENT '<string>' , [ COLUMN ] <col1_name> UNSET COMMENT [ , ... ] [ ) ] }"

[[definition]]
id = "doc.sql.alter-external-volume::cloudProviderParams (for Amazon S3)"
source = "doc.sql.alter-external-volume"
name = "cloudProviderParams (for Amazon S3)"
grammar = "cloudProviderParams (for Amazon S3) ::= STORAGE_PROVIDER = '{ S3 | S3CHINA | S3GOV }' STORAGE_AWS_ROLE_ARN = '<iam_role>' STORAGE_BASE_URL = '<protocol>://<bucket>[/<path>/]' [ STORAGE_AWS_ACCESS_POINT_ARN = '<string>' ] [ ENCRYPTION = ( [ TYPE = 'AWS_SSE_S3' ] | [ TYPE = 'AWS_SSE_KMS' [ KMS_KEY_ID = '<string>' ] ] | [ TYPE = 'NONE' ] ) ] [ USE_PRIVATELINK_ENDPOINT = { TRUE | FALSE } ]"

[[definition]]
id = "doc.sql.alter-external-volume::cloudProviderParams (for Google Cloud Storage)"
source = "doc.sql.alter-external-volume"
name = "cloudProviderParams (for Google Cloud Storage)"
grammar = "cloudProviderParams (for Google Cloud Storage) ::= STORAGE_PROVIDER = 'GCS' STORAGE_BASE_URL = 'gcs://<bucket>[/<path>/]' [ ENCRYPTION = ( [ TYPE = 'GCS_SSE_KMS' ] [ KMS_KEY_ID = '<string>' ] | [ TYPE = 'NONE' ] ) ]"

[[definition]]
id = "doc.sql.alter-external-volume::cloudProviderParams (for Microsoft Azure)"
source = "doc.sql.alter-external-volume"
name = "cloudProviderParams (for Microsoft Azure)"
grammar = "cloudProviderParams (for Microsoft Azure) ::= STORAGE_PROVIDER = 'AZURE' AZURE_TENANT_ID = '<tenant_id>' [ USE_PRIVATELINK_ENDPOINT = { TRUE | FALSE } ] STORAGE_BASE_URL = 'azure://<account>.blob.core.windows.net/<container>[/<path>/]'"

[[definition]]
id = "doc.sql.alter-file-format::formatTypeOptions"
