ric_name> ON ( <col_name> [ , ... ] [ , TABLE <table_name>( <col_name> [ , ... ] ) ] ) FILTER ( [ <predicate> ] ) [ , <metric_name_2> ON ( <col_name> [ , ... ] [ , TABLE <table_name>( <col_name> [ , ... ] ) ] ) FILTER ( [ <predicate> ] ) ] | MODIFY DATA METRIC FUNCTION <metric_name> SET <list_of_properties>"

