source = "doc.sql.execute-dcm-project"
name = "fromSource"
grammar = "fromSource ::= [ USING [ CONFIGURATION <config_name> ] [ ( <expr> [ , <expr> ... ] ) ] ] [ ENVIRONMENT ( <bind_variable> ) ] FROM '<source_files_path>'"

[[definition]]
id = "doc.sql.execute-immediate-from::absoluteFilePath"
source = "doc.sql.execute-immediate-from"
name = "absoluteFilePath"
grammar = "absoluteFilePath ::= @[ <namespace>. ]<stage_name>/<path>/<filename>"

[[definition]]
id = "doc.sql.execute-immediate-from::relativeFilePath"
source = "doc.sql.execute-immediate-from"
name = "relativeFilePath"
grammar = "relativeFilePath ::= '[ / | ./ | ../ ]<path>/<filename>'"

[[definition]]
id = "doc.sql.execute-job-service::fromSpecification"
source = "doc.sql.execute-job-service"
name = "fromSpecification"
grammar = "fromSpecification ::= { FROM @<stage> SPECIFICATION_FILE = '<yaml_file_stage_path>' | FROM SPECIFICATION <specification_text> }"

[[definition]]
id = "doc.sql.execute-job-service::fromSpecificationTemplate"
source = "doc.sql.execute-job-service"
name = "fromSpecificationTemplate"
grammar = "fromSpecificationTemplate ::= { FROM @<stage> SPECIFICATION_TEMPLATE_FILE = '<yaml_file_stage_path>' | FROM SPECIFICATION_TEMPLATE <specification_text> } USING ( <key> => <value> [ , <key> => <value> [ , ... ] ] )"

