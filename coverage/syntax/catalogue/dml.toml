[[form]]
id = "sf.dml.copy-files.from"
family = "dml"
source = "doc.sql.copy-files"
anchor = "Syntax / Copy from a stage"
kind = "statement"
grammar = [
  "COPY FILES INTO @[<namespace>.]<stage_name>[/<path>/] FROM @[<namespace>.]<stage_name>[/<path>/] [ FILES = ( '<file_name>' [ , '<file_name>' ] [ , ... ] ) ] [ PATTERN = '<regex_pattern>' ] [ DETAILED_OUTPUT = { TRUE | FALSE } ]",
]
grammar_sha256 = "482c2de141f96dd374df379a2ff1f658488c42f78299acf3b2423c1371656644"
uses = []
status = "catalogued"

