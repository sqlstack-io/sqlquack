# Documented obligations whose construct Snowflake answers only with an internal error (603), so no
# capture can establish a phase (decision D87). Each obligation stays in the denominator, never
# counts as verified, and is reported as "unverifiable: Snowflake internal error". Its case stays in
# cases/<family>.jsonl. Fields: obligation, form, construct, reason, the cases that were captured
# (case_id, sql_sha256), the runs (the original capture, the exact re-run and the diagnostic probes,
# none of them imported), and each probe that bears on the construct with its sql_sha256 and result.
# Probe results are diagnostics, never syntax evidence.
# A [[diagnostic]] entry records a 603 on a construct that no obligation requires any more: the
# obligation named was narrowed so that it can be observed. It has the same fields, except that
# `captured` lists the retired cases that hit the 603 in place of `cases`. Diagnostics are listed in
# the report and never count towards any score.

