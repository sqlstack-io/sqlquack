# The referee runs whose receipts this root holds; written by hand when a run's receipts are
# committed, and read by no tool. Every run used the pinned duckdb 2.0.0 Python package (its
# library's sha256 is each receipt's engine_image_sha256), ran each case in a fresh in-memory
# database in a child process of the referee, and recorded with the referee at `referee`, the
# repository commit the run was made against plus its uncommitted referee changes, committed
# with the receipts.
#
# receipts: the file in receipts/ the checker reads as the current receipts.
# repeat_run: a second run of the same cases, kept in repeats/ where the checker does not read
#   it (two current receipts per case would make a later disagreement ambiguous). Compare the
#   two with: python -m scripts.run_duckdb_referee compare <receipts file> <repeats file>
# compared: what that comparison printed.

[[run]]
run_id = "duckdb-2.0.0-20261107T202043.788922Z"
referee = "cd7ee57f"
cases = "the cases of the commit that adds these receipts, which the run read from the working tree before they were committed; the receipts record each case's outcome, and the 25 observed cases are not compared with an expectation"
receipts = "receipts/duckdb-2.0.0-20261107T202043.788922Z.jsonl"
repeat_run = "duckdb-2.0.0-20261107T202441.896308Z"
repeat_receipts = "repeats/duckdb-2.0.0-20261107T202441.896308Z.jsonl"
compared = "5702 and 5702 receipts; 0 differ"
