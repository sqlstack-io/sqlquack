grammar = ["CREATE { [ OR REPLACE ] [ { TEMPORARY | TEMP } ] { MACRO | FUNCTION } | [ { TEMPORARY | TEMP } ] { MACRO | FUNCTION } IF NOT EXISTS } [ <schema-name> . ] <macro-name> ( [ <param-name> [ <type> ] [ , <param-name2> [ <type> ] ] [ , <param-name3> [ <type> ] := <default-value> ] [ , ] ] ) AS { <expr> [ , ( <param-name> [ <type> ] , <param-name2> , <param-name4> , <param-name5> ) AS <expr> ] | TABLE { <select-node> | ( <select-node> ) [ , ( <param-name> [ <type> ] , <param-name2> , <param-name4> , <param-name5> ) AS TABLE ( <select-node> ) ] } }"]
reason = "DuckDB refuses OR REPLACE together with IF NOT EXISTS in one CREATE statement (create_trigger page: 'The two clauses cannot be combined'; the parser raises 'Cannot specify both OR REPLACE and IF NOT EXISTS'), so the two are read as alternatives; parameters with defaults follow those without (the parser refuses the reverse); a table macro's body is a query (AS TABLE takes a SELECT); both scalar and table macros can be overloaded, with typed or untyped parameters (Overloading section: add_x, the typed is_maximal and the table macro tbl_range), and all implementations of one macro are of one kind (the parser refuses mixing them: 'Cannot mix table and scalar macro function definitions'), so the scalar body takes scalar overloads and the table body, parenthesised as the page asks when it is overloaded, takes table overloads; an overload has more parameters than the first implementation so that its signature is unique; the list's second item written out with a different name, which the renderer otherwise copies as a duplicate the parser refuses"

