[[definition]]
id = "doc.sql.query-syntax.from::join-clause"
source = "doc.sql.query-syntax.from"
name = "join-clause"
grammar = "<join-clause> ::= <table-or-subquery> { [ { NATURAL | ASOF } ] <join-type> | CROSS | POSITIONAL } JOIN <table-or-subquery> <join-conditions> [ { [ { NATURAL | ASOF } ] <join-type> | CROSS | POSITIONAL } JOIN <table-or-subquery> <join-conditions> ... ]"

[[definition]]
id = "doc.sql.query-syntax.from::join-conditions"
source = "doc.sql.query-syntax.from"
name = "join-conditions"
grammar = "<join-conditions> ::= [ { ON <expr> | USING ( <column-name> [ , <column-name> ... ] ) } ]"

[[definition]]
id = "doc.sql.query-syntax.from::join-type"
source = "doc.sql.query-syntax.from"
name = "join-type"
grammar = "<join-type> ::= [ { INNER | ANTI | SEMI | { LEFT | RIGHT | FULL } [ OUTER ] } ]"

[[definition]]
id = "doc.sql.query-syntax.from::subquery"
source = "doc.sql.query-syntax.from"
name = "subquery"
grammar = "<subquery> ::= [ LATERAL ] ( <select-node> ) [ <table-alias> ]"

[[definition]]
id = "doc.sql.query-syntax.from::table-alias"
source = "doc.sql.query-syntax.from"
name = "table-alias"
grammar = "<table-alias> ::= [ AS ] <table-alias> [ ( <column-alias> [ , <column-alias> ... ] ) ]"

[[definition]]
id = "doc.sql.query-syntax.from::table-function"
source = "doc.sql.query-syntax.from"
name = "table-function"
grammar = "<table-function> ::= [ <schema-name> . ] <table-function-name> ( [ <expr> [ , <expr> ... ] ] )"

[[definition]]
id = "doc.sql.query-syntax.from::table-reference"
source = "doc.sql.query-syntax.from"
name = "table-reference"
grammar = "<table-reference> ::= [ <schema-name> . ] <table-name>"

[[definition]]
id = "doc.sql.query-syntax.from::table-sample-reference"
source = "doc.sql.query-syntax.from"
name = "table-sample-reference"
grammar = "<table-sample-reference> ::= TABLESAMPLE { <sample-size> [ % | PERCENT | ROWS ] [ ( <sampling-method> [ , <seed> ] ) ] | [ <sampling-method> ] ( <sample-size> [ % | PERCENT | ROWS ] ) [ REPEATABLE ( <seed> ) ] }"

[[definition]]
id = "doc.sql.query-syntax.from::values"
source = "doc.sql.query-syntax.from"
name = "values"
grammar = "<values> ::= ( VALUES ( <expr> [ , <expr> ... ] ) [ , ( <expr> [ , <expr> ... ] ) ... ] )"

[[definition]]
id = "doc.sql.query-syntax.select::distinct-clause"
source = "doc.sql.query-syntax.select"
name = "distinct-clause"
grammar = "<distinct-clause> ::= [ DISTINCT [ ON ( <expr> [ , <expr> ... ] ) ] | ALL ]"

[[definition]]
id = "doc.sql.query-syntax.select::star-options-1"
source = "doc.sql.query-syntax.select"
name = "star-options-1"
grammar = "<star-options-1> ::= [ { EXCLUDE ( <exclude-name> [ , <exclude-name> ... ] ) | REPLACE ( <expr> AS <column-name> [ , <expr> AS <column-name> ... ] ) | RENAME ( <column-name> AS <column-name> [ , <column-name> AS <column-name> ... ] ) | [ NOT ] { LIKE | SIMILAR TO | GLOB | ILIKE } <pattern> } ]"

[[definition]]
id = "doc.sql.query-syntax.select::star-options-2"
source = "doc.sql.query-syntax.select"
name = "star-options-2"
grammar = "<star-options-2> ::= [ { EXCLUDE ( <exclude-name> [ , <exclude-name> ... ] ) | REPLACE ( <expr> AS <column-name> [ , <expr> AS <column-name> ... ] ) | RENAME ( <column-name> AS <column-name> [ , <column-name> AS <column-name> ... ] ) | [ NOT ] { LIKE | SIMILAR TO | GLOB | ILIKE } <pattern> } ]"

[[definition]]
id = "doc.sql.query-syntax.window::frame-spec"
source = "doc.sql.query-syntax.window"
name = "frame-spec"
grammar = "<frame-spec> ::= { GROUPS | RANGE | ROWS } { BETWEEN { UNBOUNDED PRECEDING | <expr> PRECEDING | CURRENT ROW | <expr> FOLLOWING } AND { <expr> PRECEDING | CURRENT ROW | <expr> FOLLOWING | UNBOUNDED FOLLOWING } | UNBOUNDED PRECEDING | <expr> PRECEDING | CURRENT ROW } [ EXCLUDE { CURRENT ROW | GROUP | TIES | NO OTHERS } ]"

[[definition]]
id = "doc.sql.query-syntax.window::window-definition"
source = "doc.sql.query-syntax.window"
name = "window-definition"
grammar = "<window-definition> ::= ( [ <base-window-name> ] [ PARTITION BY <expr> [ , <expr> ... ] ] [ ORDER BY { <expr> [ ASC | DESC ] [ NULLS { FIRST | LAST } ] [ , <expr> [ ASC | DESC ] [ NULLS { FIRST | LAST } ] ... ] | ALL [ ASC | DESC ] [ NULLS { FIRST | LAST } ] } ] <frame-spec> )"

[[definition]]
id = "doc.sql.statements.select::common-table-expr"
source = "doc.sql.statements.select"
name = "common-table-expr"
grammar = "<common-table-expr> ::= WITH [ RECURSIVE ] <table-name> [ ( <column-name> [ , <column-name> ... ] ) ] [ USING KEY ( <column-name> [ , <column-name> ... ] ) ] AS [ [ NOT ] MATERIALIZED ] { <select-node> | ( <select-node> ) } [ , <table-name> [ ( <column-name> [ , <column-name> ... ] ) ] [ USING KEY ( <column-name> [ , <column-name> ... ] ) ] AS [ [ NOT ] MATERIALIZED ] { <select-node> | ( <select-node> ) } ... ]"

[[definition]]
id = "doc.sql.statements.select::distinct-clause"
source = "doc.sql.statements.select"
name = "distinct-clause"
grammar = "<distinct-clause> ::= [ DISTINCT [ ON ( <expr> [ , <expr> ... ] ) ] | ALL ]"

[[definition]]
id = "doc.sql.statements.select::frame-spec"
source = "doc.sql.statements.select"
name = "frame-spec"
grammar = "<frame-spec> ::= { GROUPS | RANGE | ROWS } { BETWEEN { UNBOUNDED PRECEDING | <expr> PRECEDING | CURRENT ROW | <expr> FOLLOWING } AND { <expr> PRECEDING | CURRENT ROW | <expr> FOLLOWING | UNBOUNDED FOLLOWING } | UNBOUNDED PRECEDING | <expr> PRECEDING | CURRENT ROW } [ EXCLUDE { CURRENT ROW | GROUP | TIES | NO OTHERS } ]"

[[definition]]
id = "doc.sql.statements.select::join-clause"
source = "doc.sql.statements.select"
name = "join-clause"
grammar = "<join-clause> ::= <table-or-subquery> { [ { NATURAL | ASOF } ] <join-type> | CROSS | POSITIONAL } JOIN <table-or-subquery> <join-conditions> [ { [ { NATURAL | ASOF } ] <join-type> | CROSS | POSITIONAL } JOIN <table-or-subquery> <join-conditions> ... ]"

[[definition]]
id = "doc.sql.statements.select::join-conditions"
source = "doc.sql.statements.select"
name = "join-conditions"
grammar = "<join-conditions> ::= [ { ON <expr> | USING ( <column-name> [ , <column-name> ... ] ) } ]"

[[definition]]
id = "doc.sql.statements.select::join-type"
source = "doc.sql.statements.select"
name = "join-type"
grammar = "<join-type> ::= [ { INNER | ANTI | SEMI | { LEFT | RIGHT | FULL } [ OUTER ] } ]"

[[definition]]
id = "doc.sql.statements.select::select-node"
source = "doc.sql.statements.select"
name = "select-node"
grammar = "<select-node> ::= SELECT <distinct-clause> { <expr> [ [ AS ] <alias> ] | <alias> : <expr> | { [ <table-name> . ] * <star-options> | { COLUMNS | *COLUMNS } ( { [ <table-name> . ] * <star-options> | <regex> | lambda <c> [ , <i> ] : <lambda-filter> } ) } } [ , { <expr> [ [ AS ] <alias> ] | <alias> : <expr> | { [ <table-name> . ] * <star-options> | { COLUMNS | *COLUMNS } ( { [ <table-name> . ] * <star-options> | <regex> | lambda <c> [ , <i> ] : <lambda-filter> } ) } } ... ] [ FROM { { <table-reference> | <table-function> | <subquery> | <values> } [ <table-alias> ] [ <table-sample> ] | <join-clause> | ( <join-clause> ) [ AS <join-alias> ] } [ , { { <table-reference> | <table-function> | <subquery> | <values> } [ <table-alias> ] [ <table-sample> ] | <join-clause> | ( <join-clause> ) [ AS <join-alias> ] } ... ] ] [ WHERE <expr> ] [ GROUP BY { { <expr> | GROUPING SETS ( ( [ <expr> [ , <expr> ... ] ] ) [ , ( [ <expr> [ , <expr> ... ] ] ) ... ] ) | { CUBE | ROLLUP } ( <expr> [ , <expr> ... ] ) } [ , { <expr> | GROUPING SETS ( ( [ <expr> [ , <expr> ... ] ] ) [ , ( [ <expr> [ , <expr> ... ] ] ) ... ] ) | { CUBE | ROLLUP } ( <expr> [ , <expr> ... ] ) } ... ] | ALL } ] [ HAVING <expr> ] [ WINDOW <window-name> AS <window-definition> [ , <window-name> AS <window-definition> ... ] ] [ QUALIFY <window_function_expr> ] [ ORDER BY { <expr> [ ASC | DESC ] [ NULLS { FIRST | LAST } ] [ , <expr> [ ASC | DESC ] [ NULLS { FIRST | LAST } ] ... ] | ALL [ ASC | DESC ] [ NULLS { FIRST | LAST } ] } ] [ LIMIT <expr> ] [ OFFSET <expr> ]"

[[definition]]
id = "doc.sql.statements.select::star-options-1"
source = "doc.sql.statements.select"
name = "star-options-1"
grammar = "<star-options-1> ::= [ { EXCLUDE ( <exclude-name> [ , <exclude-name> ... ] ) | REPLACE ( <expr> AS <column-name> [ , <expr> AS <column-name> ... ] ) | RENAME ( <column-name> AS <column-name> [ , <column-name> AS <column-name> ... ] ) | [ NOT ] { LIKE | SIMILAR TO | GLOB | ILIKE } <pattern> } ]"

[[definition]]
id = "doc.sql.statements.select::star-options-2"
source = "doc.sql.statements.select"
name = "star-options-2"
grammar = "<star-options-2> ::= [ { EXCLUDE ( <exclude-name> [ , <exclude-name> ... ] ) | REPLACE ( <expr> AS <column-name> [ , <expr> AS <column-name> ... ] ) | RENAME ( <column-name> AS <column-name> [ , <column-name> AS <column-name> ... ] ) | [ NOT ] { LIKE | SIMILAR TO | GLOB | ILIKE } <pattern> } ]"

[[definition]]
id = "doc.sql.statements.select::subquery"
source = "doc.sql.statements.select"
name = "subquery"
grammar = "<subquery> ::= [ LATERAL ] ( <select-node> ) [ <table-alias> ]"

[[definition]]
id = "doc.sql.statements.select::table-alias"
source = "doc.sql.statements.select"
name = "table-alias"
grammar = "<table-alias> ::= [ AS ] <table-alias> [ ( <column-alias> [ , <column-alias> ... ] ) ]"

[[definition]]
id = "doc.sql.statements.select::table-function"
source = "doc.sql.statements.select"
name = "table-function"
grammar = "<table-function> ::= [ <schema-name> . ] <table-function-name> ( [ <expr> [ , <expr> ... ] ] )"

[[definition]]
id = "doc.sql.statements.select::table-reference"
source = "doc.sql.statements.select"
name = "table-reference"
grammar = "<table-reference> ::= [ <schema-name> . ] <table-name>"

[[definition]]
id = "doc.sql.statements.select::table-sample-reference"
source = "doc.sql.statements.select"
name = "table-sample-reference"
grammar = "<table-sample-reference> ::= TABLESAMPLE { <sample-size> [ % | PERCENT | ROWS ] [ ( <sampling-method> [ , <seed> ] ) ] | [ <sampling-method> ] ( <sample-size> [ % | PERCENT | ROWS ] ) [ REPEATABLE ( <seed> ) ] }"

[[definition]]
id = "doc.sql.statements.select::values"
source = "doc.sql.statements.select"
name = "values"
grammar = "<values> ::= ( VALUES ( <expr> [ , <expr> ... ] ) [ , ( <expr> [ , <expr> ... ] ) ... ] )"

[[definition]]
id = "doc.sql.statements.select::window-definition"
source = "doc.sql.statements.select"
name = "window-definition"
grammar = "<window-definition> ::= ( [ <base-window-name> ] [ PARTITION BY <expr> [ , <expr> ... ] ] [ ORDER BY { <expr> [ ASC | DESC ] [ NULLS { FIRST | LAST } ] [ , <expr> [ ASC | DESC ] [ NULLS { FIRST | LAST } ] ... ] | ALL [ ASC | DESC ] [ NULLS { FIRST | LAST } ] } ] <frame-spec> )"
