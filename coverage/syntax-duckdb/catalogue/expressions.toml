[[definition]]
id = "doc.sql.functions.aggregates::order-by"
source = "doc.sql.functions.aggregates"
name = "order-by"
grammar = "<order-by> ::= ORDER BY { <expr> [ ASC | DESC ] [ NULLS { FIRST | LAST } ] [ , <expr> [ ASC | DESC ] [ NULLS { FIRST | LAST } ] ... ] | ALL [ ASC | DESC ] [ NULLS { FIRST | LAST } ] }"

[[definition]]
id = "doc.sql.functions.window-functions::frame-spec"
source = "doc.sql.functions.window-functions"
name = "frame-spec"
grammar = "<frame-spec> ::= { GROUPS | RANGE | ROWS } { BETWEEN { UNBOUNDED PRECEDING | <expr> PRECEDING | CURRENT ROW | <expr> FOLLOWING } AND { <expr> PRECEDING | CURRENT ROW | <expr> FOLLOWING | UNBOUNDED FOLLOWING } | UNBOUNDED PRECEDING | <expr> PRECEDING | CURRENT ROW } [ EXCLUDE { CURRENT ROW | GROUP | TIES | NO OTHERS } ]"
