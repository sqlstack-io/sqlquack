[[definition]]
id = "doc.sql.expressions.star::star-options-1"
source = "doc.sql.expressions.star"
name = "star-options-1"
grammar = "<star-options-1> ::= [ { EXCLUDE ( <exclude-name> [ , <exclude-name> ... ] ) | REPLACE ( <expr> AS <column-name> [ , <expr> AS <column-name> ... ] ) | RENAME ( <column-name> AS <column-name> [ , <column-name> AS <column-name> ... ] ) | [ NOT ] { LIKE | SIMILAR TO | GLOB | ILIKE } <pattern> } ]"

