[[definition]]
id = "doc.sql.statements.alter-table::alter-column-options"
source = "doc.sql.statements.alter-table"
name = "alter-column-options"
grammar = "<alter-column-options> ::= { [ SET [ DATA ] ] TYPE <data-type> [ COLLATE <collation-name> ] [ USING <expr> ] | SET DEFAULT <expr> | DROP DEFAULT | SET NOT NULL | DROP NOT NULL }"

[[definition]]
id = "doc.sql.statements.alter-table::column-constraints"
source = "doc.sql.statements.alter-table"
name = "column-constraints"
grammar = "<column-constraints> ::= [ { PRIMARY KEY | [ NOT ] NULL | UNIQUE | CHECK ( <expr> ) | DEFAULT { <literal-value> | ( <expr> ) } | REFERENCES <foreign-table> ( <column-name> [ , <column-name> ... ] ) | COLLATE <collation-name> } [ { PRIMARY KEY | [ NOT ] NULL | UNIQUE | CHECK ( <expr> ) | DEFAULT { <literal-value> | ( <expr> ) } | REFERENCES <foreign-table> ( <column-name> [ , <column-name> ... ] ) | COLLATE <collation-name> } ... ] ]"

[[definition]]
id = "doc.sql.statements.create-table::column-constraints"
source = "doc.sql.statements.create-table"
name = "column-constraints"
grammar = "<column-constraints> ::= [ { PRIMARY KEY | [ NOT ] NULL | UNIQUE | CHECK ( <expr> ) | DEFAULT { <literal-value> | ( <expr> ) } | REFERENCES <foreign-table> ( <column-name> [ , <column-name> ... ] ) | COLLATE <collation-name> } [ { PRIMARY KEY | [ NOT ] NULL | UNIQUE | CHECK ( <expr> ) | DEFAULT { <literal-value> | ( <expr> ) } | REFERENCES <foreign-table> ( <column-name> [ , <column-name> ... ] ) | COLLATE <collation-name> } ... ] ]"

[[definition]]
id = "doc.sql.statements.create-table::generated-column"
source = "doc.sql.statements.create-table"
name = "generated-column"
grammar = "<generated-column> ::= [ <type-name> ] [ GENERATED ALWAYS ] AS ( <expr> ) [ { VIRTUAL | STORED } ]"

[[definition]]
id = "doc.sql.statements.create-table::table-constraints"
source = "doc.sql.statements.create-table"
name = "table-constraints"
grammar = "<table-constraints> ::= [ { { PRIMARY KEY | UNIQUE } ( <column-name> [ , <column-name> ... ] ) | CHECK ( <expr> ) | FOREIGN KEY ( <column-name> [ , <column-name> ... ] ) REFERENCES <foreign-table> ( <column-name> [ , <column-name> ... ] ) } [ , { { PRIMARY KEY | UNIQUE } ( <column-name> [ , <column-name> ... ] ) | CHECK ( <expr> ) | FOREIGN KEY ( <column-name> [ , <column-name> ... ] ) REFERENCES <foreign-table> ( <column-name> [ , <column-name> ... ] ) } ... ] ]"
