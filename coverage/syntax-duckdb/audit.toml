# Reviewed omission audit of the DuckDB catalogue against the pinned PEG grammar and engine;
# checked by scripts/audit_syntax_catalogue_duckdb.py, which fails on any unreviewed or stale row.
#
# [[gap]]: a grammar rule's keyword sequences no catalogued form spells, with the reason.
# [[keyword]]: a keyword the grammar uses that no catalogued grammar names.
# [[function]]: an engine function no grammar names, by name or by prefix.
# [[type]]: an engine type name no grammar names. [[unwalked]]: a rule the walk does not reach.
# [[unseen]]: syntax of a walked rule that yields no keyword sequence the gap walk compares, kept
#   uncatalogued with its reason; the audit fails when a rule of UNSEEN_RULES (constants.py) has no
#   row, when a row names a rule not in that list, or when a listed rule is no longer walked.

grammar_sha256 = "9a1b57dbe20c683a6a166b7676f95946b656a9a7e92abc112a93c63e67d61e6e"
engine_extract_sha256 = "fc83f816459976e50baf71cd4e6972bc1f65b681cb440f5e389ee6e7ad8f039d"

limits = [
    "Walk: every non-macro rule reachable from Statement in the PEG grammar files is walked; every other non-macro rule is listed under [[unwalked]] with a reason, and the audit fails on an unwalked rule that is not listed.",
    "Spelling: an alternative is checked as its keyword literals in order. Identifiers, literals, punctuation and operator symbols are not compared; a referenced rule contributes words only when it spells only keywords and punctuation in at most 60 ways.",
    "Containment: a sequence is covered when one catalogued form, with its page's definitions inlined, contains its keywords in order, not necessarily adjacent; a statement's sequence must start with the form's first keyword. A clause sequence may also be covered by a catalogued definition.",
    "Below a statement, alternatives that spell fewer than 2 keywords are checked only by the [[keyword]] check.",
    "Derived gaps: a gap that contains, as a contiguous run, a gap of a rule it reaches is counted (gaps_derived) but not reviewed; its reviewed root gives the reason. A gap that a [[gap]] row names under its own rule stays a root with its own reason (PARTITIONED BY and SET PARTITIONED BY / SET SORTED BY on tables, which reach COPY's PARTITIONED BY only through nested statements).",
    "Blind spots: syntax spelled only by punctuation or operator symbols (slice bounds, .fn() calls, ~*, PRAGMA x = v, LIMIT n%) yields no keyword sequence, an optional clause whose rule spells fewer than 2 keywords or also spells identifiers or expressions (RETURNING, USING ( <columns> ), TABLE <name>) adds no words to its statement's sequences, so it is checked only by the [[keyword]] check, which any form spelling the word satisfies, and an optional keyword a parent rule spells before such a child rule (OR REPLACE on CreateStatement, before CREATE TYPE and the other variations) is checked with the parent's words only, which any CREATE form spelling OR REPLACE covers. None of these reaches a [[gap]] row; they were checked by reading the pages, and any of them left uncatalogued is an [[unseen]] row.",
    "Engine names: functions, keywords and types are those duckdb_functions(), duckdb_keywords() and duckdb_types() report in a fresh in-memory database of the pinned 2.0.0 build with its statically linked extensions (ICU among them) and nothing installed; a name counts as catalogued when some grammar spells it as a word or operator.",
    "Expansion: an alternative spelling more than 4096 keyword sequences stops the audit with an error instead of being truncated; none does at the pinned grammar.",
]

[[gap]]
rule = "TransactionStatement"
sequences = [
    "START",
    "END",
]
reason = "undocumented: the 2.0 grammar accepts START and END as transaction statements (a PostgreSQL spelling); transactions.md documents BEGIN TRANSACTION, COMMIT, ROLLBACK and ABORT"

