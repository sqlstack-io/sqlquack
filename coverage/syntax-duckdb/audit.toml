    "IS TRUE",
    "IS FALSE",
    "IS UNKNOWN",
    "IS NOT TRUE",
    "IS NOT FALSE",
    "IS NOT UNKNOWN",
]
reason = "undocumented: the 2.0 grammar accepts IS [ NOT ] TRUE / FALSE / UNKNOWN; comparison_operators.md documents IS [ NOT ] NULL and IS [ NOT ] DISTINCT FROM only"

[[gap]]
rule = "UpdateAction"
sequences = [
    "ON UPDATE RESTRICT",
    "ON UPDATE CASCADE",
    "ON UPDATE SET NULL",
    "ON UPDATE SET DEFAULT",
]
reason = "undocumented: the 2.0 grammar accepts ON UPDATE referential actions; create_table.md and constraints.md document REFERENCES without actions"

[[gap]]
rule = "DeleteAction"
sequences = [
    "ON DELETE RESTRICT",
    "ON DELETE SET NULL",
    "ON DELETE SET DEFAULT",
]
reason = "undocumented: create_table.md documents REFERENCES without actions and names only ON DELETE CASCADE, as unsupported, catalogued as the observed form dd.ddl.create-table.foreign-key-on-delete-cascade; 2.0 refuses SET NULL and SET DEFAULT while parsing like CASCADE (FOREIGN KEY constraints cannot use CASCADE, SET NULL or SET DEFAULT), and RESTRICT is the default action spelled out"

[[gap]]
rule = "BetweenClause"
sequences = [
    "BETWEEN ASYMMETRIC AND",
]
reason = "undocumented: the 2.0 grammar accepts BETWEEN ASYMMETRIC (SQL standard); comparison_operators.md documents [ NOT ] BETWEEN <x> AND <y>"

[[gap]]
rule = "NoKeyAction"
sequences = [
    "NO ACTION",
]
reason = "undocumented: the 2.0 grammar accepts NO ACTION as a referential action; constraints are documented without actions, and NO ACTION appears only as a value of information_schema.referential_constraints"

