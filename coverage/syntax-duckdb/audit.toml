[[unseen]]
rule = "CreateColumnList"
syntax = "CREATE TABLE <table-name> ( <columns> ) WITH ( <option> = <value> [ , ... ] ), and CREATE TABLE <table-name> WITH ( ... ) AS <query> (CreateTableAs)"
reason = "outside the page set: the table options of CREATE TABLE are documented only on the delta, iceberg and unity_catalog extension pages (core_extensions, an excluded page group), for tables of those catalogs; WithList spells the one keyword WITH, so the gap walk yields no sequence for it; 2.0 parses it and EXPLAIN plans it, and only executing it fails for a DuckDB table (Catalog Error: WITH clause is not supported for tables in a duckdb catalog)"

[[unseen]]
rule = "CreateStatement"
syntax = "CREATE [ OR REPLACE ] { TEMPORARY | TEMP } TYPE [ IF NOT EXISTS ] <name> AS { ENUM ( <query> ) | ENUM ( <string> [ , ... ] ) | <type> }, where <type> is any type, including STRUCT ( ... ), UNION ( ... ) and array types"
reason = "documented on no in-set page: only internals/pivot.md (internals, an excluded page group) writes CREATE TEMPORARY TYPE, as the internal rewrite of PIVOT, and the in-set create_type.md and enum.md pages write CREATE TYPE without TEMPORARY; Temporary is an optional keyword CreateStatement spells before CreateTypeStmt, so it is checked with CREATE TEMPORARY only, which the CREATE TEMPORARY TABLE forms cover; 2.0 parses and runs every spelling: AS ENUM with a query or a list, AS a base type such as INTEGER, AS STRUCT ( ... ), AS UNION ( ... ) and AS an array type, each with OR REPLACE or IF NOT EXISTS (a temporary type usable in casts, and an ENUM one in PIVOT IN)"

[[unseen]]
rule = "CreateViewStmt"
syntax = "CREATE VIEW <view-name> WITH ( DEFER_BINDING ) AS <query>"
reason = "documented on no page of docs/2.0; WithList spells the one keyword WITH, so the gap walk yields no sequence for it; 2.0 parses and runs it, creating the view without binding its query (a view over a missing table is created), and any option other than DEFER_BINDING is a Parser Error raised while parsing, inside extract_statements (Only DEFER_BINDING is currently supported as option for CREATE VIEW)"

[[unseen]]
rule = "PivotEnumTarget"
syntax = "PIVOT <table-name> ON <pivot-column> IN <enum-type> [ USING ... ]"
reason = "documented on no in-set page: only internals/pivot.md (internals, an excluded page group) writes IN followed by an ENUM type name without parentheses, as the internal rewrite of PIVOT; PivotEnumTarget is a bare Identifier and spells no keyword, so the gap walk yields no sequence for it; 2.0 parses and runs it, taking the pivot values from the ENUM type"

