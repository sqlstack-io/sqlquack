# Hand-written readings, suppressions and limits of the BigQuery catalogue's obligations; read by
# scripts/build_syntax_obligations_bigquery.py through the shared obligation builder.
#
# [[reading]] replaces a form's grammar for derivation only, bound to the catalogue grammar's
# sha256; an empty grammar means the form's obligations are all hand-written [[limit]] rows.
# [[suppress]] withdraws one derived obligation (form, kind, target) with the reason it is not
# the negative or positive it looks like. [[limit]] is a hand-written obligation with its SQL.

