[[block]]
source = "doc.query-syntax"
block_sha256 = "aac826b4218745d95ce1269b989ace9a358dcd2b43c9e9ffb11c2988575eb933"
status = "corrected"
reason = "the last line defines unpivot_alias and row_value_alias together ('unpivot_alias and row_value_alias:'); split into two definitions"
grammar = [
  "FROM <from_item> [ , ... ] <unpivot_operator>",
  "<unpivot_operator> ::= UNPIVOT [ { INCLUDE NULLS | EXCLUDE NULLS } ] ( { <single_column_unpivot> | <multi_column_unpivot> } ) [ <unpivot_alias> ]",
  "<single_column_unpivot> ::= <values_column> FOR <name_column> IN ( <columns_to_unpivot> )",
  "<multi_column_unpivot> ::= <values_column_set> FOR <name_column> IN ( <column_sets_to_unpivot> )",
  "<values_column_set> ::= ( <values_column> [ , ... ] )",
  "<columns_to_unpivot> ::= <unpivot_column> [ <row_value_alias> ] [ , ... ]",
  "<column_sets_to_unpivot> ::= ( <unpivot_column> [ <row_value_alias> ] [ , ... ] )",
  "<unpivot_alias> ::= [ AS ] <alias>",
  "<row_value_alias> ::= [ AS ] <alias>",
]
family = ""

