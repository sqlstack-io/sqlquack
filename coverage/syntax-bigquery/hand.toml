# Reviewed inputs to scripts/build_syntax_catalogue_bigquery.py; read by the build only.
#
# [[form]]: a form read by hand where the syntax is in prose, a table or example code
#   blocks rather than a syntax block. Bound to the sha256 of the page's Markdown; the build
#   refuses a form whose page changed. Fields: source, anchor, kind, label, family, grammar,
#   basis, page_sha256.
# [[page]]: the reviewed status of a page that yields no form (no_syntax_block or out_of_scope),
#   with the reason, bound to the page's sha256.
# [[block]]: the reviewed disposition of one code block the build would otherwise read as
#   notation, or would refuse to read (it follows prose, sits under an argument heading, or
#   holds a URL, a table, a mixed-case word, a lower-case keyword, unbalanced brackets or a
#   mistyped quote). Bound to the block's sha256; a block that changes is unreviewed again,
#   and a review that names no current block is a problem. status is one of:
#   notation (read as written), corrected (grammar replaces it; `<name> ::= ...` lines are
#   definitions), restated (its words must appear in the page's forms), example,
#   not_syntax, out_of_scope. family overrides the page's family when set.

