source = "doc.bigqueryml-syntax-create-random-forest"
block_sha256 = "41624638b089774145dc2ae66b1c58e0141ace04dad61b1a2e80e38de86b033c"
status = "corrected"
reason = "model_option_list has a stray ']' after its MODEL_TYPE entry"
grammar = [
  "{ CREATE MODEL | CREATE MODEL IF NOT EXISTS | CREATE OR REPLACE MODEL } <model_name> OPTIONS ( <model_option_list> ) AS <query_statement>",
  "<model_option_list> ::= MODEL_TYPE = { 'RANDOM_FOREST_CLASSIFIER' | 'RANDOM_FOREST_REGRESSOR' } [ , APPROX_GLOBAL_FEATURE_CONTRIB = { TRUE | FALSE } ] [ , NUM_PARALLEL_TREE = { <int64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , MAX_TREE_DEPTH = { <int64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , L1_REG = { <float64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , L2_REG = { <float64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , TREE_METHOD = { { 'AUTO' | 'EXACT' | 'APPROX' | 'HIST' } | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , MIN_TREE_CHILD_WEIGHT = { <int64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , COLSAMPLE_BYTREE = { <float64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , COLSAMPLE_BYLEVEL = { <float64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , COLSAMPLE_BYNODE = { <float64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , MIN_SPLIT_LOSS = { <float64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , SUBSAMPLE = { <float64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , INSTANCE_WEIGHT_COL = <string_value> ] [ , AUTO_CLASS_WEIGHTS = { TRUE | FALSE } ] [ , CLASS_WEIGHTS = <struct_array> ] [ , ENABLE_GLOBAL_EXPLAIN = { TRUE | FALSE } ] [ , EARLY_STOP = { TRUE | FALSE } ] [ , MIN_REL_PROGRESS = <float64_value> ] [ , INPUT_LABEL_COLS = <string_array> ] [ , DATA_SPLIT_METHOD = { 'AUTO_SPLIT' | 'RANDOM' | 'CUSTOM' | 'SEQ' | 'NO_SPLIT' } ] [ , DATA_SPLIT_EVAL_FRACTION = <float64_value> ] [ , DATA_SPLIT_TEST_FRACTION = <float64_value> ] [ , DATA_SPLIT_COL = <string_value> ] [ , NUM_TRIALS = <int64_value> ] [ , MAX_PARALLEL_TRIALS = <int64_value> ] [ , HPARAM_TUNING_ALGORITHM = { 'VIZIER_DEFAULT' | 'RANDOM_SEARCH' | 'GRID_SEARCH' } ] [ , HPARAM_TUNING_OBJECTIVES = { 'ROC_AUC' | 'R2_SCORE' | ... } ] [ , MODEL_REGISTRY = { 'VERTEX_AI' } ] [ , VERTEX_AI_MODEL_ID = <string_value> ] [ , VERTEX_AI_MODEL_VERSION_ALIASES = <string_array> ] [ , KMS_KEY_NAME = <string_value> ]",
]
family = ""

