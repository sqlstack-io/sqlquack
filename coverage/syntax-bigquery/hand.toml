reason = "the UPDATE synopsis, written after prose under its statement heading"

[[block]]
source = "doc.dml-syntax"
block_sha256 = "dddebe9fe7f1157636a07cc2d83ba41b79da9c9422b8d67c94b0c341af65aae2"
status = "corrected"
reason = "the MERGE synopsis, written after prose under its statement heading; its regular-expression marks `{ when_clause } +` (one or more) and `[, update_item]*` (zero or more) have no sign in the notation, so they are written as an item followed by `[ ... ]`. Its numbered names (column_1 … column_n, expr_1 … expr_n) are one column or one expr repeated, so they are written as one column name and the defined <expr> (expression or DEFAULT) followed by [ , ... ]"
grammar = [
  "MERGE [ INTO ] <target_name> [ [ AS ] <alias> ] USING <source_name> [ [ AS ] <alias> ] ON <merge_condition> <when_clause> [ ... ]",
  "<when_clause> ::= <matched_clause> | <not_matched_by_target_clause> | <not_matched_by_source_clause>",
  "<matched_clause> ::= WHEN MATCHED [ AND <search_condition> ] THEN { <merge_update_clause> | <merge_delete_clause> }",
  "<not_matched_by_target_clause> ::= WHEN NOT MATCHED [ BY TARGET ] [ AND <search_condition> ] THEN <merge_insert_clause>",
  "<not_matched_by_source_clause> ::= WHEN NOT MATCHED BY SOURCE [ AND <search_condition> ] THEN { <merge_update_clause> | <merge_delete_clause> }",
  "<merge_condition> ::= <bool_expression>",
  "<search_condition> ::= <bool_expression>",
  "<merge_update_clause> ::= UPDATE SET <update_item> [ , <update_item> ] [ ... ]",
  "<update_item> ::= <column_name> = <expression>",
  "<merge_delete_clause> ::= DELETE",
  "<merge_insert_clause> ::= INSERT [ ( <column_name> [ , ... ] ) ] <input>",
  "<input> ::= VALUES ( <expr> [ , ... ] ) | ROW",
  "<expr> ::= <expression> | DEFAULT",
]
family = ""

