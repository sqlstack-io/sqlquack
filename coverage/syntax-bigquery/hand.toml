[[block]]
source = "doc.bigqueryml-syntax-create-autoencoder"
block_sha256 = "333c1caeddaabf66de36d8b36a12ab8605e266de7ffef185201979c837c6a73d"
status = "corrected"
reason = "model_option_list has a stray ']' after its MODEL_TYPE entry, and its ACTIVATION_FN choice opens one brace for two closing ones; the value list is braced as the other options' are"
grammar = [
  "{ CREATE MODEL | CREATE MODEL IF NOT EXISTS | CREATE OR REPLACE MODEL } <model_name> OPTIONS ( <model_option_list> ) AS <query_statement>",
  "<model_option_list> ::= MODEL_TYPE = { 'AUTOENCODER' } [ , L1_REG_ACTIVATION = { <float64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , LEARN_RATE = { <float64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , OPTIMIZER = { { 'ADAGRAD' | 'ADAM' | 'FTRL' | 'RMSPROP' | 'SGD' } | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , ACTIVATION_FN = { { 'RELU' | 'RELU6' | 'ELU' | 'SELU' | 'SIGMOID' | 'TANH' } | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , BATCH_SIZE = { <int64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , DROPOUT = { <float64_value> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , HIDDEN_UNITS = { <int_array> | HPARAM_RANGE ( <range> ) | HPARAM_CANDIDATES ( [ <candidates> ] ) } ] [ , EARLY_STOP = { TRUE | FALSE } ] [ , MIN_REL_PROGRESS = <float64_value> ] [ , MAX_ITERATIONS = <int64_value> ] [ , WARM_START = { TRUE | FALSE } ] [ , NUM_TRIALS = <int64_value> ] [ , MAX_PARALLEL_TRIALS = <int64_value> ] [ , HPARAM_TUNING_ALGORITHM = { 'VIZIER_DEFAULT' | 'RANDOM_SEARCH' | 'GRID_SEARCH' } ] [ , HPARAM_TUNING_OBJECTIVES = { MEAN_SQUARED_ERROR | ... } ] [ , KMS_KEY_NAME = <string_value> ]",
]
family = ""

