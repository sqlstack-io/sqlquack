[[block]]
source = "doc.bigqueryml-syntax-create-pca"
block_sha256 = "8cfb1e89be86dfcb780cffa0f5328282dfeca2e4833101dc4dcc39a919135d58"
status = "corrected"
reason = "the page writes `NUM_PRINCIPAL_COMPONENTS = int64_value | PCA_EXPLAINED_VARIANCE_RATIO = float64_value` with a bare bar at the top of model_option_list, which splits the whole list in two; the bar chooses between the two options only, so they are braced"
grammar = [
  "{ CREATE MODEL | CREATE MODEL IF NOT EXISTS | CREATE OR REPLACE MODEL } <model_name> OPTIONS ( <model_option_list> ) AS <query_statement>",
  "<model_option_list> ::= MODEL_TYPE = PCA , { NUM_PRINCIPAL_COMPONENTS = <int64_value> | PCA_EXPLAINED_VARIANCE_RATIO = <float64_value> } [ , SCALE_FEATURES = { TRUE | FALSE } ] [ , PCA_SOLVER = { 'FULL' | 'RANDOMIZED' | 'AUTO' } ] [ , MODEL_REGISTRY = { 'VERTEX_AI' } ] [ , VERTEX_AI_MODEL_ID = <string_value> ] [ , VERTEX_AI_MODEL_VERSION_ALIASES = <string_array> ] [ , KMS_KEY_NAME = <string_value> ]",
]
family = ""

[[block]]
source = "doc.graph-patterns"
block_sha256 = "47f248fac98019b5946b749bc2620b17a850db52cd8de16d719868a0e05f4979"
status = "corrected"
reason = "the last definition, `element_property: element_property_name : element_property_value`, reads as a second definition head; the colon after element_property_name is the property filter's literal separator (`{ id: 7 }`), so it is written as a literal"
grammar = [
  "{ <node_pattern> | <edge_pattern> }",
  "<node_pattern> ::= ( <pattern_filler> )",
  "<edge_pattern> ::= { <full_edge_any> | <full_edge_left> | <full_edge_right> | <abbreviated_edge_any> | <abbreviated_edge_left> | <abbreviated_edge_right> }",
  "<full_edge_any> ::= \"-[\" <pattern_filler> \"]-\"",
  "<full_edge_left> ::= \"<-[\" <pattern_filler> \"]-\"",
  "<full_edge_right> ::= \"-[\" <pattern_filler> \"]->\"",
  "<abbreviated_edge_any> ::= -",
  "<abbreviated_edge_left> ::= <-",
  "<abbreviated_edge_right> ::= ->",
  "<pattern_filler> ::= [ <graph_pattern_variable> ] [ <is_label_condition> ] [ { <where_clause> | <property_filters> } ] [ <cost_expression> ]",
  "<is_label_condition> ::= { IS | : } <label_expression>",
  "<cost_expression> ::= COST <expression>",
  "<where_clause> ::= WHERE <bool_expression>",
  "<property_filters> ::= \"{\" <element_property> [ , ... ] \"}\"",
  "<element_property> ::= <element_property_name> \":\" <element_property_value>",
]
family = ""

[[block]]
source = "doc.data-types"
block_sha256 = "7dfe2d5da642ac8f606234b44fd6225b1fce9ab3d2a4313e5a5e7d113b1a2f92"
status = "corrected"
reason = "`STRUCT<T>` declares a struct type whose field type list T may name its fields or not (data-types.md:1110, :1126); it is not a restatement of the named-field form, so it is the definition of a struct type with optional field names"
grammar = [
  "<struct_type> ::= STRUCT \"<\" [ <field_name> ] <field_type> [ , ... ] \">\"",
]
family = ""

