[[block]]
source = "doc.dml-syntax"
block_sha256 = "89e5412c539319890012ffbfeb873c181583bdad558c059b9595ac3e08a4c6a3"
status = "corrected"
reason = "the INSERT synopsis, written after prose; SELECT_QUERY is the page's placeholder for a query, so it is read as one. Its numbered names (column_1 … column_n, expr_1 … expr_k_n) are one column or one expr repeated, so they are written as the defined <expr> (value_expression or DEFAULT) and one column name followed by [ , ... ]"
grammar = [
  "INSERT [ INTO ] <target_name> [ ( <column_name> [ , ... ] ) ] <input>",
  "<input> ::= VALUES <row> [ , ... ] | <select_query>",
  "<row> ::= ( <expr> [ , ... ] )",
  "<expr> ::= <value_expression> | DEFAULT",
]
family = ""

