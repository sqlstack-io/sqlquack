# The referee runs whose receipts this root holds; written by hand when a run's receipts are
# committed, and read by no tool. Each run called the BigQuery API v2 in the referee's fixed
# free-trial sandbox project (no receipt names it), with the referee at `referee`, the
# repository commit the run's report names. Every case was a dry run; a dry run that the execution policy allows was
# followed by one execution in the run datasets (see README.md, Receipts).
#
# isolation:
#   run_datasets: two throwaway datasets per run, SQLQUACK_DATASET and SQLQUACK_DATASET2 in
#     receipts, created with a one-hour table expiry and dropped when the run ended; the
#     referee reads their state after every execution and stops if a case changed it.
#   case_datasets: DDL, TRUNCATE, EXPORT DATA and row access policy drops run in two more
#     throwaway datasets made for that one case, with only its fixtures, dropped after it.
#
# receipts: the file in receipts/ the checker reads as the current receipts.
# reversed_run: a run of the same cases in reverse order (run --reverse), kept in repeats/ where
#   the checker does not read it. Compare it with the receipts:
#   python -m scripts.run_bigquery_receipts compare <receipts file> <repeats file>
# reversed_compared: what that comparison printed.
# bytes_billed: dry-run and executed bytes billed, summed from the run report.

