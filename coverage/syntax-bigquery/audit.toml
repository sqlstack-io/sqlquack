# Reviewed omission audit of the BigQuery catalogue against the pinned GoogleSQL grammar
# (googlesql.tm) and keyword table (keywords.cc); checked by
# scripts/audit_syntax_catalogue_bigquery.py, which fails on any unreviewed or stale row.
#
# kind, on [[gap]] and [[keyword]] rows, is checked against the pinned reference pages:
#   googlesql_only: GoogleSQL grammar no page of the reference spells; the reason starts
#     "GoogleSQL grammar, not a BigQuery feature" and the audit fails if any code line or code
#     span of the pinned pages spells a sequence of the row.
#   undocumented: as googlesql_only, for a word the reference lists (reserved) but uses nowhere.
#   spelled_otherwise: the reference spells the words, in another construct that is catalogued;
#     the audit fails if no page spells them.
# [[gap]]: a grammar rule's keyword sequences no catalogued grammar spells contiguously.
# [[keyword]]: keywords.cc keywords no catalogued grammar spells as a keyword.
# [[dispatched]]: words the grammar's actions compare identifiers with (CaseEqual).
# [[feature]]: each FEATURE_ language option the grammar's actions test, reviewed as enabled
#   in BigQuery (with catalogued forms as evidence) or not_enabled; a gap gated by a
#   not_enabled feature must name it in its reason.
# [[unseen]]: syntax of a walked rule the gap walk cannot see (punctuation, lexical forms);
#   the audit fails when a rule of UNSEEN_RULES (constants.py) has no row, when a row names
#   a rule not in that list, or when a listed rule is no longer walked.
# [[unwalked]]: a rule the walk from the grammar's entry rules does not reach.

grammar_sha256 = "38a88ee136bd770fca435b5ba4c60a45251a91daa51710fc5d783f957971737e"
keywords_sha256 = "65bcb223e4a78de52097426d06e18c45d2269a3e0096d0a925a01f139641f4f0"

limits = [
  "Walk: every parser rule of googlesql.tm reachable from its %input entry rules (script, sql_statement, next_script_statement, next_statement, standalone_expression, standalone_type) is walked; the rest are listed under [[unwalked]].",
  "Spelling: an alternative is spelled as its keyword literals and KW_ tokens in order; a referenced rule that spells only keywords (at most 60 ways) is inlined, any other nonterminal is a wildcard. Alternatives whose action only returns a syntax error are skipped (alternatives_rejected).",
  "Containment: a sequence is covered only when one catalogued grammar line, with its page's definitions inlined, spells each keyword run contiguously, in order, with other keywords only where the grammar has a wildcard; a statement's sequence must start the line. A clause sequence may also be covered by a catalogued definition.",
  "Below a statement, alternatives that spell fewer than 2 keywords are checked only by the [[keyword]] check, which counts words outside placeholders and quoted strings only.",
  "Derived gaps: a gap containing a gap of a rule it reaches as a contiguous run, or containing in order a shorter gap of its own alternative, is counted (gaps_derived) and takes its root's reason.",
  "Docs checks: a reviewed kind is checked against every code line and code span of the pinned pages, not against prose; reasons citing prose were read by hand.",
  "Features: language features are those the parser actions test with LanguageFeatureEnabled, directly or through a helper of the parser template; enabled-or-not is read from the reference, not from an engine.",
  "Names: OPTIONS option names (the 36 option tables of the DDL, load and export pages), the differential-privacy parameters (epsilon, delta, max_groups_contributed, privacy_unit_column; query-syntax.md:5527-5532) and the system variable names (system-variables.md:12-29) are identifiers to the grammar (an options_list entry is identifier = expression; a system variable is @@ and a path), so the walk cannot compare them and the catalogue writes them as the `name = value` and `@@name` forms; BigQuery checks the names after parsing. The BigQuery ML pages, which spell their option names in the syntax block, keep them as written.",
]

