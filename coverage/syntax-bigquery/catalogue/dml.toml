[[definition]]
id = "doc.dml-syntax::matched_clause"
source = "doc.dml-syntax"
name = "matched_clause"
grammar = "<matched_clause> ::= WHEN MATCHED [ AND <search_condition> ] THEN { <merge_update_clause> | <merge_delete_clause> }"

[[definition]]
