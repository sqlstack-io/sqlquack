grammar = "<merge_insert_clause> ::= INSERT [ ( <column_name> [ , ... ] ) ] <input>"

[[definition]]
id = "doc.dml-syntax::merge_update_clause"
source = "doc.dml-syntax"
name = "merge_update_clause"
grammar = "<merge_update_clause> ::= UPDATE SET <update_item> [ , <update_item> ] [ ... ]"

[[definition]]
