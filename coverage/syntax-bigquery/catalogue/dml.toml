source = "doc.dml-syntax"
name = "not_matched_by_source_clause"
grammar = "<not_matched_by_source_clause> ::= WHEN NOT MATCHED BY SOURCE [ AND <search_condition> ] THEN { <merge_update_clause> | <merge_delete_clause> }"

[[definition]]
id = "doc.dml-syntax::not_matched_by_target_clause"
source = "doc.dml-syntax"
name = "not_matched_by_target_clause"
grammar = "<not_matched_by_target_clause> ::= WHEN NOT MATCHED [ BY TARGET ] [ AND <search_condition> ] THEN <merge_insert_clause>"

