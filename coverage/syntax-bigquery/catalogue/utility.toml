[[definition]]
id = "doc.procedural-language::block_statement_list"
source = "doc.procedural-language"
name = "block_statement_list"
grammar = "<block_statement_list> ::= { <statement> | <break_statement_with_label> } [ , ... ]"

[[definition]]
id = "doc.procedural-language::break_continue_statement_with_label"
source = "doc.procedural-language"
name = "break_continue_statement_with_label"
grammar = "<break_continue_statement_with_label> ::= { BREAK | LEAVE | CONTINUE | ITERATE } <label_name>"

[[definition]]
id = "doc.procedural-language::break_statement_with_label"
source = "doc.procedural-language"
name = "break_statement_with_label"
grammar = "<break_statement_with_label> ::= { BREAK | LEAVE } <label_name>"

[[definition]]
id = "doc.procedural-language::identifier"
source = "doc.procedural-language"
name = "identifier"
grammar = "<identifier> ::= { <variable> | <value> } [ AS <alias> ]"

[[definition]]
id = "doc.procedural-language::loop_statement_list"
source = "doc.procedural-language"
name = "loop_statement_list"
grammar = "<loop_statement_list> ::= { <statement> | <break_continue_statement_with_label> } [ , ... ]"

[[definition]]
id = "doc.procedural-language::sql_expression"
source = "doc.procedural-language"
name = "sql_expression"
grammar = "<sql_expression> ::= { \"query_statement\" | <expression> ( \"query_statement\" ) }"
