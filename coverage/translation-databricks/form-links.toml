# How a recorded Databricks statement's constructs link to catalogue forms in coverage/syntax-databricks,
# for the result-matching measure. Function calls link by name to the function forms whose grammar calls
# that name, in the same shape. This file links everything else. A [[link]] applies when the statement
# uses every one of its constructs. A [[no_form]] construct is part of other forms' grammar and names no
# form itself. Every construct a recorded statement uses must be accounted for here or by a function
# name, or the checker fails. The parser reads `=` and `==`, and `NOT` and `!`, as one construct, so
# each links to both forms. A reviewer reads this file in full before a figure is published.

# The query shell every case runs in: a WITH of a VALUES list, selected and ordered.
[[link]]
constructs = ["clause:with"]
forms = ["db.query.select-cte"]

[[link]]
constructs = ["node:values"]
forms = ["db.query.select-values.values"]

[[link]]
constructs = ["node:select"]
forms = ["db.query.select"]

[[link]]
constructs = ["node:star"]
forms = ["db.query.select"]

[[link]]
constructs = ["node:table"]
forms = ["db.query.select-table-reference"]

[[link]]
constructs = ["clause:order_by"]
forms = ["db.query.select-orderby"]

[[link]]
constructs = ["clause:group_by"]
forms = ["db.query.select-groupby.group-by"]

[[link]]
constructs = ["fn:ROLLUP"]
forms = ["db.query.select-groupby.group-by-rollup-cube"]

[[link]]
constructs = ["clause:union_all"]
forms = ["db.query.select-setops"]

[[link]]
constructs = ["node:union"]
forms = ["db.query.select-setops"]

