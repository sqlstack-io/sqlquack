# Literals.
[[link]]
constructs = ["node:interval"]
forms = ["db.expressions.interval-type.interval", "db.expressions.interval-type.interval.literals"]

[[no_form]]
constructs = ["node:column", "node:alias", "node:null", "node:boolean", "node:paren", "node:literal", "spelling:number", "spelling:quoted_string", "spelling:datetime_literal"]
reason = "Column references, aliases, NULL, TRUE and FALSE, parentheses and literals in a case's input rows are part of every form's grammar rather than forms of their own."

[[no_form]]
constructs = ["node:within_group", "node:trim"]
reason = "WITHIN GROUP belongs to the aggregate that takes it, and TRIM's keyword forms link by name."
