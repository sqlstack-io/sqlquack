[[override]]
source = "doc.lang-datefunc"
text = "date(time-value, modifier, modifier, ...)"
grammar = ["DATE ( [ <time-value> [ , <modifier> ... ] ] )"]
reason = "the page writes modifier twice before the ellipsis, but its prose says the time-value 'can be followed by zero or more modifiers' and that a missing time-value means 'now'"

[[override]]
