[[diagram]]
name = "expr"
svg_sha256 = "519d7bf9fbed0e47397bb70ba2c1b8425c131a7099afa07bd8fc0d843dfc6bd6"
grammar = [
  "<literal-value>",
  "<bind-parameter>",
  "[ [ <schema-name> . ] <table-name> . ] <column-name>",
  "<unary-operator> <expr>",
  "<expr> <binary-operator> <expr>",
  "<function-name> ( <function-arguments> ) [ <filter-clause> ] [ <over-clause> ]",
  "( <expr> [ , <expr> ... ] )",
  "CAST ( <expr> AS <type-name> )",
  "<expr> COLLATE <collation-name>",
  "<expr> [ NOT ] { LIKE <expr> [ ESCAPE <expr> ] | { GLOB | REGEXP | MATCH } <expr> }",
  "<expr> { ISNULL | NOTNULL | NOT NULL }",
  "<expr> IS [ NOT ] [ DISTINCT FROM ] <expr>",
  "<expr> [ NOT ] BETWEEN <expr> AND <expr>",
  "<expr> [ NOT ] IN { ( [ { <select-stmt> | <expr> [ , <expr> ... ] } ] ) | [ <schema-name> . ] { <table-name> | <table-function> ( [ <expr> [ , <expr> ... ] ] ) } }",
  "[ [ NOT ] EXISTS ] ( <select-stmt> )",
  "CASE [ <expr> ] WHEN <expr> THEN <expr> [ WHEN <expr> THEN <expr> ... ] [ ELSE <expr> ] END",
  "<raise-function>",
]
labels = ["literal", "bind-parameter", "column", "unary", "binary", "function", "parenthesized", "cast", "collate", "like", "null-test", "is", "between", "in", "exists", "case", "raise"]
note = "one form per branch of the diagram"

