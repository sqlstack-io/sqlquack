[[form]]
source = "doc.lang-createtrigger"
family = "ddl"
anchor = "TEMP Triggers on Non-TEMP Tables"
kind = "statement"
label = "temp-on-qualified-table"
grammar = [
  "CREATE { TEMP | TEMPORARY } TRIGGER [ IF NOT EXISTS ] <trigger-name> [ { BEFORE | AFTER | INSTEAD OF } ] { DELETE | INSERT | UPDATE [ OF <column-name> [ , <column-name> ... ] ] } ON <schema-name> . <table-name> [ FOR EACH ROW ] [ WHEN <expr> ] BEGIN { <update-stmt> | <insert-stmt> | <delete-stmt> | <select-stmt> } ; [ { <update-stmt> | <insert-stmt> | <delete-stmt> | <select-stmt> } ; ... ] END",
]
basis = "prose"
page_sha256 = "de6586fb15092651a64c8fa2c04b23253f080c9a19820d4bb172b7e71d5dbec3"

[[page]]
source = "doc.syntax.delete-stmt-limited"
status = "out_of_scope"
reason = "not the pinned build: lang_delete.html documents ORDER BY and LIMIT on DELETE only 'If SQLite is compiled with the SQLITE_ENABLE_UPDATE_DELETE_LIMIT compile-time option'; parse.y has the rule only under %if SQLITE_ENABLE_UPDATE_DELETE_LIMIT || SQLITE_UDL_CAPABLE_PARSER, and the pinned engine, built from the release amalgamation without either, refuses DELETE FROM t1 LIMIT 1 while parsing (near \"LIMIT\": syntax error). DELETE without them is the delete-stmt diagram, catalogued"
page_sha256 = "efd26d433f64d185392b22c1b299585673d441eb4c3385c7388f66a1d02af20d"

[[page]]
source = "doc.syntax.update-stmt-limited"
status = "out_of_scope"
reason = "not the pinned build: lang_update.html documents ORDER BY and LIMIT on UPDATE only 'If SQLite is built with the SQLITE_ENABLE_UPDATE_DELETE_LIMIT compile-time option'; parse.y has the rule only under %if SQLITE_ENABLE_UPDATE_DELETE_LIMIT || SQLITE_UDL_CAPABLE_PARSER, and the pinned engine, built from the release amalgamation without either, refuses UPDATE t1 SET a = 1 LIMIT 1 while parsing (near \"LIMIT\": syntax error). UPDATE without them is the update-stmt diagram, catalogued"
page_sha256 = "b0eba3862b2bbd7dda577b5e73750594827fadb3b949d8720d0a5cc9a4d86273"

