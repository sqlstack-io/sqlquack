# Reviewed inputs of the SQLite 3.54.1 catalogue; read by scripts/build_syntax_catalogue_sqlite.py.
#
# [[diagram]] reads one syntax diagram of the documentation archive (its syntax/<name>.html page,
#   shown again on the lang_*.html pages) into the catalogue notation, bound to the SHA-256 of its
#   SVG: <name> is a box, [ ] an optional part, { a | b } a choice and `x ...` a repetition.
#   Each grammar line becomes one form; labels name them. The italic grey labels of a diagram
#   are annotations, not syntax.
# [[form]] is a form catalogued by hand from a page whose syntax is in a table, list or prose,
#   bound to the page's SHA-256.
# [[override]] reads a documented signature or PRAGMA by hand where the page's notation is not a
#   plain call or PRAGMA line; `text` is the signature as the page writes it, or the PRAGMA name.
# [[page]] is the reviewed status of an in-set page with no diagram, signature or hand form.

[[form]]
source = "doc.lang-expr"
family = "expressions"
anchor = "Operators, and Parse-Affecting Attributes"
kind = "special"
label = "unary-operators"
grammar = ["~ <expr>", "+ <expr>", "- <expr>", "NOT <expr>"]
basis = "table"
page_sha256 = "77859a49a5cbdbf78165bded31c436c591d9846a9a7da5e36d52423e36107d57"

