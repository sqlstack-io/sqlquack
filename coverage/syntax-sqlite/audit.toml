# Reviewed omission audit of the SQLite catalogue against the pinned parse.y, the keyword table of
# mkkeywordhash.c and the pinned engine; checked by scripts/audit_syntax_catalogue_sqlite.py, which
# fails on any unreviewed or stale row.
#
# [[gap]]: a parse.y rule's keyword sequences no catalogued form spells, with the reason.
# [[keyword]]: a keyword of the table that no catalogued grammar names, that no walked production
#   uses, or that the pinned engine does not report.
# [[function]], [[pragma]], [[type]]: an engine function, PRAGMA, STRICT type or collation that no
#   catalogued grammar names. [[unwalked]]: a rule the walk does not reach.
# [[unseen]]: syntax of a walked rule that no gap row can report, because it spells no keyword the
#   walk compares or because a longer documented form contains its keywords; kept uncatalogued with
#   its reason. The audit fails when a rule of UNSEEN_RULES (constants.py) has no row, when a row
#   names a rule not in that list, or when a listed rule is no longer walked.

parse_y_sha256 = "ba52f3a1a8c7500d35fe71b46730ae13f3e5dc3701ae23d854ffbfefae7a449a"
mkkeywordhash_sha256 = "099f834d82274c1c4dd1a31fb7f2ad59cf1e71db30f5fd87772d2dfc70c35cae"
engine_extract_sha256 = "efcd8a6b2ccd3529a031e7ee6d042ffa233d712470c3c7360906f7a4322b85a1"

limits = [
    "Grammar: parse.y is read as the amalgamation's parser was generated: comments and C code removed, every %ifdef, %ifndef and %if evaluated with no macro defined (SQLITE_ENABLE_UPDATE_DELETE_LIMIT, SQLITE_UDL_CAPABLE_PARSER and SQLITE_ENABLE_ORDERED_SET_AGGREGATES off, no SQLITE_OMIT_* on). The audit fails unless the productions it reads number YYNRULE of the amalgamation's generated parser (412).",
    "Walk: every rule reachable from `input` is walked and every production of it checked; a rule not reached is an [[unwalked]] row.",
    "Spelling: a production is checked as its keyword terminals in order, each terminal standing for the keywords mkkeywordhash.c scans as that token (LIKE_KW for GLOB, LIKE and REGEXP; JOIN_KW for the join words; CTIME_KW for the CURRENT_ words; COLUMNKW for COLUMN; TEMP for TEMP and TEMPORARY). The punctuation terminals LP, RP, COMMA, DOT, EQ, PLUS and MINUS spell ( ) , . = + -; other terminals and the token classes id, ids, idj and number stand for identifiers and literals and spell nothing. A referenced rule contributes its words when every production of it spells only keywords, in at most 60 ways; a recursive or larger rule (expr, select, the lists) contributes `…`, any run, to its parent and is checked as its own productions.",
    "Containment: a sequence is covered only when one catalogued grammar line reads it as a contiguous run: each line is an automaton over its keywords and the punctuation above, with the syntax diagrams it names inlined as optional parts (all but expr, the select diagrams and sql-stmt), placeholders, identifiers, literals and quoted text spelling nothing, and `…` reading any run of the line. A sequence of `cmd` must be read from the line's start. A longer documented form whose keywords are not adjacent no longer covers a sequence.",
    "Every production that spells at least one keyword is checked, below `cmd` as well; the [[keyword]] check also covers single words.",
    "Derived gaps: a gap that contains, as a contiguous run, a gap of a rule it reaches is counted (gaps_derived) but not reviewed; its reviewed root gives the reason.",
    "Keywords: the 148 rows of mkkeywordhash.c's aKeywordTable, compared with the 147 words sqlite3_keyword_name() reports in the pinned engine; a word counts as catalogued when some grammar spells it outside placeholders and quotes.",
    "Engine names: functions, PRAGMAs and collations are those pragma_function_list, pragma_pragma_list and pragma_collation_list report in a fresh in-memory database of the pinned engine (built with SQLITE_ENABLE_MATH_FUNCTIONS and SQLITE_ENABLE_PERCENTILE), and the STRICT types those of the amalgamation's sqlite3StdType[]; a name counts as catalogued when some grammar spells it as a word or operator.",
    "Expansion: a production spelling more than 4096 keyword sequences stops the audit with an error instead of being truncated; none does at the pinned grammar.",
]

[[gap]]
rule = "cmd"
sequences = [
    "PRAGMA ( DEFAULT )",
    "PRAGMA ( DELETE )",
    "PRAGMA ( ON )",
    "PRAGMA . ( DEFAULT )",
    "PRAGMA . ( DELETE )",
    "PRAGMA . ( ON )",
    "PRAGMA . = DEFAULT",
    "PRAGMA . = ON",
    "PRAGMA = ON",
]
reason = "pragma.html writes boolean pragma values as the placeholder <boolean> and its prose lists 1, yes, true and on (0, no, false, off); parse.y's nmnum takes ON, DELETE and DEFAULT as keywords so that PRAGMA x = ON, journal_mode = DELETE and temp_store = DEFAULT parse. The values are documented, as words of the placeholder, not as grammar; the schema-qualified and parenthesised spellings are the pragma-stmt diagram's [ schema-name . ] and ( pragma-value ) with the same values (PRAGMA main.foreign_keys = ON, PRAGMA temp_store(DEFAULT) and PRAGMA main.journal_mode(DELETE) run on the pinned engine)"

[[gap]]
rule = "expr"
sequences = [
    "… GLOB … ESCAPE …",
    "… MATCH … ESCAPE …",
    "… NOT GLOB … ESCAPE …",
    "… NOT MATCH … ESCAPE …",
    "… NOT REGEXP … ESCAPE …",
    "… REGEXP … ESCAPE …",
]
reason = "undocumented: lang_expr.html's expr diagram allows ESCAPE only after LIKE, and its operator table says the ESCAPE clause 'can only bind to a preceding [expr] LIKE [expr] expression'; parse.y's likeop production takes ESCAPE after any LIKE_KW or MATCH and passes it as a third argument, which the pinned engine refuses when preparing (wrong number of arguments to function GLOB(); MATCH likewise; REGEXP has no built-in function)"

[[gap]]
rule = "refarg"
sequences = [
    "ON INSERT CASCADE",
    "ON INSERT NO ACTION",
    "ON INSERT RESTRICT",
    "ON INSERT SET DEFAULT",
    "ON INSERT SET NULL",
]
reason = "undocumented: the foreign-key-clause diagram offers ON DELETE and ON UPDATE only; parse.y keeps `refarg ::= ON INSERT refact` and ignores it (its action sets no flag), so REFERENCES ... ON INSERT SET NULL is accepted and does nothing."

[[gap]]
rule = "ccons"
sequences = [
    "DEFAULT + CURRENT_DATE",
    "DEFAULT + CURRENT_TIME",
    "DEFAULT + CURRENT_TIMESTAMP",
    "DEFAULT + NULL",
    "DEFAULT - CURRENT_DATE",
    "DEFAULT - CURRENT_TIME",
    "DEFAULT - CURRENT_TIMESTAMP",
    "DEFAULT - NULL",
]
reason = "undocumented: the column-constraint diagram signs only a signed-number (DEFAULT { ( expr ) | literal-value | signed-number }); parse.y's ccons takes DEFAULT PLUS or MINUS before any term, so a sign before NULL or a CURRENT_ word parses and the pinned engine creates the table (CREATE TABLE x(a DEFAULT -NULL) and CREATE TABLE x(a DEFAULT +CURRENT_DATE) run)"

[[gap]]
rule = "expr"
sequences = [
    "( ALL … )",
    "( ALL … ) …",
    "( ALL … ORDER BY … )",
    "( ALL … ORDER BY … ) …",
]
reason = "undocumented: lang_aggfunc.html's aggregate-function-invocation diagram allows DISTINCT before the arguments but not ALL; parse.y's function call takes `distinct`, which is DISTINCT, ALL or nothing, so count(ALL a) and group_concat(ALL a ORDER BY a) parse and run on the pinned engine, ALL meaning the default"

