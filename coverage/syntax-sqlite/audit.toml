    "TEMP TRIGGER . AFTER … ON . …",
    "TEMP TRIGGER . BEFORE … ON . FOR EACH ROW …",
    "TEMP TRIGGER . BEFORE … ON . …",
    "TEMP TRIGGER . INSTEAD OF … ON . FOR EACH ROW …",
    "TEMP TRIGGER . INSTEAD OF … ON . …",
    "TEMP TRIGGER . … ON . FOR EACH ROW …",
    "TEMP TRIGGER . … ON . …",
    "TEMP TRIGGER IF NOT EXISTS . AFTER … ON . FOR EACH ROW …",
    "TEMP TRIGGER IF NOT EXISTS . AFTER … ON . …",
    "TEMP TRIGGER IF NOT EXISTS . BEFORE … ON . FOR EACH ROW …",
    "TEMP TRIGGER IF NOT EXISTS . BEFORE … ON . …",
    "TEMP TRIGGER IF NOT EXISTS . INSTEAD OF … ON . FOR EACH ROW …",
    "TEMP TRIGGER IF NOT EXISTS . INSTEAD OF … ON . …",
    "TEMP TRIGGER IF NOT EXISTS . … ON . FOR EACH ROW …",
    "TEMP TRIGGER IF NOT EXISTS . … ON . …",
    "TEMPORARY TRIGGER . AFTER … ON . FOR EACH ROW …",
    "TEMPORARY TRIGGER . AFTER … ON . …",
    "TEMPORARY TRIGGER . BEFORE … ON . FOR EACH ROW …",
    "TEMPORARY TRIGGER . BEFORE … ON . …",
    "TEMPORARY TRIGGER . INSTEAD OF … ON . FOR EACH ROW …",
    "TEMPORARY TRIGGER . INSTEAD OF … ON . …",
    "TEMPORARY TRIGGER . … ON . FOR EACH ROW …",
    "TEMPORARY TRIGGER . … ON . …",
    "TEMPORARY TRIGGER IF NOT EXISTS . AFTER … ON . FOR EACH ROW …",
    "TEMPORARY TRIGGER IF NOT EXISTS . AFTER … ON . …",
    "TEMPORARY TRIGGER IF NOT EXISTS . BEFORE … ON . FOR EACH ROW …",
    "TEMPORARY TRIGGER IF NOT EXISTS . BEFORE … ON . …",
    "TEMPORARY TRIGGER IF NOT EXISTS . INSTEAD OF … ON . FOR EACH ROW …",
    "TEMPORARY TRIGGER IF NOT EXISTS . INSTEAD OF … ON . …",
    "TEMPORARY TRIGGER IF NOT EXISTS . … ON . FOR EACH ROW …",
    "TEMPORARY TRIGGER IF NOT EXISTS . … ON . …",
]
reason = "refused: the create-trigger diagram qualifies the trigger name but not the table after ON, and the TEMP-trigger section qualifies the table of a TEMP trigger whose name is unqualified (catalogued as its own hand form); a TEMP trigger with a schema-qualified name parses in parse.y's trigger_decl but the pinned engine refuses it while preparing (temporary trigger may not have qualified name)"

[[gap]]
rule = "trigger_decl"
sequences = [
    "TRIGGER . AFTER … ON . FOR EACH ROW …",
    "TRIGGER . AFTER … ON . …",
    "TRIGGER . BEFORE … ON . FOR EACH ROW …",
    "TRIGGER . BEFORE … ON . …",
    "TRIGGER . INSTEAD OF … ON . FOR EACH ROW …",
    "TRIGGER . INSTEAD OF … ON . …",
    "TRIGGER . … ON . FOR EACH ROW …",
    "TRIGGER . … ON . …",
    "TRIGGER IF NOT EXISTS . AFTER … ON . FOR EACH ROW …",
    "TRIGGER IF NOT EXISTS . AFTER … ON . …",
    "TRIGGER IF NOT EXISTS . BEFORE … ON . FOR EACH ROW …",
    "TRIGGER IF NOT EXISTS . BEFORE … ON . …",
    "TRIGGER IF NOT EXISTS . INSTEAD OF … ON . FOR EACH ROW …",
    "TRIGGER IF NOT EXISTS . INSTEAD OF … ON . …",
    "TRIGGER IF NOT EXISTS . … ON . FOR EACH ROW …",
    "TRIGGER IF NOT EXISTS . … ON . …",
]
reason = "undocumented: the create-trigger diagram names the table after ON unqualified, and lang_createtrigger.html documents a qualified table only for a TEMP trigger with an unqualified name ('TEMP Triggers on Non-TEMP Tables'); parse.y's trigger_decl takes a fullname after ON for every trigger, and the pinned engine accepts a qualified non-TEMP trigger on a table of the same schema (CREATE TRIGGER main.tr AFTER INSERT ON main.t ... runs) and refuses one on another schema while preparing (trigger tr cannot reference objects in database temp)"

[[keyword]]
keyword = "WITHIN"
reason = "the table's WITHIN row has mask ORDERSET, compiled only with SQLITE_ENABLE_ORDERED_SET_AGGREGATES: the pinned engine does not report it, no production of the pinned grammar uses it (WITHIN GROUP is inside %ifdef SQLITE_ENABLE_ORDERED_SET_AGGREGATES), and percentile.html writes `percentile_cont(P) WITHIN GROUP (ORDER BY Y)` only for builds with that option, which changes parse.y and so cannot be enabled in the release amalgamation: out of scope, as the README states"

[[function]]
name = "sqlite_log"
reason = "undocumented in the page set: the SQL wrapper of the sqlite3_log() C interface (c3ref/log.html, excluded with the C interface reference); lang_corefunc.html does not list it"

[[function]]
name = "subtype"
reason = "undocumented in the page set: a built-in that reports a value's subtype, used to test the sqlite3_value_subtype() C interface (c3ref/value_subtype.html, excluded with the C interface reference); lang_corefunc.html does not list it"

[[unseen]]
rule = "ccons"
syntax = "NULL [ <conflict-clause> ] as a column constraint; DEFAULT <identifier>"
reason = "undocumented: the column-constraint diagram has NOT NULL but no bare NULL, and DEFAULT takes a parenthesised expression, a literal or a signed number; parse.y's ccons accepts NULL onconf (CREATE TABLE t(x NULL) parses and the constraint does nothing) and DEFAULT followed by an identifier (an id, kept as the text of a string default). The walk cannot report them: NULL ON CONFLICT is contained in the documented NOT NULL ON CONFLICT, and DEFAULT <identifier> spells only DEFAULT"

[[unseen]]
rule = "key_opt"
syntax = "ATTACH [ DATABASE ] <expr> AS <schema-name> KEY <expr>"
reason = "undocumented: the attach-stmt diagram ends at the schema name; parse.y's key_opt takes KEY <expr>, the encryption key of builds that support one, which the pinned build accepts and ignores. KEY is a catalogued word (PRIMARY KEY, FOREIGN KEY) and key_opt spells one keyword, so the walk cannot report it"

[[unseen]]
rule = "trans_opt"
syntax = "{ BEGIN | COMMIT | END | ROLLBACK } [ <kind> ] TRANSACTION <name>"
reason = "undocumented: the begin-stmt, commit-stmt and rollback-stmt diagrams end at TRANSACTION; parse.y's trans_opt also takes a name after it, which the pinned engine accepts and ignores (BEGIN TRANSACTION foo parses). The name is an identifier, which the walk does not compare"

[[unseen]]
rule = "cmd"
syntax = "ATTACH [ DATABASE ] <expr> AS <expr>; DETACH [ DATABASE ] <expr>"
reason = "undocumented: the attach-stmt and detach-stmt diagrams name the schema with <schema-name>; parse.y's cmd ::= ATTACH database_kw_opt expr AS expr key_opt and cmd ::= DETACH database_kw_opt expr (parse.y:1861, :1864) take any expression, which the pinned engine evaluates for the name (ATTACH ':memory:' AS 'a' || 'b' runs; DETACH 'a' || 'b' parses and fails at step with 'no such database: ab'). A name is an expression, which the walk does not compare"

[[unseen]]
rule = "exprlist"
syntax = "<table-function-name> ( ) in a FROM clause"
reason = "undocumented: the table-or-subquery diagram writes a table-valued function with at least one <expr>; parse.y's seltablist ::= stl_prefix nm dbnm LP exprlist RP as on_using takes exprlist ::= . (parse.y:769), so SELECT * FROM json_each() parses and runs. The empty list adds no keyword, so the walk cannot report it"

[[unseen]]
rule = "nm"
syntax = "an unquoted fallback keyword as a name"
reason = "undocumented as accepted: lang_keywords.html:136 says a keyword used as a name must be quoted, but parse.y's %fallback ID makes the non-reserved keywords fall back to ID, so CREATE TABLE abort ( c1 ) and SELECT 1 AS offset parse. The walk compares keyword sequences, not which words a name may be"

[[unseen]]
rule = "seltablist"
syntax = "( <table-or-subquery> ) AS <table-alias>"
reason = "undocumented: the table-or-subquery diagram gives a parenthesised join-clause or table-or-subquery list no alias; parse.y's seltablist ::= stl_prefix LP seltablist RP as on_using (parse.y:777) takes one, so SELECT * FROM ( t1 ) AS x parses and runs. AS is a catalogued word next to a parenthesis, so the walk cannot report it"

[[unseen]]
rule = "tcons"
syntax = "CHECK ( <expr> ) <conflict-clause> as a table constraint"
reason = "undocumented as accepted: the table-constraint diagram has no conflict clause after CHECK and lang_conflict.html:210 says ON CONFLICT is not allowed on CHECK, but parse.y's tcons ::= CHECK LP expr RP onconf (parse.y:472) parses one and ignores it, so CREATE TABLE t3 ( c1 , CHECK ( c1 < 9 ) ON CONFLICT FAIL ) runs. ON CONFLICT follows other table constraints, so the walk cannot report it"

[[unseen]]
rule = "tconscomma"
syntax = "<table-constraint> <table-constraint> with no comma between them"
reason = "undocumented: the create-table diagram separates table constraints with commas; parse.y's tconscomma ::= . (parse.y:465) lets the comma be left out, so CREATE TABLE t3 ( c1 , c2 , PRIMARY KEY ( c1 ) UNIQUE ( c2 ) ) parses and runs. Leaving a token out adds no keyword, so the walk cannot report it"

[[unseen]]
rule = "typetoken"
syntax = "CAST ( <expr> AS )"
reason = "undocumented: the expr diagram writes CAST ( <expr> AS <type-name> ); parse.y's expr ::= CAST LP expr AS typetoken RP with typetoken ::= . (parse.y:1234) takes an empty type, so SELECT CAST ( 1 AS ) parses and runs. Leaving a name out adds no keyword, so the walk cannot report it"
