[[reading]]
form = "sl.ddl.create-trigger-stmt"
grammar_sha256 = "4469fcb1430121f87bdbd4c84118ff5a585c4d266bdbbe4ef524151c943a8b91"
grammar = ["CREATE { TRIGGER [ IF NOT EXISTS ] [ <schema-name> . ] <trigger-name> | { TEMP | TEMPORARY } TRIGGER [ IF NOT EXISTS ] <trigger-name> } [ { BEFORE | AFTER | INSTEAD OF } ] { DELETE | INSERT | UPDATE [ OF <column-name> [ , <column-name> ... ] ] } ON <table-name> [ FOR EACH ROW ] [ WHEN <expr> ] BEGIN { <update-stmt> | <insert-stmt> | <delete-stmt> | <select-stmt> } ; [ { <update-stmt> | <insert-stmt> | <delete-stmt> | <select-stmt> } ; ... ] END"]
reason = "an observed limit: the diagram allows TEMP with a schema-qualified trigger name, but trigger.c's sqlite3BeginTrigger, which parse.y's trigger_decl action calls, refuses any qualified name on a TEMP trigger from the statement text alone (temporary trigger may not have qualified name), temp . <name> included; so the statement is read as two branches, one with the optional qualified name and no TEMP, and one with TEMP or TEMPORARY and a plain name, and TEMP with a qualified name is a hand negative"

[[reading]]
form = "sl.ddl.foreign-key-clause"
grammar_sha256 = "80c3aa92389ccfc497b642a8fca7336b81c60277856affc2500afcafc73e4c52"
grammar = ["REFERENCES <foreign-table> [ ( <column-name> ) ] [ { ON { DELETE | UPDATE } { SET NULL | SET DEFAULT | CASCADE | RESTRICT | NO ACTION } | MATCH <name> } ... ] [ [ NOT ] DEFERRABLE [ { INITIALLY DEFERRED | INITIALLY IMMEDIATE } ] ]"]
reason = "the catalogue derives this clause in a column constraint (CREATE TABLE t3 ( c1 REFERENCES ... )), where build.c's sqlite3CreateForeignKey, which parse.y's constraint action calls, refuses a referenced list of more than one column from the statement text alone (foreign key on <column> should reference only one column of table <table>); in a table constraint the referenced list must have as many columns as the constraint's own list (number of columns in foreign key does not match the number of columns in the referenced table). So the clause is derived with one referenced column, the continued list is a hand positive in a table constraint, and both refusals are hand negatives"

[[limit]]
