# Hand-written readings, suppressions and limits of the SQLite catalogue's obligations; read by
# scripts/build_syntax_obligations_sqlite.py through the shared obligation builder.
#
# [[reading]] replaces a form's grammar for derivation only, bound to the catalogue grammar's
# sha256; an empty grammar means the form's obligations are all hand-written [[limit]] rows.
# [[suppress]] withdraws one derived obligation (form, kind, target) with the reason it is not
# the negative or positive it looks like. [[limit]] is a hand-written obligation with its SQL.
# parse.y and tokenize.c are those of the pinned release (sources.toml).

[[reading]]
form = "sl.expressions.comment-syntax.block"
grammar_sha256 = "3bab755e7660b7f191a5ed754255294ee2740825330045759c4879ffeb76378f"
grammar = []
reason = "a comment is lexical: tokenize.c (sqlite3GetToken, TK_COMMENT) drops it before the parser sees a token, and the diagram's bubbles are characters, not tokens, so its obligations are hand-written SQL"

