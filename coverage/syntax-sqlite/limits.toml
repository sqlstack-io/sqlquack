[[reading]]
form = "sl.dml.upsert-clause"
grammar_sha256 = "dc5e5c97fb0ace933670841bbba352eb2eab4982e97e035e269a7a6c98c31694"
grammar = ["[ { ON CONFLICT ( <indexed-column> [ , <indexed-column> ... ] ) [ WHERE <expr> ] DO { NOTHING | UPDATE SET { <column-name> | <column-name-list> } = <expr> [ , { <column-name> | <column-name-list> } = <expr> ... ] [ WHERE <expr> ] } } ... ] ON CONFLICT [ ( <indexed-column> [ , <indexed-column> ... ] ) [ WHERE <expr> ] ] DO { NOTHING | UPDATE SET { <column-name> | <column-name-list> } = <expr> [ , { <column-name> | <column-name-list> } = <expr> ... ] [ WHERE <expr> ] }"]
reason = "lang_upsert.html: only the last ON CONFLICT clause may omit the conflict target; parse.y (upsert ::= ON CONFLICT LP sortlist RP where_opt DO ... upsert, and the untargeted ON CONFLICT DO ... ends the list) takes targeted clauses in a list and an untargeted one only at its end, and the pinned engine refuses a clause after an untargeted one (near \"ON\": syntax error), so the loop is read as targeted clauses followed by one clause whose target is optional"

[[reading]]
form = "sl.query.select.join-keywords-any-order"
grammar_sha256 = "a0a113b478cf929d89d32a21c0dd8e1c884f69ce262e775e0e0c8238c9b29f69"
grammar = []
reason = "lang_select.html 9.1 writes the join operator as 1 to 3 of the seven words in any order, then JOIN, and says some combinations are disallowed (INNER OUTER JOIN); parse.y (joinop ::= JOIN_KW JOIN | JOIN_KW nm JOIN | JOIN_KW nm nm JOIN) reads the words as one token class and sqlite3JoinType refuses the contradictory ones, so deriving every combination would expect refused texts to parse: the obligations are hand-written [[limit]] rows checked on the pinned engine"

