[[definition]]
id = "doc.sql-select::frame_clause"
source = "doc.sql-select"
name = "frame_clause"
grammar = "<frame_clause> ::= { { RANGE | ROWS | GROUPS } <frame_start> [ <frame_exclusion> ] | { RANGE | ROWS | GROUPS } BETWEEN <frame_start> AND <frame_end> [ <frame_exclusion> ] }"

[[definition]]
id = "doc.sql-select::frame_end"
source = "doc.sql-select"
name = "frame_end"
grammar = "<frame_end> ::= { UNBOUNDED PRECEDING | <offset> PRECEDING | CURRENT ROW | <offset> FOLLOWING | UNBOUNDED FOLLOWING }"

[[definition]]
id = "doc.sql-select::frame_exclusion"
source = "doc.sql-select"
name = "frame_exclusion"
grammar = "<frame_exclusion> ::= { EXCLUDE CURRENT ROW | EXCLUDE GROUP | EXCLUDE TIES | EXCLUDE NO OTHERS }"

[[definition]]
id = "doc.sql-select::frame_start"
source = "doc.sql-select"
name = "frame_start"
grammar = "<frame_start> ::= { UNBOUNDED PRECEDING | <offset> PRECEDING | CURRENT ROW | <offset> FOLLOWING | UNBOUNDED FOLLOWING }"

[[definition]]
id = "doc.sql-select::from_item"
source = "doc.sql-select"
name = "from_item"
grammar = "<from_item> ::= { [ ONLY ] <table_name> [ * ] [ [ AS ] <alias> [ ( <column_alias> [, ...] ) ] ] [ TABLESAMPLE <sampling_method> ( <argument> [, ...] ) [ REPEATABLE ( <seed> ) ] ] | [ LATERAL ] ( <select> ) [ [ AS ] <alias> [ ( <column_alias> [, ...] ) ] ] | <with_query_name> [ [ AS ] <alias> [ ( <column_alias> [, ...] ) ] ] | [ LATERAL ] <function_name> ( [ <argument> [, ...] ] ) [ WITH ORDINALITY ] [ [ AS ] <alias> [ ( <column_alias> [, ...] ) ] ] | [ LATERAL ] <function_name> ( [ <argument> [, ...] ] ) [ AS ] <alias> ( <column_definition> [, ...] ) | [ LATERAL ] <function_name> ( [ <argument> [, ...] ] ) AS ( <column_definition> [, ...] ) | [ LATERAL ] ROWS FROM( <function_name> ( [ <argument> [, ...] ] ) [ AS ( <column_definition> [, ...] ) ] [, ...] ) [ WITH ORDINALITY ] [ [ AS ] <alias> [ ( <column_alias> [, ...] ) ] ] | <from_item> <join_type> <from_item> { ON <join_condition> | USING ( <join_column> [, ...] ) [ AS <join_using_alias> ] } | <from_item> NATURAL <join_type> <from_item> | <from_item> CROSS JOIN <from_item> }"

[[definition]]
id = "doc.sql-select::grouping_element"
source = "doc.sql-select"
name = "grouping_element"
grammar = "<grouping_element> ::= { ( ) | <expression> | ( <expression> [, ...] ) | ROLLUP ( { <expression> | ( <expression> [, ...] ) } [, ...] ) | CUBE ( { <expression> | ( <expression> [, ...] ) } [, ...] ) | GROUPING SETS ( <grouping_element> [, ...] ) }"

[[definition]]
id = "doc.sql-select::lock_strength"
source = "doc.sql-select"
name = "lock_strength"
grammar = "<lock_strength> ::= { UPDATE | NO KEY UPDATE | SHARE | KEY SHARE }"

[[definition]]
id = "doc.sql-select::window_definition"
source = "doc.sql-select"
name = "window_definition"
grammar = "<window_definition> ::= [ <existing_window_name> ] [ PARTITION BY <expression> [, ...] ] [ ORDER BY <expression> [ ASC | DESC | USING <operator> ] [ NULLS { FIRST | LAST } ] [, ...] ] [ <frame_clause> ]"

[[definition]]
id = "doc.sql-select::with_query"
source = "doc.sql-select"
name = "with_query"
grammar = "<with_query> ::= <with_query_name> [ ( <column_name> [, ...] ) ] AS [ [ NOT ] MATERIALIZED ] ( <select> | <values> | <insert> | <update> | <delete> | <merge> ) [ SEARCH { BREADTH | DEPTH } FIRST BY <column_name> [, ...] SET <search_seq_col_name> ] [ CYCLE <column_name> [, ...] SET <cycle_mark_col_name> [ TO <cycle_mark_value> DEFAULT <cycle_mark_default> ] USING <cycle_path_col_name> ]"
