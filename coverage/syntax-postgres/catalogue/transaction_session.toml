[[definition]]
id = "doc.sql-begin::transaction_mode"
source = "doc.sql-begin"
name = "transaction_mode"
grammar = "<transaction_mode> ::= { ISOLATION LEVEL { SERIALIZABLE | REPEATABLE READ | READ COMMITTED | READ UNCOMMITTED } | READ WRITE | READ ONLY | [ NOT ] DEFERRABLE }"

[[definition]]
id = "doc.sql-lock::lockmode"
source = "doc.sql-lock"
name = "lockmode"
grammar = "<lockmode> ::= { ACCESS SHARE | ROW SHARE | ROW EXCLUSIVE | SHARE UPDATE EXCLUSIVE | SHARE | SHARE ROW EXCLUSIVE | EXCLUSIVE | ACCESS EXCLUSIVE }"

