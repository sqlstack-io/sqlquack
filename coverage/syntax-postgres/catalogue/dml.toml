[[definition]]
id = "doc.sql-copy::option"
source = "doc.sql-copy"
name = "option"
grammar = "<option> ::= { FORMAT <format_name> | FREEZE [ <boolean> ] | DELIMITER '<delimiter_character>' | NULL '<null_string>' | DEFAULT '<default_string>' | HEADER [ <boolean> | MATCH ] | QUOTE '<quote_character>' | ESCAPE '<escape_character>' | FORCE_QUOTE { ( <column_name> [, ...] ) | * } | FORCE_NOT_NULL { ( <column_name> [, ...] ) | * } | FORCE_NULL { ( <column_name> [, ...] ) | * } | ON_ERROR <error_action> | REJECT_LIMIT <maxerror> | ENCODING '<encoding_name>' | LOG_VERBOSITY <verbosity> }"

[[definition]]
id = "doc.sql-insert::conflict_action"
source = "doc.sql-insert"
name = "conflict_action"
grammar = "<conflict_action> ::= { DO NOTHING | DO UPDATE SET { <column_name> = { <expression> | DEFAULT } | ( <column_name> [, ...] ) = [ ROW ] ( { <expression> | DEFAULT } [, ...] ) | ( <column_name> [, ...] ) = ( <sub-SELECT> ) } [, ...] [ WHERE <condition> ] }"

[[definition]]
id = "doc.sql-insert::conflict_target"
source = "doc.sql-insert"
name = "conflict_target"
grammar = "<conflict_target> ::= { ( { <index_column_name> | ( <index_expression> ) } [ COLLATE <collation> ] [ <opclass> ] [, ...] ) [ WHERE <index_predicate> ] | ON CONSTRAINT <constraint_name> }"

[[definition]]
id = "doc.sql-merge::data_source"
source = "doc.sql-merge"
name = "data_source"
grammar = "<data_source> ::= { [ ONLY ] <source_table_name> [ * ] | ( <source_query> ) } [ [ AS ] <source_alias> ]"

[[definition]]
id = "doc.sql-merge::merge_delete"
source = "doc.sql-merge"
name = "merge_delete"
grammar = "<merge_delete> ::= DELETE"

[[definition]]
id = "doc.sql-merge::merge_insert"
source = "doc.sql-merge"
name = "merge_insert"
grammar = "<merge_insert> ::= INSERT [( <column_name> [, ...] )] [ OVERRIDING { SYSTEM | USER } VALUE ] { VALUES ( { <expression> | DEFAULT } [, ...] ) | DEFAULT VALUES }"

[[definition]]
id = "doc.sql-merge::merge_update"
source = "doc.sql-merge"
name = "merge_update"
grammar = "<merge_update> ::= UPDATE SET { <column_name> = { <expression> | DEFAULT } | ( <column_name> [, ...] ) = [ ROW ] ( { <expression> | DEFAULT } [, ...] ) | ( <column_name> [, ...] ) = ( <sub-SELECT> ) } [, ...]"

[[definition]]
id = "doc.sql-merge::when_clause"
source = "doc.sql-merge"
name = "when_clause"
grammar = "<when_clause> ::= { WHEN MATCHED [ AND <condition> ] THEN { <merge_update> | <merge_delete> | DO NOTHING } | WHEN NOT MATCHED BY SOURCE [ AND <condition> ] THEN { <merge_update> | <merge_delete> | DO NOTHING } | WHEN NOT MATCHED [ BY TARGET ] [ AND <condition> ] THEN { <merge_insert> | DO NOTHING } }"
