[[definition]]
id = "doc.functions-json::json_table_column"
source = "doc.functions-json"
name = "json_table_column"
grammar = "<json_table_column> ::= <name> FOR ORDINALITY | <name> <type> [ FORMAT JSON [ ENCODING UTF8 ] ] [ PATH <path_expression> ] [ { WITHOUT | WITH { CONDITIONAL | [ UNCONDITIONAL ] } } [ ARRAY ] WRAPPER ] [ { KEEP | OMIT } QUOTES [ ON SCALAR STRING ] ] [ { ERROR | NULL | EMPTY { [ ARRAY ] | OBJECT } | DEFAULT <expression> } ON EMPTY ] [ { ERROR | NULL | EMPTY { [ ARRAY ] | OBJECT } | DEFAULT <expression> } ON ERROR ] | <name> <type> EXISTS [ PATH <path_expression> ] [ { ERROR | TRUE | FALSE | UNKNOWN } ON ERROR ] | NESTED [ PATH ] <path_expression> [ AS <json_path_name> ] COLUMNS ( <json_table_column> [ , ... ] )"
