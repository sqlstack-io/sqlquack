[[definition]]
id = "doc.sql-analyze::option"
source = "doc.sql-analyze"
name = "option"
grammar = "<option> ::= { VERBOSE [ <boolean> ] | SKIP_LOCKED [ <boolean> ] | BUFFER_USAGE_LIMIT <size> }"

[[definition]]
id = "doc.sql-analyze::table_and_columns"
source = "doc.sql-analyze"
name = "table_and_columns"
grammar = "<table_and_columns> ::= [ ONLY ] <table_name> [ * ] [ ( <column_name> [, ...] ) ]"

[[definition]]
id = "doc.sql-cluster::option"
source = "doc.sql-cluster"
name = "option"
grammar = "<option> ::= VERBOSE [ <boolean> ]"

[[definition]]
id = "doc.sql-explain::option"
source = "doc.sql-explain"
name = "option"
grammar = "<option> ::= { ANALYZE [ <boolean> ] | VERBOSE [ <boolean> ] | COSTS [ <boolean> ] | SETTINGS [ <boolean> ] | GENERIC_PLAN [ <boolean> ] | BUFFERS [ <boolean> ] | SERIALIZE [ { NONE | TEXT | BINARY } ] | WAL [ <boolean> ] | TIMING [ <boolean> ] | SUMMARY [ <boolean> ] | MEMORY [ <boolean> ] | FORMAT { TEXT | XML | JSON | YAML } }"

[[definition]]
id = "doc.sql-fetch::direction"
source = "doc.sql-fetch"
name = "direction"
grammar = "<direction> ::= { NEXT | PRIOR | FIRST | LAST | ABSOLUTE <count> | RELATIVE <count> | <count> | ALL | FORWARD | FORWARD <count> | FORWARD ALL | BACKWARD | BACKWARD <count> | BACKWARD ALL }"

[[definition]]
id = "doc.sql-move::direction"
source = "doc.sql-move"
name = "direction"
grammar = "<direction> ::= { NEXT | PRIOR | FIRST | LAST | ABSOLUTE <count> | RELATIVE <count> | <count> | ALL | FORWARD | FORWARD <count> | FORWARD ALL | BACKWARD | BACKWARD <count> | BACKWARD ALL }"

[[definition]]
id = "doc.sql-reindex::option"
source = "doc.sql-reindex"
name = "option"
grammar = "<option> ::= { CONCURRENTLY [ <boolean> ] | TABLESPACE <new_tablespace> | VERBOSE [ <boolean> ] }"

[[definition]]
id = "doc.sql-vacuum::option"
source = "doc.sql-vacuum"
name = "option"
grammar = "<option> ::= { FULL [ <boolean> ] | FREEZE [ <boolean> ] | VERBOSE [ <boolean> ] | ANALYZE [ <boolean> ] | DISABLE_PAGE_SKIPPING [ <boolean> ] | SKIP_LOCKED [ <boolean> ] | INDEX_CLEANUP { AUTO | ON | OFF } | PROCESS_MAIN [ <boolean> ] | PROCESS_TOAST [ <boolean> ] | TRUNCATE [ <boolean> ] | PARALLEL <integer> | SKIP_DATABASE_STATS [ <boolean> ] | ONLY_DATABASE_STATS [ <boolean> ] | BUFFER_USAGE_LIMIT <size> }"

[[definition]]
id = "doc.sql-vacuum::table_and_columns"
source = "doc.sql-vacuum"
name = "table_and_columns"
grammar = "<table_and_columns> ::= [ ONLY ] <table_name> [ * ] [ ( <column_name> [, ...] ) ]"
