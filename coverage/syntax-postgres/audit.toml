# Reviewed omission audit of the catalogue against the pinned grammar; checked by
# scripts/audit_syntax_catalogue_pg.py, which fails on any unreviewed gap or stale row.
#
# The audit spells every alternative of every statement rule, the expression rules and the
# rules reachable from them as keyword sequences (nonterminals that are
# keyword sets expanded), and requires a catalogued form whose words, with its page's
# definitions inlined, contain each sequence in order (a statement's first keyword first).
# It also requires every kwlist.h keyword that a production uses to appear in some grammar.
# [[production]] gives the reason a gram.y production has no form; [[keyword]] the reason a
# keyword appears in no grammar. Keywords no production uses are reported, not reviewed.

gram_y_sha256 = "7e548b673a1e03eb3a56c5eb9ad92d8e11095fac76e14cb258ca851f58274724"
kwlist_h_sha256 = "fdcdf3694513cba63b4016f63032472b686e381bb35f17c5d645bc2f6f1dac16"

# Stated limits of the method; the audit claims no more than these allow.
limits = [
    "Walk: every rule reachable from toplevel_stmt, stmt and the expression rules is walked (no depth bound); every other gram.y rule is listed under [[unwalked]] with a reason, and the audit fails on an unwalked rule that is not listed.",
    "Spelling: a production is checked as its keywords in order. Identifiers, literals, punctuation and operator symbols are not compared, and a nonterminal that is not a set of at most 60 alternatives of up to 4 keywords (nested two levels) contributes no words.",
    "Containment: a sequence is covered when one catalogued form, with its page's definitions inlined to depth 3, contains its keywords in order, not necessarily adjacent. For a statement rule the form must also start with the sequence's first keyword and its leading keywords must appear in the sequence.",
    "Below a statement, alternatives that spell fewer than 2 keywords are not checked as sequences; their keywords are covered only by the [[keyword]] check.",
    "Expansion: an alternative spelling more than 64 keyword sequences stops the audit with an error instead of being truncated; none does at the pinned grammar.",
]

