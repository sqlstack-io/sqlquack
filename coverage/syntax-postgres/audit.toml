# Reviewed omission audit of the catalogue against the pinned grammar; checked by
# scripts/audit_syntax_catalogue_pg.py, which fails on any unreviewed gap or stale row.
#
# The audit spells every alternative of every statement rule, the expression rules and the
# rules up to two levels below a statement as keyword sequences (nonterminals that are
# keyword sets expanded), and requires a catalogued form whose words, with its page's
# definitions inlined, contain each sequence in order (a statement's first keyword first).
# It also requires every kwlist.h keyword that a production uses to appear in some grammar.
# [[production]] gives the reason a gram.y production has no form; [[keyword]] the reason a
# keyword appears in no grammar. Keywords no production uses are reported, not reviewed.

gram_y_sha256 = "7e548b673a1e03eb3a56c5eb9ad92d8e11095fac76e14cb258ca851f58274724"
kwlist_h_sha256 = "fdcdf3694513cba63b4016f63032472b686e381bb35f17c5d645bc2f6f1dac16"

[[production]]
rule = "AlterEnumStmt"
production = "ALTER TYPE_P any_name DROP VALUE_P Sconst"
reason = "rejected after parsing: the production only raises an error (dropping an enum value is not implemented, 0A000)"

