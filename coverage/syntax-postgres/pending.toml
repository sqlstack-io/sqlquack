# INTO, the @-@ operator, BEGIN ATOMIC bodies, rule action lists, the ALTER DATABASE ... SET
# TABLESPACE, DETACH PARTITION ... CONCURRENTLY and bare CLUSTER captures, and the three
# negatives that split into two statements) was recorded once the referee and checker changes
# it waited on landed.
