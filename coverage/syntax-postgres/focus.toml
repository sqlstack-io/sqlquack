# Work order for the PostgreSQL catalogue: the forms SQLBuild's Postgres test SQL uses, each
# with the SQLBuild purposes (A-H in the multi-dialect plan) that need it. A temporary ordering
# only; no form carries a field for it. Read by `syntax-coverage summary --focus`.
#
# Derived from sqlstack-io/sqlbuild at sqlbuild_commit. The SQL is every string the Postgres
# e2e tests (tests/e2e/.../main/postgres and the ingestr Postgres tests), the integration tests
# that name Postgres, the waffle-shop playground templates those tests copy, the Rust test cases
# whose dialect is postgres or postgresql, the analysis failure corpus, the compiler
# differential's generated seed/0-postgres project and the Postgres adapter reach, with
# template markers replaced by identifiers. Each statement the PostgreSQL 18.6 parser accepts is
# classified by its parse tree and tokens.
#
# A statement is compiled when it is a model, test, audit or scenario body SQLBuild compiles
# (118 occurrences); adapter when the Postgres adapter or the shared adapter contract emits it
# (146); harness when a test only runs it against the server (189). Uses: a compiled statement's
# forms need A, B and C; also D for functions, casts, types, literals and arithmetic, string, json
# and datetime operators; lexical forms need A and E (and D for literals); data types need A
# and D; H when the SQL is a custom-rule test input and G when it is a local-replay scenario or
# its model. Adapter statements give D to the types and casts they spell (the adapter
# normalises type strings through the analysis dialect); harness statements give no use.
# Clauses inside SELECT (WITH, set operations, GROUP BY, ORDER BY, LIMIT) belong to
# pg.query.select.select. note gives the compiled or adapter occurrences and one origin.

dialect = "postgres"
sqlbuild_commit = "9082be135fb4f0afa08ca051cd245cc20b958965"

