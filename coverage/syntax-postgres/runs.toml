# How each receipt run in receipts/ was isolated, which referee recorded it, and what state the
# server held before and after. Written by hand when a run's receipts are committed; not read by
# the checker. Every run used the pinned image in engines/postgres/engine.toml, reached on the
# local loopback only.
#
# isolation:
#   shared_container: the long-lived local container sqlquack-pg; each case still ran in its own
#     throwaway database, rolled back or cleaned up by the referee.
#   fresh_container: a container started from the pinned digest for this run alone and removed
#     after it; each case also ran in its own throwaway database. start_state and end_state are
#     the counts of non-system roles, databases and tablespaces, and auto_conf_settings the
#     settings left in postgresql.auto.conf, read from the container before it was removed.
#     The one database more at the end is the referee's own sqlquack_parse_only database, which
#     it creates at the start of a run for its parse passes; no case leaves a role, database,
#     tablespace or setting behind.
#     container_id is the first 12 hex of the container's id. repeat_run names a second run of
#     the same cases in another fresh container whose receipts matched these on every compared
#     field (pg_referee compare); its receipts are not committed.

