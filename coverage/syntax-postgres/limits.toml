# Statements whose lists the renderer cannot copy as written.

[[reading]]
form = "pg.query.select.select"
grammar_sha256 = "65fd72b7bb10ec989ba814d760a72c6e7c53195bd799770479d848a11a7e9a7d"
grammar = ["[ WITH [ RECURSIVE ] <with_query_name> AS ( <with_subquery> ) [ , <with_query_name> AS ( <with_subquery> ) ] ] SELECT { [ ALL ] [ { * | <expression> [ [ AS ] <output_name> ] } [, ...] ] | DISTINCT [ ON ( <expression> [, ...] ) ] { * | <expression> [ [ AS ] <output_name> ] } [ , <expression> ] } [ FROM <from_item> [, ...] ] [ WHERE <condition> ] [ GROUP BY [ ALL | DISTINCT ] <grouping_element> [, ...] ] [ HAVING <condition> ] [ WINDOW <window_name> AS ( [ <window_definition> ] ) [ , <window_name> AS ( [ <window_definition> ] ) ] ] [ { UNION | INTERSECT | EXCEPT } [ ALL | DISTINCT ] <select> ] [ ORDER BY <expression> [ ASC | DESC | USING <operator> ] [ NULLS { FIRST | LAST } ] [ , <expression> ] ] [ { LIMIT { <count> | ALL } | FETCH { FIRST | NEXT } [ <count> ] { ROW | ROWS } ONLY } ] [ OFFSET <start> [ ROW | ROWS ] ] [ FOR { UPDATE | NO KEY UPDATE | SHARE | KEY SHARE } [ OF <from_reference> [, ...] ] [ NOWAIT | SKIP LOCKED ] [...] ]"]
reason = "with_query spelled as its definition's name AS ( query ), so nesting goes inside the parentheses; DISTINCT [ ON ( ... ) ] with a required select list (gram.y simple_select: distinct_clause target_list; ALL and no keyword take an optional list); every part of a window definition optional, as its definition on the page makes it; the WITH, DISTINCT select, WINDOW and ORDER BY lists' second items written out, which the renderer otherwise copies wrongly; LIMIT and FETCH as the two spellings of one clause (gram.y limit_clause: a query has at most one, the synopsis lists both as optional); FETCH ... WITH TIES, which needs ORDER BY, moved to hand-written limits"

[[reading]]
form = "pg.dml.update"
grammar_sha256 = "c6d9af0264d04a611781bdccc6cdb1112e682c5c28d83003d8908ea0c410643c"
grammar = ["[ WITH [ RECURSIVE ] <with_query_name> AS ( <with_subquery> ) [ , <with_query_name> AS ( <with_subquery> ) ] ] UPDATE { ONLY <table_name> | <table_name> [ * ] } [ [ AS ] <alias> ] SET { <column_name> = { <expression> | DEFAULT } | ( <column_name> [, ...] ) = [ ROW ] ( { <expression> | DEFAULT } [, ...] ) | ( <column_name> [, ...] ) = ( <sub-SELECT> ) } [ , <column_name> = <expression> ] [ FROM <from_item> [, ...] ] [ WHERE <condition> | WHERE CURRENT OF <cursor_name> ] [ RETURNING [ WITH ( { OLD | NEW } AS <output_alias> [ , NEW AS <output_alias> ] ) ] { * | <output_expression> [ [ AS ] <output_name> ] } [ , <output_expression> ] ]"]
reason = "with_query spelled as its definition's name AS ( query ), so nesting goes inside the parentheses; ONLY and * as alternatives (gram.y relation_expr takes one or the other, the synopsis shows both as optional); the SET, WITH ( ... ) and RETURNING lists' second items written out, which the renderer otherwise copies wrongly"

# Derived negatives that are valid PostgreSQL.

[[suppress]]
form = "pg.query.select.select"
kind = "identifier_class"
target = "<output_name>"
reason = "a reserved keyword after an output expression is a bare column label (gram.y bare_label_keyword covers SELECT and most reserved words), so it is no negative; [[limit]] rows test a keyword that is not a bare label"

[[suppress]]
form = "pg.dml.update"
kind = "identifier_class"
target = "<output_name>"
reason = "a reserved keyword after a RETURNING expression is a bare column label (gram.y bare_label_keyword), so it is no negative"

[[suppress]]
form = "pg.query.select.select"
kind = "negative_neighbour"
target = "<count> in [ <count> ]"
reason = "FETCH's count is any c_expr (gram.y select_fetch_first_value), and a string literal is one; a non-integer count fails at run time, not in the parser"

[[suppress]]
form = "pg.query.select.select"
kind = "negative_neighbour"
target = "<count> in [ { LIMIT { <count> | ALL } | FETCH { FIRST | NEXT } [ <count> ] { ROW | ROWS } ONLY } ]"
reason = "LIMIT takes any a_expr (gram.y select_limit_value), and a string literal is one; a non-integer count fails at run time, not in the parser"

[[suppress]]
form = "pg.query.select.select"
kind = "negative_neighbour"
target = ""
note = "the form without its required SELECT"
reason = "without SELECT the minimal form is the empty string, which PostgreSQL accepts as an empty query"

[[suppress]]
form = "pg.expressions.sql-expressions.aggregate"
kind = "required_operand_missing"
target = "<aggregate_name>"
reason = "without the name the call is a parenthesised expression, ( expression ), which is valid"

[[suppress]]
form = "pg.expressions.sql-expressions.aggregate"
kind = "identifier_class"
target = "<aggregate_name>"
reason = "with SELECT as the name, SELECT ( 1 ) inside parentheses is a scalar subquery, which is valid"

[[suppress]]
form = "pg.expressions.datatype.character-varying"
kind = "negative_neighbour"
target = ""
note = "the form without its required VARYING"
reason = "CHARACTER without VARYING is the documented fixed-length type character, which is valid"

[[suppress]]
form = "pg.expressions.datatype.character-varying"
kind = "negative_neighbour"
target = ""
note = "the form without its required CHARACTER after "
reason = "VARYING is an unreserved keyword, so on its own it parses as a type name; an unknown type fails after parsing"

[[suppress]]
form = "pg.expressions.datatype-datetime.typed-datetime-literal"
kind = "required_operand_missing"
target = "<type>"
reason = "without the type the constant is a plain string literal, which is valid"

[[suppress]]
form = "pg.expressions.datatype-datetime.typed-datetime-literal"
kind = "required_operand_missing"
target = "'<value>'"
reason = "without the string the type name (TIMESTAMP, a column-name keyword) parses as a column reference, which is valid"

[[suppress]]
form = "pg.expressions.sql-syntax-lexical.type-string"
kind = "required_operand_missing"
target = "<type>"
reason = "without the type the constant is a plain string literal, which is valid"

[[suppress]]
form = "pg.expressions.sql-expressions.column-reference"
kind = "identifier_class"
target = "<columnname>"
reason = "after a dot any keyword is a column label (gram.y attr_name: ColLabel), so a reserved word there is valid"

