form = "pg.ddl.create-trigger"
grammar_sha256 = "c7afa5f05398129973a0b3b420caf6ed0f290a76e31523dce0fda84524bdeaa8"
grammar = ["CREATE [ OR REPLACE ] TRIGGER <name> { BEFORE | AFTER | INSTEAD OF } { <event> [ OR DELETE ] } ON <table_name> [ REFERENCING { { OLD | NEW } TABLE [ AS ] <transition_relation_name> } [ ... ] ] [ FOR [ EACH ] { ROW | STATEMENT } ] [ WHEN ( <condition> ) ] EXECUTE { FUNCTION | PROCEDURE } <function_name> ( <arguments> )", "CREATE CONSTRAINT TRIGGER <name> AFTER { <event> [ OR DELETE ] } ON <table_name> [ FROM <referenced_table_name> ] [ NOT DEFERRABLE | [ DEFERRABLE ] [ INITIALLY IMMEDIATE | INITIALLY DEFERRED ] ] FOR EACH ROW [ WHEN ( <condition> ) ] EXECUTE { FUNCTION | PROCEDURE } <function_name> ( <arguments> )"]
reason = "the synopsis puts FROM and the deferral options on every trigger, but gram.y CreateTrigStmt takes them only after CONSTRAINT TRIGGER, which is AFTER ... FOR EACH ROW without REFERENCING (as the page's description of constraint triggers says); one production for each, with the event list's second item written out as a different event, since gram.y TriggerEvents rejects a repeated event with 42601; the constraint production without OR REPLACE, which gram.y refuses there with 0A000"

[[reading]]
form = "pg.ddl.create-collation.name"
grammar_sha256 = "e842c361d04bb96b25a1da00089bc9ad9df0c263b68acdfac02459fe8c47144f"
grammar = ["CREATE COLLATION [ IF NOT EXISTS ] <name> ( { LOCALE = <locale> | LC_COLLATE = <lc_collate> , LC_CTYPE = <lc_ctype> } [ , PROVIDER = <provider> ] [ , DETERMINISTIC = <boolean> ] [ , RULES = <rules> ] [ , VERSION = <version> ] )"]
reason = "the synopsis brackets every item, each with a trailing comma, but gram.y definition needs a non-empty list without a trailing comma, and the page requires LOCALE or both LC_COLLATE and LC_CTYPE; written as that requirement with leading commas"

[[reading]]
form = "pg.ddl.alter-sequence.name"
grammar_sha256 = "9b46eb24ef1d0108e4cb5cbb84022e295dab1c62b9c9661a349250acb2b1d5e8"
grammar = ["ALTER SEQUENCE [ IF EXISTS ] <name> { AS <data_type> | INCREMENT [ BY ] <increment> } [ MINVALUE <minvalue> | NO MINVALUE ] [ MAXVALUE <maxvalue> | NO MAXVALUE ] [ [ NO ] CYCLE ] [ START [ WITH ] <start> ] [ RESTART [ [ WITH ] <restart> ] ] [ CACHE <cache> ] [ OWNED BY { <table_name>.<column_name> | NONE } ]"]
reason = "the synopsis brackets every option, but gram.y AlterSeqStmt takes a non-empty SeqOptList; the first two options are written as a required choice so the shortest form is valid"

[[reading]]
form = "pg.ddl.alter-server.name"
grammar_sha256 = "9b8160c0f8d732eb20da767d3f21b6d8cecc1dd6be669f77fc5fcceb57197116"
grammar = ["ALTER SERVER <name> VERSION '<new_version>' [ OPTIONS ( { [ ADD | SET ] <option> '<value>' | DROP <option> } [ , <option> '<value>' ] ) ]"]
reason = "the synopsis brackets both clauses, but gram.y AlterForeignServerStmt needs VERSION, OPTIONS or both: written with VERSION required, and OPTIONS alone as a hand-written limit; OPTIONS items as the other OPTIONS lists (DROP takes no value)"

[[reading]]
form = "pg.ddl.alter-foreign-data-wrapper.name"
grammar_sha256 = "0d37468c851c6b2b22e12021d0675e470527f92d3091e2aa1aede7230fd1f5ac"
grammar = ["ALTER FOREIGN DATA WRAPPER <name> { HANDLER <handler_function> | NO HANDLER } [ VALIDATOR <validator_function> | NO VALIDATOR ] [ OPTIONS ( { [ ADD | SET ] <option> '<value>' | DROP <option> } [ , <option> '<value>' ] ) ]"]
reason = "the synopsis brackets every clause, but gram.y AlterFdwStmt needs fdw_options, OPTIONS or both: written with the handler clause required, and VALIDATOR alone and OPTIONS alone as hand-written limits; OPTIONS items as the other OPTIONS lists (DROP takes no value)"

[[reading]]
form = "pg.ddl.create-aggregate.basetype-sfunc-stype"
grammar_sha256 = "1470daf81cb2473bf66abb76da090c2332a08acd39c56e4f951b0c555b94df60"
grammar = ["CREATE [ OR REPLACE ] AGGREGATE <name> ( BASETYPE = <base_type>, SFUNC = <sfunc>, STYPE = <state_data_type> [ , SSPACE = <state_data_size> ] [ , FINALFUNC = <ffunc> ] [ , FINALFUNC_EXTRA = <boolean> ] [ , FINALFUNC_MODIFY = { READ_ONLY | SHAREABLE | READ_WRITE } ] [ , COMBINEFUNC = <combinefunc> ] [ , SERIALFUNC = <serialfunc> ] [ , DESERIALFUNC = <deserialfunc> ] [ , INITCOND = <initial_condition> ] [ , MSFUNC = <msfunc> ] [ , MINVFUNC = <minvfunc> ] [ , MSTYPE = <mstate_data_type> ] [ , MSSPACE = <mstate_data_size> ] [ , MFINALFUNC = <mffunc> ] [ , MFINALFUNC_EXTRA = <boolean> ] [ , MFINALFUNC_MODIFY = { READ_ONLY | SHAREABLE | READ_WRITE } ] [ , MINITCOND = <minitial_condition> ] [ , SORTOP = <sort_operator> ] )"]
reason = "the old syntax's FINALFUNC_EXTRA and MFINALFUNC_EXTRA take a value: gram.y old_aggr_elem is IDENT '=' def_arg, so the page's bare spelling is rejected (a hand-written limit records that); written as FINALFUNC_EXTRA = boolean"

