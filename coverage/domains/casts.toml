variants = ["CAST({0} AS TIMESTAMP_TZ(9))", "CAST({0} AS TIMESTAMP_LTZ(9))", "TRY_CAST({0} AS TIMESTAMP_NTZ(9))", "TRY_CAST({0} AS TIMESTAMP_TZ(9))", "TRY_CAST({0} AS TIMESTAMP_LTZ(9))"]

