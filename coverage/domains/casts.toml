# Declared domains of casts and conversion functions.
# Format: see docs/coverage.md.
version = 1

[[rule]]
id = "rule.cast_numeric"

[[rule.form]]
construct = "node:cast"
arguments = [
  { families = ["integer", "decimal"] },
]
facets = { target = ["integer", "decimal", "float"] }
template = "CAST({0} AS NUMBER(38,2))"
category = "conversion"
variants = ["CAST({0} AS NUMBER(38,0))", "CAST({0} AS FLOAT)"]

[[rule.form]]
construct = "node:cast"
arguments = [
  { families = ["float"] },
]
facets = { target = ["integer"], float_scale = ["0"] }
template = "CAST({0} AS NUMBER(38,0))"
category = "conversion"

[[rule.form]]
construct = "node:cast"
arguments = [
  { families = ["float"] },
]
facets = { target = ["decimal"], float_scale = ["2"] }
template = "CAST({0} AS NUMBER(20,2))"
category = "conversion"
variants = ["CAST({0} AS NUMBER(38,2))"]

[[rule.form]]
construct = "node:cast"
arguments = [
  { families = ["float"] },
]
facets = { target = ["decimal"], float_scale = ["6"] }
template = "CAST({0} AS NUMBER(20,6))"
category = "conversion"
variants = ["CAST({0} AS NUMBER(38,2))"]

[[rule.form]]
construct = "node:cast"
arguments = [
  { families = ["float"] },
]
facets = { target = ["decimal"], float_scale = ["8"] }
template = "CAST({0} AS NUMBER(20,8))"
category = "conversion"
variants = ["CAST({0} AS NUMBER(38,2))"]
# 1e15 and 1e21 overflow NUMBER(20,8), and Snowflake fails the whole query with 100046.
divergences = { "float.notation_boundaries" = "" }

[[rule.form]]
construct = "node:cast"
arguments = []
facets = { target = ["integer", "decimal", "float"] }

