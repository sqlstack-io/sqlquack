[[rule]]
id = "rule.cast_text_literal"

[[rule.form]]
construct = "node:cast"
also = ["node:try_cast"]
arguments = [
  { families = ["text"], kinds = ["literal"], grammar = true },
]
facets = { target = ["date"] }
template = "CAST({0} AS DATE)"
category = "conversion"
benign = { "0" = "'2024-01-15'" }
variants = ["TRY_CAST({0} AS DATE)"]

[[rule.form]]
construct = "node:cast"
also = ["node:try_cast"]
