variants = ["CAST({0} AS NUMBER(38,0))", "CAST({0} AS NUMBER(38,2))", "CAST({0} AS FLOAT)", "CAST({0} AS BOOLEAN)", "CAST({0} AS DATE)", "TRY_CAST({0} AS NUMBER(38,0))", "TRY_CAST({0} AS FLOAT)", "TRY_CAST({0} AS BOOLEAN)", "TRY_CAST({0} AS DATE)"]

