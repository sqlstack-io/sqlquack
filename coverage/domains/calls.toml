[[rule]]
id = "rule.concat"

[[rule.form]]
construct = "node:concat"
arguments = [
  { families = ["text", "integer", "decimal", "boolean", "date"] },
  { families = ["text", "integer", "decimal", "boolean", "date"] },
]
repeat = true
one_wise = true
template = "{0} || {1}"
category = "string"

[[rule.form]]
construct = "fn:CONCAT"
arguments = [
  { families = ["text", "integer", "decimal", "boolean", "date"] },
  { families = ["text", "integer", "decimal", "boolean", "date"] },
]
repeat = true
one_wise = true
template = "CONCAT({0}, {1})"
category = "string"

[[rule]]
id = "rule.concat_ws"

[[rule.form]]
construct = "fn:CONCAT_WS"
arguments = [
  { families = ["text", "integer", "decimal", "boolean", "date", "null"] },
  { families = ["text", "integer", "decimal", "boolean", "date", "null"] },
]
repeat = true
one_wise = true
template = "CONCAT_WS({0}, {1})"
category = "string"

