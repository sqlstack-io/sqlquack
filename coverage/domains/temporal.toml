[[rule]]
id = "rule.timestamp_time"

# Read as microseconds since midnight: the connector returns a TIME(9) result only in microseconds.
[[rule.form]]
construct = "fn:TO_TIME"
also = ["fn:TIME"]
arguments = [
  { families = ["timestamp_ntz"] },
]
template = "DATEDIFF('microsecond', '00:00:00'::TIME, TO_TIME({0}))"
category = "temporal"
variants = ["DATEDIFF('microsecond', '00:00:00'::TIME, TIME({0}))"]

[[rule]]
id = "rule.interval_arithmetic"

[[rule.form]]
construct = "node:sub"
also = ["node:add"]
arguments = [
  { families = ["date", "timestamp_ntz"] },
  { families = ["text"], kinds = ["literal"], grammar = true },
]
template = "{0} - INTERVAL {1}"
category = "temporal"
benign = { "1" = "'1 day'" }
variants = ["{0} + INTERVAL {1}"]
# The result is a nanosecond timestamp, which the recording connector truncates past 2262.
unrecordable = { "0.timestamp_ntz.extreme_years" = "The recording connector cannot convert the nanosecond timestamp past 2262 the sum returns." }

[[rule.form]]
construct = "node:sub"
also = ["node:add"]
arguments = [
  { families = ["timestamp_ntz"] },
  { families = ["text"], kinds = ["literal"], grammar = true },
]
template = "{0} + INTERVAL {1}"
category = "temporal"
benign = { "1" = "'2 hours'" }
# The result is a nanosecond timestamp, which the recording connector truncates past 2262.
unrecordable = { "0.timestamp_ntz.extreme_years" = "The recording connector cannot convert the nanosecond timestamp past 2262 the sum returns." }
