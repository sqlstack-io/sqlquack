# Declared domains of temporal functions.
# Format: see docs/coverage.md.
version = 1

[[rule]]
id = "rule.convert_timezone"

[[rule.form]]
construct = "fn:CONVERT_TIMEZONE"
arguments = [
  { families = ["text"], kinds = ["literal"], grammar = true },
  { families = ["text"], kinds = ["literal"], grammar = true },
  { families = ["timestamp_ntz"] },
]
template = "CONVERT_TIMEZONE({0}, {1}, {2})"
category = "temporal"
benign = { "0" = "'America/New_York'", "1" = "'Europe/London'" }

[[rule.form]]
construct = "fn:CONVERT_TIMEZONE"
arguments = [
  { families = ["text"], kinds = ["literal"], grammar = true },
  { families = ["timestamp_ntz", "timestamp_ltz", "timestamp_tz"] },
]
template = "CONVERT_TIMEZONE({0}, {1})"
category = "temporal"
benign = { "0" = "'Europe/London'" }
divergences = { "timestamp_ntz.sub_microsecond" = "timestamp_tz_submicro", "timestamp_ntz.half_millisecond" = "timestamp_tz_submicro" }

[[rule.form]]
construct = "fn:CONVERT_TIMEZONE"
arguments = [
  { families = ["text"] },
  { families = ["text"] },
  { families = ["timestamp_ntz"] },
]

[[rule.form]]
construct = "fn:CONVERT_TIMEZONE"
arguments = [
  { families = ["text"] },
  { families = ["timestamp_ntz", "timestamp_ltz", "timestamp_tz"] },
]

