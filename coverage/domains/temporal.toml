# Without TRY_, an impossible timestamp raises Snowflake's error: its hazard cases stand apart.
[[rule.form]]
construct = "fn:TO_TIMESTAMP"
also = ["fn:TO_TIMESTAMP_NTZ"]
arguments = [
  { families = ["text"], kinds = ["literal"], grammar = true },
  { families = ["text"] },
]
template = "TO_TIMESTAMP({1}, {0})"
category = "temporal"
benign = { "0" = "'YYYY-MM-DD HH24:MI:SS'", "1" = "'2024-01-15 10:00:00'" }
variants = ["TO_TIMESTAMP_NTZ({1}, {0})"]

