[[rule]]
id = "rule.zeroifnull"

[[rule.form]]
construct = "fn:ZEROIFNULL"
arguments = [
  { families = ["integer", "decimal", "float"] },
]
template = "ZEROIFNULL({0})"
category = "numeric"
