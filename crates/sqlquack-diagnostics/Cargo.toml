[package]
name = "sqlquack-diagnostics"
version.workspace = true
description = "SQLQuack's diagnostics, failure taxonomy, refusals, constructs and conversion provenance."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# Snowflake's error taxonomy and rejections.
snowflake = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlquack-syntax.workspace = true

[dev-dependencies]
# The tests read Snowflake's error kinds and rejections too.
sqlquack-diagnostics = { workspace = true, features = ["snowflake"] }
sqlquack-parse.workspace = true

[lints]
workspace = true
