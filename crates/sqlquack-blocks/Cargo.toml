[package]
name = "sqlquack-blocks"
version.workspace = true
description = "DuckDB building blocks shared by SQLQuack rules."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true

# `engine` links native DuckDB for check_printed's parse-and-bind check. Without it, the building
# blocks and the lexical checks still compile, for targets such as wasm32 that bind elsewhere.
# Off by default: every consumer that links the engine turns it on by name.
[features]
default = []
engine = ["dep:duckdb"]
# Compiles DuckDB into the binary, for distributions that must not need a system DuckDB. Its json
# and ICU extensions come with it: the checking engine's helper macros call json functions, and
# zone-dependent statements bind only with ICU, so without them conversions fail their check.
# Compiling ICU in builds DuckDB with CMake from the duckdb-rs sources checkout, which the crates.io
# duckdb package does not ship: this workspace patches duckdb to that checkout, and a build of the
# crates.io sqlquack-blocks needs the same patch and CMake for this feature.
bundled = ["engine", "duckdb/bundled", "duckdb/json", "duckdb/icu"]
# Also names DuckDB's parquet extension, so `sqlquack run` reads Parquet fixtures without downloading
# an extension. The CMake build behind `bundled` compiles it in already.
extensions = ["bundled", "duckdb/parquet"]

[dependencies]
duckdb = { workspace = true, optional = true }
serde_json.workspace = true
sqlquack-diagnostics.workspace = true
sqlquack-semantics = { workspace = true, features = ["snowflake"] }

[dev-dependencies]
duckdb.workspace = true

[lints]
workspace = true
