[package]
name = "sqlquack-blocks"
version.workspace = true
description = "DuckDB building blocks shared by SQLQuack rules."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true

# `engine` links native DuckDB for check_printed's parse-and-bind check. Without it, the building
# blocks and the lexical checks still compile, for targets such as wasm32 that bind elsewhere.
# Off by default: every consumer that links the engine turns it on by name.
[features]
default = []
engine = ["dep:duckdb"]
# Compiles DuckDB into the binary, for distributions that must not need a system DuckDB. Its json
# extension comes with it: the checking engine's helper macros call json functions, so without it
# every conversion fails its check.
bundled = ["engine", "duckdb/bundled", "duckdb/json"]
# DuckDB's parquet extension compiled in as well, so `sqlquack run` reads Parquet fixtures without
# downloading an extension.
extensions = ["bundled", "duckdb/parquet"]

[dependencies]
duckdb = { workspace = true, optional = true }
serde_json.workspace = true
sqlquack-diagnostics.workspace = true
sqlquack-semantics = { workspace = true, features = ["snowflake"] }

[dev-dependencies]
duckdb.workspace = true

[lints]
workspace = true
