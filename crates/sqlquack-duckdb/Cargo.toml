[package]
name = "sqlquack-duckdb"
version.workspace = true
description = "DuckDB building blocks shared by SQLQuack rules."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true

# `engine` links native DuckDB for check_printed's parse-and-bind check. Without it, the building
# blocks and the lexical checks still compile, for targets such as wasm32 that bind elsewhere.
[features]
default = ["engine"]
engine = ["dep:duckdb"]
# Compiles DuckDB into the binary, for distributions that must not need a system DuckDB.
bundled = ["engine", "duckdb/bundled"]
# DuckDB's parquet and json extensions compiled in, so `sqlquack run` reads Parquet fixtures and
# JSON columns without downloading an extension.
extensions = ["bundled", "duckdb/parquet", "duckdb/json"]

[dependencies]
duckdb = { workspace = true, optional = true }
serde_json.workspace = true
sqlquack-core.workspace = true
sqlquack-snowflake.workspace = true

[dev-dependencies]
duckdb.workspace = true

[lints]
workspace = true
