[package]
name = "sqlquack-evidence"
version.workspace = true
description = "SQLQuack evidence: cases, content hashes, pending files, recorded results, DuckDB replay and audits."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
arrow.workspace = true
base64.workspace = true
duckdb.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlquack-compare.workspace = true
sqlquack-diagnostics = { workspace = true, features = ["snowflake"] }
sqlquack-policy.workspace = true
sqlquack-syntax.workspace = true
tempfile.workspace = true
toml.workspace = true
walkdir.workspace = true

[features]
default = []
# Cases recorded on Databricks SQL: their source SQL, results kept as text, and journal import.
databricks = []

[dev-dependencies]
# The tests read every warehouse's evidence.
sqlquack-evidence = { workspace = true, features = ["databricks"] }

[lints]
workspace = true
