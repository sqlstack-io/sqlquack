[package]
name = "sqlquack-lint"
version.workspace = true
description = "SQL lint Rules over SQLQuack's tokens and syntax trees, ported from SQLClean."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true

# Each dialect's lint profile; a dialect left out is refused as not built in.
[features]
default = []
bigquery = ["native-predicates", "sqlquack-parse/bigquery"]
databricks = ["native-predicates", "sqlquack-parse/databricks"]
duckdb = ["shared-statements"]
postgres = ["native-parsers", "shared-parser", "sqlquack-parse/postgres"]
snowflake = ["shared-statements"]
sqlite = ["shared-statements"]
# What several dialects' profiles share: their own strict parsers, the predicates those read,
# the shared tokenizer and expression parser, and the shared statement parser.
native-parsers = []
native-predicates = ["native-parsers"]
shared-parser = []
shared-statements = ["shared-parser"]

[dependencies]
rayon.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlquack-parse.workspace = true
sqlquack-syntax.workspace = true

[dev-dependencies]
# The tests lint every dialect.
sqlquack-lint = { workspace = true, features = [
  "bigquery",
  "databricks",
  "duckdb",
  "postgres",
  "snowflake",
  "sqlite",
] }

[lints]
workspace = true
