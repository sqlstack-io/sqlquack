[package]
name = "sqlquack-rules"
version.workspace = true
description = "The SQLQuack rule catalogue: verified Snowflake-to-DuckDB rules and declared refusals."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true

# `engine`: DuckDB parses and binds every converted statement. Off, the converter skips that check,
# and the caller binds the SQL itself (the browser playground does, in DuckDB-WASM).
[features]
default = ["engine"]
engine = ["sqlquack-duckdb/engine"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sqlquack-core.workspace = true
sqlquack-duckdb.workspace = true
sqlquack-policy.workspace = true
sqlquack-semantics.workspace = true
sqlquack-snowflake-types.workspace = true
sqlquack-syntax.workspace = true

[lints]
workspace = true
