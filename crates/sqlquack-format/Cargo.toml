[package]
name = "sqlquack-format"
version.workspace = true
description = "SQL layout that changes only the whitespace between tokens and the case of keywords."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true

# Each dialect's format profile; SQL in a dialect left out is refused as not built in.
[features]
default = []
bigquery = ["native-scanner", "sqlquack-parse/bigquery"]
databricks = ["native-scanner", "sqlquack-parse/databricks"]
duckdb = []
postgres = ["sqlquack-parse/postgres"]
snowflake = []
sqlserver = ["native-scanner", "sqlquack-parse/sqlserver"]
# Reading the comments and token types of a dialect's own scanner, for the dialects that have one.
native-scanner = []

[dependencies]
serde_json.workspace = true
sqlquack-parse.workspace = true
sqlquack-syntax.workspace = true

[dev-dependencies]
# The tests lay out every dialect.
sqlquack-format = { workspace = true, features = [
  "bigquery",
  "databricks",
  "duckdb",
  "postgres",
  "snowflake",
  "sqlserver",
] }

[lints]
workspace = true
