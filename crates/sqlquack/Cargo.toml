[package]
name = "sqlquack"
version.workspace = true
description = "Snowflake-to-DuckDB SQL conversion that refuses to guess."
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["sql", "duckdb", "snowflake", "transpiler"]
categories = ["database", "command-line-utilities"]
publish.workspace = true
rust-version.workspace = true

[[bin]]
name = "sqlquack"
path = "src/bin/sqlquack.rs"

[features]
# DuckDB compiled in, as the sqlquack-cli wheel ships it.
bundled = ["sqlquack-duckdb/bundled"]

[dependencies]
anstream.workspace = true
clap.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlquack-compare.workspace = true
sqlquack-convert.workspace = true
sqlquack-core.workspace = true
sqlquack-duckdb = { workspace = true, features = ["engine"] }
sqlquack-evidence.workspace = true
sqlquack-policy.workspace = true
sqlquack-rules = { workspace = true, features = ["engine"] }
sqlquack-semantics.workspace = true
sqlquack-snowflake.workspace = true
sqlquack-syntax.workspace = true
walkdir.workspace = true

[dev-dependencies]
arrow.workspace = true
duckdb.workspace = true
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
