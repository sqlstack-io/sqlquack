[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sqlquack-cli"
dynamic = ["version"]
description = "The native sqlquack executable: check Snowflake SQL and convert it into DuckDB SQL."
readme = "../../README.md"
requires-python = ">=3.12"
license = "Apache-2.0 AND MIT"
# Copies of the repository root files; `make distribution-notices` checks they match.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]

[tool.maturin]
bindings = "bin"
features = ["bundled"]
