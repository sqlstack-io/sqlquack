[targets.python]
analyzer = "python"
roots = ["recorder/src/sqlquack_record", "python/src/sqlquack"]
tests = ["tests"]
tooling = ["scripts"]
rule_modules = ["scripts.fensu_policy.rules.script_names"]
select = ["FF", "XSQ005", "XSQ006"]

[targets.rust]
analyzer = "rust"
roots = ["crates", "tools"]
tests = []
tooling = ["tools/sqlquack-polyglot-check"]
rule_packs = ["rust"]
rule_modules = [
  "scripts.fensu_policy.rules.crate_layout",
  "scripts.fensu_policy.rules.dialect_folders",
  "scripts.fensu_policy.rules.dialect_names",
  "scripts.fensu_policy.rules.conversion_fields",
]
select = ["FPRS", "XSQ001", "XSQ002", "XSQ003", "XSQ004", "XSQ007", "XSQ008", "XSQ009"]

# The playground engine, website/wasm, imports these two Snowflake conversion entries. fensu reads
# only the root cargo workspace, and website/wasm keeps its own, so FPRSL105 cannot see that importer.
# Drop both entries once the playground engine moves onto the Snowflake pipeline's `analyze`.
[[targets.rust.rule_exceptions]]
rule = "FPRSL105"
path = "crates/sqlquack-convert/src/snowflake/conversion/main/convert_statement.rs"
reason = "imported by the playground engine website/wasm, outside the root cargo workspace, until the playground engine moves onto `analyze`"

[[targets.rust.rule_exceptions]]
rule = "FPRSL105"
path = "crates/sqlquack-convert/src/snowflake/conversion/main/within_budget.rs"
reason = "imported by the playground engine website/wasm, outside the root cargo workspace, until the playground engine moves onto `analyze`"

[[targets.rust.rule_exceptions]]
rule = "FPRSL105"
path = "crates/sqlquack-convert/src/snowflake/session/main/builtin_conversion_options.rs"
reason = "imported by the playground engine website/wasm, outside the root cargo workspace, which lists each known difference's default from it"

[[targets.rust.rule_exceptions]]
rule = "FPRSL105"
path = "crates/sqlquack-convert/src/snowflake/session/main/configured_choices.rs"
reason = "imported by the playground engine website/wasm, outside the root cargo workspace, which reads the user's sqlquack.toml text without a file"

# The evidence policy sits at the crate root, where `cargo package` keeps it and the evidence commands
# read it, so the constant that compiles it in reaches outside src/policy/.
[[targets.rust.rule_exceptions]]
rule = "FPRSL106"
path = "crates/sqlquack-policy/src/policy/constants.rs"
reason = "compiles in crates/sqlquack-policy/evidence.toml, which sits at the crate root for `cargo package` and the evidence commands"

# Format, lint and fingerprint take a dialect at run time, so each keeps one registry that maps
# a dialect value to its src/<dialect>/ profile, with every line behind that dialect's feature.
[targets.rust.rule_options.XSQ007]
dialect_registries = [
    "crates/sqlquack-semantics/src/dialects",
    "crates/sqlquack-format/src/dialects",
    "crates/sqlquack-lint/src/dialects",
    "crates/sqlquack-fingerprint/src/dialects",
]

# A crate that is also a Python distribution keeps its pyproject.toml and shipped notices beside Cargo.toml,
# and sqlquack-policy keeps the evidence.toml it compiles in, so `cargo package` includes it.
[targets.rust.rule_options.FPRSR311]
allowed_entries = [
    "Cargo.toml",
    "build.rs",
    "src/",
    "tests/",
    "benches/",
    "examples/",
    "README*",
    "LICENSE*",
    "THIRD_PARTY_NOTICES",
    "pyproject.toml",
    "evidence.toml",
]

# Layer: only the command-line crates may depend on the conversion rules and pipeline.
[targets.rust_rules_layer]
analyzer = "rust"
roots = ["crates", "tools"]
tests = []
tooling = [
  "crates/sqlquack",
  "crates/sqlquack-convert",
  "tools/sqlquack-polyglot-check",
  "crates/sqlquack-python",
]
rule_packs = ["rust"]
select = ["FPRSL301"]

[targets.rust_rules_layer.rule_options.FPRSL301]
forbidden_packages = ["sqlquack-convert"]

# Layer: syntax, the parsers, diagnostics and semantics build without conversion, DuckDB or evidence.
[targets.rust_analysis_layer]
analyzer = "rust"
roots = ["crates", "tools"]
tests = []
tooling = [
  "crates/sqlquack",
  "crates/sqlquack-convert",
  "tools/sqlquack-polyglot-check",
  "crates/sqlquack-python",
  "crates/sqlquack-blocks",
  "crates/sqlquack-evidence",
  "tools/sqlquack-format-check",
  "crates/sqlquack-compare",
  "crates/sqlquack-policy",
]
rule_packs = ["rust"]
select = ["FPRSL301"]

[targets.rust_analysis_layer.rule_options.FPRSL301]
forbidden_packages = [
  "sqlquack",
  "sqlquack-convert",
  "sqlquack-blocks",
  "sqlquack-evidence",
  "sqlquack-compare",
  "sqlquack-policy",
  "duckdb",
  "libduckdb-sys",
  "arrow",
  "polyglot-sql",
]
