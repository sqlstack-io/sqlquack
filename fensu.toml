[targets.python]
analyzer = "python"
roots = ["recorder/src/sqlquack_record", "python/src/sqlquack"]
tests = ["tests"]
tooling = ["scripts"]
select = ["FF"]

[targets.rust]
analyzer = "rust"
roots = ["crates"]
tests = []
tooling = ["crates/sqlquack-polyglot-check"]
rule_packs = ["rust"]
select = ["FPRS"]

# A crate that is also a Python distribution keeps its pyproject.toml and shipped notices beside Cargo.toml.
[targets.rust.rule_options.FPRSR311]
allowed_entries = [
    "Cargo.toml",
    "build.rs",
    "src/",
    "tests/",
    "benches/",
    "examples/",
    "README*",
    "LICENSE*",
    "THIRD_PARTY_NOTICES",
    "pyproject.toml",
]

# Layer: only the command-line crates and the pipeline crate may depend on the conversion rules.
[targets.rust_rules_layer]
analyzer = "rust"
roots = ["crates"]
tests = []
tooling = [
  "crates/sqlquack",
  "crates/sqlquack-convert",
  "crates/sqlquack-polyglot-check",
  "crates/sqlquack-python",
]
rule_packs = ["rust"]
select = ["FPRSL301"]

[targets.rust_rules_layer.rule_options.FPRSL301]
forbidden_packages = ["sqlquack-rules"]

# Layer: syntax, core, Snowflake typing and semantics build without conversion, DuckDB or evidence.
[targets.rust_analysis_layer]
analyzer = "rust"
roots = ["crates"]
tests = []
tooling = [
  "crates/sqlquack",
  "crates/sqlquack-convert",
  "crates/sqlquack-polyglot-check",
  "crates/sqlquack-python",
  "crates/sqlquack-rules",
  "crates/sqlquack-duckdb-blocks",
  "crates/sqlquack-evidence",
  "crates/sqlquack-format-check",
  "crates/sqlquack-compare",
  "crates/sqlquack-policy",
]
rule_packs = ["rust"]
select = ["FPRSL301"]

[targets.rust_analysis_layer.rule_options.FPRSL301]
forbidden_packages = [
  "sqlquack",
  "sqlquack-rules",
  "sqlquack-duckdb-blocks",
  "sqlquack-evidence",
  "sqlquack-compare",
  "sqlquack-policy",
  "duckdb",
  "libduckdb-sys",
  "arrow",
  "polyglot-sql",
]
