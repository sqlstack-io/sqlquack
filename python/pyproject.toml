[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sqlquack"
description = "Check Snowflake SQL and convert it into DuckDB SQL, or refuse it with coded diagnostics."
requires-python = ">=3.12"
license = "Apache-2.0 AND MIT"
# Copies of the repository root files; `make distribution-notices` checks they match.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
dynamic = ["version"]
# The `sqlquack` command, as a native executable built from the same sources.
dependencies = ["sqlquack-cli==0.12.0"]  # x-release-please-version

[tool.maturin]
manifest-path = "../crates/sqlquack-python/Cargo.toml"
python-source = "src"
module-name = "sqlquack._native"
features = ["extension-module", "bundled"]
