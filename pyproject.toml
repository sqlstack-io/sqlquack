[project]
name = "sqlquack-workspace"
version = "0.0.0"
description = "Development tooling for SQLQuack: the recorder, repository checks and their tests."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "fensu>=0.27.0",
  "pytest>=8.4",
  "ruff>=0.12.0",
  "sqlquack-record",
  "ty>=0.0.1a19",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["recorder"]

[tool.uv.sources]
sqlquack-record = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["recorder/tests", "tests"]
addopts = "--import-mode=importlib"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PLR0913", "PLR0915", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sqlquack_record", "scripts", "tests", "recorder"]
