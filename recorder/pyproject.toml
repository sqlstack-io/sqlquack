[project]
name = "sqlquack-record"
version = "0.1.0"
description = "Records Snowflake results for SQLQuack's pending cases as Arrow IPC files."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pyarrow==23.0.1",
  "snowflake-connector-python[pandas,secure-local-storage]==4.7.2",
]

[project.scripts]
sqlquack-record = "sqlquack_record.cli.main._run_recorder:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlquack_record"]
