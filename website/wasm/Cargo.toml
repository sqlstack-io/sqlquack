[package]
name = "sqlquack-wasm"
description = "The SQLQuack playground's engine: the existing crates' parse, checks and conversion, for the browser."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Kept out of the SQLQuack workspace, as fuzz/ is: it builds for wasm32 only, from the website.
[workspace]
members = ["."]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlquack-core = { path = "../../crates/sqlquack-core" }
sqlquack-blocks = { path = "../../crates/sqlquack-blocks", default-features = false }
sqlquack-policy = { path = "../../crates/sqlquack-policy" }
sqlquack-rules = { path = "../../crates/sqlquack-rules", default-features = false }
sqlquack-semantics = { path = "../../crates/sqlquack-semantics" }
sqlquack-snowflake-types = { path = "../../crates/sqlquack-snowflake-types" }
sqlquack-syntax = { path = "../../crates/sqlquack-syntax", default-features = false }
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
