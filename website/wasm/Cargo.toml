[package]
name = "sqlquack-wasm"
description = "The SQLQuack playground's engine: the existing crates' parse, checks and conversion, for the browser."
version = "0.9.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Kept out of the SQLQuack workspace, as fuzz/ is: it builds for wasm32 only, from the website.
[workspace]
members = ["."]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlquack-format = { path = "../../crates/sqlquack-format", features = ["duckdb"] }
sqlquack-diagnostics = { path = "../../crates/sqlquack-diagnostics", features = ["snowflake"] }
sqlquack-parse = { path = "../../crates/sqlquack-parse" }
sqlquack-convert = { path = "../../crates/sqlquack-convert", features = ["snowflake"] }
sqlquack-blocks = { path = "../../crates/sqlquack-blocks", default-features = false }
sqlquack-policy = { path = "../../crates/sqlquack-policy" }
sqlquack-semantics = { path = "../../crates/sqlquack-semantics", features = ["snowflake"] }
sqlquack-syntax = { path = "../../crates/sqlquack-syntax", default-features = false }
wasm-bindgen = "=0.2.130"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
