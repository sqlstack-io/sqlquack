category = "translation"
construct = "sf.functions.dmf-null-percent"
session_profile = "utc-v1"

[[case]]
id = "t001_percent"
description = "One NULL among four values; the page does not say; the recording decides whether this reads 25 or 0.25. Catches: the NULL left out (0), or NULLs over non-NULLs (one third)"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'a'"],
  ["NULL"],
  ["'b'"],
  ["'c'"],
]
query = "SELECT SNOWFLAKE.CORE.NULL_PERCENT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_query"
description = "A column of only NULLs. Catches: 0 returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.NULL_PERCENT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["null"]
