category = "translation"
construct = "sf.functions.cast.cast-as"
session_profile = "utc-v1"

[[case]]
id = "t001_scale"
description = "Values with three fractional digits cast to NUMBER(5,1), including halves. Catches: truncation (1.2 for 1.25), or half-even rounding (1.2 for 1.25, -1.2 for -1.25)"
columns = [{ name = "x", type = "NUMBER(10,3)" }]
rows = [
  ["1.250"],
  ["-1.250"],
  ["1.349"],
]
query = "SELECT CAST(x AS NUMBER(5,1)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t002_float_to_integer"
description = "Floating-point halves cast to INTEGER. Catches: truncation toward zero, or half-even rounding (2 for 2.5)"
columns = [{ name = "f", type = "DOUBLE" }]
rows = [
  ["2.5"],
  ["-2.5"],
  ["3.5"],
]
query = "SELECT CAST(f AS INTEGER) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_text"
description = "Text cast to a date, a number with spaces around it, and a boolean spelled yes. The yes is documented under TO_BOOLEAN; whether the spaces are accepted the page does not say, so the recording decides. Catches: the yes rejected (only true and false accepted), or the spaced number handled differently from Snowflake"
columns = [{ name = "d", type = "VARCHAR" }, { name = "n", type = "VARCHAR" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'2024-02-29'", "' 12 '", "'yes'"],
]
query = "SELECT CAST(d AS DATE) AS d, CAST(n AS NUMBER) AS n, CAST(b AS BOOLEAN) AS b FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_precision"
description = "A value with more integer digits than the target precision, which the page says raises an error. Catches: the value rounded, truncated or returned as NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1234"],
]
query = "SELECT CAST(x AS NUMBER(3,0)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t005_null_source_expr"
description = "A NULL source. Catches: an error, or a default value such as 0"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT CAST(x AS NUMBER) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006_text_to_binary"
description = "Hex text in upper, lower and mixed case cast to BINARY under BINARY_INPUT_FORMAT HEX. Catches: the text's UTF-8 bytes taken instead of its hex digits, or case-sensitive hex"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'ABCD'"],
  ["'00ff10'"],
  ["'4a4B'"],
]
query = "SELECT CAST(v AS BINARY) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t007_binary_empty_and_null"
description = "Empty text and NULL cast to BINARY. Catches: empty text read as NULL, or NULL as empty"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["''"],
  ["NULL"],
]
query = "SELECT CAST(v AS BINARY) AS r, CAST(v AS BINARY) IS NULL AS n FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t008_binary_odd_length"
description = "Hex text of odd length cast to BINARY; no page says what an odd digit count does, so the receipt decides. Catches: a padded or truncated byte"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'ABC'"],
]
query = "SELECT CAST(v AS BINARY) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t009_binary_invalid_digit"
description = "Text with a non-hex character cast to BINARY. Catches: the character skipped or read as 0"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'0G'"],
]
query = "SELECT CAST(v AS BINARY) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t010_binary_length"
description = "Hex text of two and three bytes cast to BINARY(2), with its length; Snowflake raises for the three-byte value, failing the query. Catches: the excess bytes silently truncated, or the declared length ignored"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'ABCD'"],
  ["'ABCDEF'"],
]
query = "SELECT CAST(v AS BINARY(2)) AS r, LENGTH(CAST(v AS BINARY(2))) AS l FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t011_binary_to_binary_fits"
description = "A BINARY value cast to a BINARY(n) it fits, with its length. Catches: the bytes changed or re-read as hex text"
columns = [{ name = "b", type = "BINARY" }]
rows = [
  ["'AABB'"],
  ["NULL"],
]
query = "SELECT CAST(b AS BINARY(2)) AS r, LENGTH(CAST(b AS BINARY(2))) AS l FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t012_binary_to_shorter_binary"
description = "A three-byte BINARY value cast to BINARY(2); a BINARY value raises 100145 here, exactly as the cast of hex text does (t010). Catches: the excess byte silently truncated"
columns = [{ name = "b", type = "BINARY" }]
rows = [
  ["'AABBCC'"],
]
query = "SELECT CAST(b AS BINARY(2)) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
