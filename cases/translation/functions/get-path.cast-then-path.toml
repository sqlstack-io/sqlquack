category = "translation"
construct = "sf.functions.get-path.colon.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_variant_cast_then_path"
description = "A colon path directly after a ::VARIANT cast, without parentheses. Records whether Snowflake accepts it."
columns = [{ name = "k", type = "NUMBER(38,0)" }]
rows = [["1"]]
query = "SELECT PARSE_JSON('{\"city\":\"x\"}')::VARIANT:city AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_structured_object_cast_then_path"
description = "A colon path directly after a ::OBJECT(city VARCHAR) cast, without parentheses. Records whether Snowflake accepts it."
columns = [{ name = "k", type = "NUMBER(38,0)" }]
rows = [["1"]]
query = "SELECT OBJECT_CONSTRUCT('city', 'x')::OBJECT(city VARCHAR):city AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_parenthesised_structured_object_path"
description = "Control: the same structured OBJECT cast in parentheses, then the colon path."
columns = [{ name = "k", type = "NUMBER(38,0)" }]
rows = [["1"]]
query = "SELECT (OBJECT_CONSTRUCT('city', 'x')::OBJECT(city VARCHAR)):city AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]
