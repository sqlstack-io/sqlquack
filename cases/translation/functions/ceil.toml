category = "translation"
construct = "sf.functions.ceil"
session_profile = "utc-v1"

[[case]]
id = "t001-int"
description = "CEIL of integers with a negative scale. Catches: FLOOR or truncation used (CEIL(-2.5) is -2, CEIL(2.1) is 3); or a negative scale ignored"
columns = [{ name = "x", type = "NUMBER(38,0)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["1567", "-2"],
  ["-1567", "-2"],
  ["5", "0"],
]
query = "SELECT CEIL(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002-dec"
description = "CEIL of NUMBER(12,4) with and without a scale. Catches: FLOOR or truncation used (CEIL(-2.5) is -2, CEIL(2.1) is 3)"
columns = [{ name = "x", type = "NUMBER(12,4)" }]
rows = [
  ["2.1000"],
  ["-2.1000"],
  ["-2.5000"],
  ["2.7000"],
]
query = "SELECT CEIL(x) AS r, CEIL(x, 2) AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003-float"
description = "CEIL of FLOAT returns FLOAT. Catches: FLOOR or truncation used (CEIL(-2.5) is -2, CEIL(2.1) is 3); or a NUMBER returned"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["3.14159"],
  ["-3.14159"],
  ["-0.4"],
]
query = "SELECT CEIL(x) AS r, CEIL(x, 1) AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004-decfloat"
description = "CEIL of DECFLOAT returns DECFLOAT. Catches: computed in FLOAT"
columns = [{ name = "x", type = "DECFLOAT" }]
rows = [
  ["2.25"],
  ["-2.25"],
]
query = "SELECT CEIL(x, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005-null-x"
description = "CEIL of NULL. Catches: NULL turned into 0"
columns = [{ name = "x", type = "NUMBER(12,4)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "1"],
]
query = "SELECT CEIL(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006-null-scale"
description = "CEIL with a NULL scale. Catches: the NULL scale read as 0"
columns = [{ name = "x", type = "NUMBER(12,4)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["2.5555", "NULL"],
]
query = "SELECT CEIL(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007-scale-past"
description = "Scales past the input scale and far negative. Catches: scale capped or wrapping"
columns = [{ name = "x", type = "NUMBER(12,4)" }, { name = "s", type = "NUMBER(38,0)" }]
rows = [
  ["12.3456", "6"],
  ["12.3456", "-5"],
  ["-987.6543", "3"],
]
query = "SELECT CEIL(x, s) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t008-negatives"
description = "Negative values at the rounding step. Catches: FLOOR or truncation used (CEIL(-2.5) is -2, CEIL(2.1) is 3)"
columns = [{ name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["-2.15"],
  ["-0.01"],
]
query = "SELECT CEIL(x, 1) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
