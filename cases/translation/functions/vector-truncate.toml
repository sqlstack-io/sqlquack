category = "translation"
construct = "sf.functions.vector-truncate"
session_profile = "utc-v1"

[[case]]
id = "t001_truncate"
description = "Truncation to 2 elements, which the page says are not normalised. Catches: the result normalised, or the last elements kept"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[3,4,12]'"],
]
query = "SELECT VECTOR_TRUNCATE(CAST(PARSE_JSON(a)::ARRAY AS VECTOR(FLOAT, 3)), 2)::ARRAY AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_too_long"
description = "A dimension larger than the vector, which the page says is an error. Catches: the vector returned unchanged, or padded"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[3,4,12]'"],
]
query = "SELECT VECTOR_TRUNCATE(CAST(PARSE_JSON(a)::ARRAY AS VECTOR(FLOAT, 3)), 4)::ARRAY AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_null_vector"
description = "A NULL vector and a NULL dimension, which the page says give NULL. Catches: an error, or the vector returned unchanged"
columns = [{ name = "a", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["NULL", "2"],
  ["'[1,2,3]'", "NULL"],
]
query = "SELECT ordinal, VECTOR_TRUNCATE(CAST(PARSE_JSON(a)::ARRAY AS VECTOR(FLOAT, 3)), n) IS NULL AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
