category = "translation"
construct = "sf.functions.format-string-template"
session_profile = "utc-v1"

[[case]]
id = "t001_examples"
description = "The page's examples: one value, two values in order, and {:.2f} on 3.14159. Catches: the values substituted in reverse, or the precision ignored"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT FORMAT_STRING_TEMPLATE('Hello, {}!', 'World') AS a, FORMAT_STRING_TEMPLATE('{} has {} apples', 'Alice', 5) AS b, FORMAT_STRING_TEMPLATE('Pi is approximately {:.2f}', 3.14159) AS c FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_columns"
description = "The page's table example, with values from columns. Catches: the decimal printed without two places"
columns = [{ name = "n", type = "VARCHAR" }, { name = "p", type = "NUMBER(10,2)" }, { name = "q", type = "NUMBER(38,0)" }]
rows = [
  ["'Widget'", "19.99", "100"],
  ["'Gadget'", "49.95", "50"],
]
query = "SELECT ordinal, FORMAT_STRING_TEMPLATE('Product: {} - Price: ${:.2f} - Stock: {}', n, p, q) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_count_mismatch"
description = "Two placeholders and one value, which the page says is an error. Catches: the missing value left empty, or the placeholder kept"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT FORMAT_STRING_TEMPLATE('{} and {}', 'one') AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t004_locale_flag"
description = "The {:L} flag, which the page says is an error. Catches: the flag ignored"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT FORMAT_STRING_TEMPLATE('{:L}', 5) AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t005_null_value1"
description = "A NULL value; the page does not say; the recording decides. Catches: an error, or an empty substitution where Snowflake prints something else"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT FORMAT_STRING_TEMPLATE('[{}]', v) AS r FROM input"
order = "ordered"
tags = ["null"]
