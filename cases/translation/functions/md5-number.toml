category = "translation"
construct = "sf.functions.md5-number"
session_profile = "utc-v1"

[[case]]
id = "t001_signed"
description = "The page example (negative) and two strings whose digests read as positive and negative 128-bit integers within 38 digits. Catches: the digest read as unsigned, or as the first 64 bits"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'Snowflake'"],
  ["'a'"],
  ["'e'"],
]
query = "SELECT ordinal, MD5_NUMBER(v) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_out_of_range"
description = "abc, whose digest as a signed integer has 39 digits, outside NUMBER(38,0) as the page warns; the page does not say; the recording decides whether this errors. Catches: the value truncated to 38 digits"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'abc'"],
]
query = "SELECT MD5_NUMBER(v)::VARCHAR AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_msg"
description = "A NULL message; the page does not say; the recording decides. Catches: the digest of an empty string returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT MD5_NUMBER(v) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
