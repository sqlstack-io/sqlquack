category = "translation"
construct = "sf.functions.md5-number"
session_profile = "utc-v1"

[[case]]
id = "t001_signed"
compile_error = true
description = "The page example and two other strings; Snowflake reports MD5_NUMBER as an unknown function (2139) when compiling. Catches: the function accepted, with the digest computed as a signed integer"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'Snowflake'"],
  ["'a'"],
  ["'e'"],
]
query = "SELECT ordinal, MD5_NUMBER(v) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]

[[case]]
id = "t002_out_of_range"
compile_error = true
description = "abc, whose digest as a signed integer has 39 digits; Snowflake reports MD5_NUMBER as an unknown function (2139) when compiling. Catches: the function accepted, or the value truncated to 38 digits"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'abc'"],
]
query = "SELECT MD5_NUMBER(v)::VARCHAR AS r FROM input"
order = "ordered"
tags = ["error"]

[[case]]
id = "t003_null_msg"
compile_error = true
description = "A NULL message; Snowflake reports MD5_NUMBER as an unknown function (2139) when compiling. Catches: the function accepted"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT MD5_NUMBER(v) IS NULL AS n FROM input"
order = "ordered"
tags = ["error", "null"]
