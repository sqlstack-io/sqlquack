category = "translation"
construct = "sf.functions.dmf-null-count"
session_profile = "utc-v1"

[[case]]
id = "t001_count"
description = "Two NULLs among four values, one of them an empty string. Catches: the empty string counted as NULL, or non-NULL values counted"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'a'"],
  ["NULL"],
  ["''"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.NULL_COUNT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_number"
description = "One NULL among three numbers. Catches: NUMBER columns rejected"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["0"],
  ["NULL"],
  ["2"],
]
query = "SELECT SNOWFLAKE.CORE.NULL_COUNT(SELECT x FROM input) AS r"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_query"
description = "A column of only NULLs, all counted. Catches: 0 returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.NULL_COUNT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["null"]
