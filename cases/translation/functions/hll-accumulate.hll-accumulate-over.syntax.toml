category = "translation"
construct = "sf.functions.hll-accumulate.hll-accumulate-over.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_star"
description = "Distinct whole rows per partition. Catches: rows counted, or the partition column left out"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'p'", "1", "'y'"],
  ["'p'", "2", "'x'"],
  ["'p'", "1", "'x'"],
  ["'q'", "1", "'x'"],
]
query = "SELECT g, a, b, HLL_ESTIMATE(HLL_ACCUMULATE(*) OVER (PARTITION BY g)) AS r FROM (SELECT g, a, b FROM input) ORDER BY g, a, b"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr1"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["NULL", "1", "'x'"],
  ["'p'", "1", "'x'"],
  ["NULL", "2", "'x'"],
]
query = "SELECT g, a, HLL_ESTIMATE(HLL_ACCUMULATE(*) OVER (PARTITION BY g)) AS r FROM (SELECT g, a FROM input) ORDER BY g, a"
order = "ordered"
tags = ["null"]
