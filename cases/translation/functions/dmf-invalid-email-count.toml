category = "translation"
construct = "sf.functions.dmf-invalid-email-count"
session_profile = "utc-v1"

[[case]]
id = "t001_count"
description = "Valid a.b@example.com and x+y@sub.example.org; invalid no-at, a..b@example.com (empty segment) and a@example.c (one-letter final label); and a NULL: 3 invalid. Catches: NULL counted, empty local segments accepted, or a one-letter final label accepted"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'a.b@example.com'"],
  ["'x+y@sub.example.org'"],
  ["'no-at'"],
  ["'a..b@example.com'"],
  ["'a@example.c'"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.INVALID_EMAIL_COUNT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_query"
description = "Only NULLs, which the page says are not counted. Catches: NULL counted as invalid"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.INVALID_EMAIL_COUNT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["null"]
