category = "translation"
construct = "sf.functions.map-pick"
session_profile = "utc-v1"

[[case]]
id = "t001_keys"
description = "Keys as arguments, one of them absent. Catches: an error for the absent key"
columns = [{ name = "k", type = "VARCHAR" }]
rows = [
  ["'z'"],
]
query = "SELECT MAP_PICK(MAP_CONSTRUCT('a', 1, 'b', 2), 'b', k)::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_array"
description = "Keys as a semi-structured ARRAY. Catches: the array read as one key"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'[\"a\",\"b\"]'"],
]
query = "SELECT MAP_PICK(MAP_CONSTRUCT('a', 1, 'b', 2, 'c', 3), PARSE_JSON(a))::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_map"
description = "A NULL key; the page does not say; the recording decides. Catches: an error"
columns = [{ name = "k", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT MAP_PICK(MAP_CONSTRUCT('a', 1, 'b', 2), k)::VARIANT AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
