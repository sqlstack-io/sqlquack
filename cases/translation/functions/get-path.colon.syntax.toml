category = "translation"
construct = "sf.functions.get-path.colon.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_paths"
description = "Dotted and indexed paths through the function-call spelling, beside GET_PATH and the colon operator on the same value; the page says the three are the same extraction, and an index is 0-based. Catches: a 1-based index, or the call spelling read as another function"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":{\"b\":[10,20]}}'"],
  ["'{\"a\":{\"b\":[30]}}'"],
]
query = "SELECT ordinal, :(v, 'a.b[1]') AS call_form, GET_PATH(v, 'a.b[1]') AS get_path, v:a.b[1] AS colon, :(v, 'a.b[0]') AS first FROM (SELECT ordinal, PARSE_JSON(a) AS v FROM input) ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_page_example"
description = "The page's example path array2[0].id3 gives \"value_b3\" for its first row. Catches: the path read as one field name, so NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"array2\":[{\"id1\":\"value_b1\",\"id3\":\"value_b3\"}]}'"],
]
query = "SELECT ordinal, :(v, 'array2[0].id3') AS r FROM (SELECT ordinal, PARSE_JSON(a) AS v FROM input) ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_no_match"
description = "The page: GET_PATH returns NULL if the path name does not correspond to any element; an index past the end and a missing field both match nothing. Catches: an error instead of NULL, or the last element returned for an index past the end"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":{\"b\":[10,20]}}'"],
]
query = "SELECT ordinal, :(v, 'a.b[5]') AS past_end, :(v, 'a.c') AS missing FROM (SELECT ordinal, PARSE_JSON(a) AS v FROM input) ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t004_null"
description = "A NULL value through the call spelling; GET_PATH of NULL gives NULL, and the page gives no other rule. Catches: an error, or a JSON null instead of SQL NULL"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'{\"a\":1}'"],
]
query = "SELECT ordinal, :(v, 'a') AS r, :(v, 'a') IS NULL AS missing FROM (SELECT ordinal, PARSE_JSON(a) AS v FROM input) ORDER BY ordinal"
order = "ordered"
tags = ["null"]
