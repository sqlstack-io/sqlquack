category = "translation"
construct = "sf.functions.get-path.colon.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_syntax_error"
compile_error = true
description = "Snowflake refuses the documented spelling at parse time with 1003 (42000), unexpected '(' right after the colon, with or without spaces; only a quoted function name, \":\"(v, 'path'), compiles, and the page does not document that. The obligation is to refuse it as Snowflake does. Catches: the spelling accepted and translated as GET_PATH"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'{\"a\":{\"b\":[10,20]}}'"],
  ["NULL"],
]
query = "SELECT ordinal, :(v, 'a.b[1]') AS r FROM (SELECT ordinal, PARSE_JSON(a) AS v FROM input) ORDER BY ordinal"
order = "ordered"
tags = ["error", "null"]
