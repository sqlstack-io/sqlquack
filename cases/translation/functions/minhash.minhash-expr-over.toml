category = "translation"
construct = "sf.functions.minhash.minhash-expr-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "States per partition: p and q equal as sets. Catches: the whole input's state"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT MINHASH(100, a) OVER (PARTITION BY g) AS m FROM input WHERE g IN ('p', 'q'))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_disjoint"
description = "Partitions p and r share no value. Catches: every pair similar"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT MINHASH(100, a) OVER (PARTITION BY g) AS m FROM input WHERE g IN ('p', 'r'))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr1"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["NULL", "1", "'x'"],
  ["'p'", "1", "'x'"],
  ["NULL", "2", "'y'"],
  ["'p'", "2", "'y'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT MINHASH(100, a) OVER (PARTITION BY g) AS m FROM input)"
order = "ordered"
tags = ["null"]
