category = "translation"
construct = "sf.functions.dmf-zero-count"
session_profile = "utc-v1"

[[case]]
id = "t001_count"
description = "Zero, 0.000 written with a scale, a small non-zero 0.001 and a NULL: 2. Catches: the NULL counted as zero, or 0.001 rounded to zero"
columns = [{ name = "x", type = "NUMBER(38,3)" }]
rows = [
  ["0"],
  ["0.000"],
  ["0.001"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.ZERO_COUNT(SELECT x FROM input) AS r"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_query"
description = "Only NULLs, which are not zero. Catches: NULL counted as zero"
columns = [{ name = "x", type = "NUMBER(38,3)" }]
rows = [
  ["NULL"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.ZERO_COUNT(SELECT x FROM input) AS r"
order = "ordered"
tags = ["null"]
