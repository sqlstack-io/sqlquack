category = "translation"
construct = "sf.functions.square"
session_profile = "utc-v1"

[[case]]
id = "t001-int"
description = "SQUARE of integers returns FLOAT. Catches: x*x kept as NUMBER (the type differs), or SQRT computed"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["-3"],
  ["12"],
]
query = "SELECT SQUARE(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002-dec"
description = "SQUARE of NUMBER(10,2). Catches: the result left fixed-point"
columns = [{ name = "x", type = "NUMBER(10,2)" }]
rows = [
  ["1.50"],
  ["-0.25"],
]
query = "SELECT SQUARE(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003-float"
description = "SQUARE of FLOAT. Catches: SQRT computed"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["0.1"],
  ["-2.5"],
]
query = "SELECT SQUARE(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004-decfloat"
description = "SQUARE of DECFLOAT returns DECFLOAT. Catches: computed in FLOAT"
columns = [{ name = "x", type = "DECFLOAT" }]
rows = [
  ["1.1"],
  ["-3"],
]
query = "SELECT SQUARE(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005-null"
description = "SQUARE of NULL. Catches: NULL turned into 0"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["NULL"],
]
query = "SELECT SQUARE(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t006-overflow-inf"
description = "Squares past the double range. Catches: infinity versus error"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["1e200"],
  ["-1e155"],
]
query = "SELECT SQUARE(x) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]
