category = "translation"
construct = "sf.functions.hll-estimate.hll-estimate-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "Two overlapping states ({1, 2} and {2, 3}) in one partition. Catches: the partition's estimates summed (4)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT g, HLL_ESTIMATE(st) OVER (PARTITION BY k) AS r FROM (SELECT g, 1 AS k, st FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g)) ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_state"
description = "A NULL state in the partition. Catches: the result NULL for every row"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "1"],
  ["'q'", "2"],
  ["'p'", "2"],
  ["'q'", "3"],
  ["'p'", "2"],
]
query = "SELECT HLL_ESTIMATE(st) OVER () AS r FROM (SELECT st FROM (SELECT g, HLL_ACCUMULATE(x) AS st FROM input GROUP BY g) UNION ALL SELECT NULL) ORDER BY r"
order = "ordered"
tags = ["null"]
