category = "translation"
construct = "sf.functions.st-centroid"
session_profile = "utc-v1"

[[case]]
id = "t001_geometry"
description = "A square, and a collection of the square and a far point, whose point the page says is ignored; the SRID is kept. Catches: the point averaged in, or the SRID dropped"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'POLYGON((0 0,10 0,10 10,0 10,0 0))'"],
  ["'GEOMETRYCOLLECTION(POLYGON((0 0,10 0,10 10,0 10,0 0)),POINT(100 100))'"],
]
query = "SELECT ordinal, ST_X(ST_CENTROID(TO_GEOMETRY(v, 3857))) AS x, ST_Y(ST_CENTROID(TO_GEOMETRY(v, 3857))) AS y, ST_SRID(ST_CENTROID(TO_GEOMETRY(v, 3857))) AS srid FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_geography"
description = "A line string along the equator, whose centre is (5 0), rounded to 6 places. Catches: the first vertex returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'LINESTRING(0 0,10 0)'"],
]
query = "SELECT ROUND(ST_X(ST_CENTROID(TO_GEOGRAPHY(v))), 6) AS x, ROUND(ST_Y(ST_CENTROID(TO_GEOGRAPHY(v))), 6) AS y FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_geography_or_geometry_expression"
description = "A NULL shape, which the page says gives NULL. Catches: an error, or an empty point returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT ST_CENTROID(TO_GEOGRAPHY(v)) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
