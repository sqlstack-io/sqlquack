category = "translation"
construct = "sf.functions.collation"
session_profile = "utc-v1"

[[case]]
id = "t001_collated"
description = "COLLATION of a collated and an uncollated string. Catches: a fixed or empty answer, or the collation of the wrong operand"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["'x'"],
]
query = "SELECT COLLATION(COLLATE(a, 'de-ci')) AS r, COLLATION(a) AS u FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expression"
description = "NULL collated value. Catches: NULL propagated (NULL instead of 'de')"
columns = [{ name = "a", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["'y'"],
]
query = "SELECT COLLATION(COLLATE(a, 'de')) AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
