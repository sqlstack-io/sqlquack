category = "translation"
construct = "sf.functions.seq1.seq4"
session_profile = "utc-v1"

[[case]]
id = "t001_sequence"
description = "SEQ4 over GENERATOR rows: starting value, count of distinct values and type. Catches: a sequence starting at 1, or repeated values"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MIN(SEQ4()) AS lo, COUNT(DISTINCT SEQ4()) AS n FROM TABLE(GENERATOR(ROWCOUNT => 5))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_sign"
description = "SEQ4(1) before any wrap-around, which starts at 0 like SEQ4(0). Catches: a signed sequence starting at the smallest value"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MIN(SEQ4(1)) AS lo, MAX(SEQ4(1)) AS hi FROM TABLE(GENERATOR(ROWCOUNT => 5))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_sign"
description = "A NULL sign argument; the page does not say; the recording decides. Catches: the default sign used where Snowflake raises an error, or the reverse"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT MIN(SEQ4(NULL)) AS lo FROM TABLE(GENERATOR(ROWCOUNT => 3))"
order = "ordered"
tags = ["null"]
