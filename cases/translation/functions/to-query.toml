category = "translation"
construct = "sf.functions.to-query"
session_profile = "utc-v1"

[[case]]
id = "t001_query"
description = "A query text with two columns, read back from the FROM clause. Catches: the text returned as a string"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT a, b FROM TABLE(TO_QUERY('SELECT 1 AS a, ''x'' AS b'))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_bind"
description = "A bind variable converted with TO_NUMBER, as in the page example. Catches: the bind variable left unsubstituted"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT a FROM TABLE(TO_QUERY('SELECT TO_NUMBER(:n) + 1 AS a', n => '41'))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_arg"
description = "A NULL bind argument, typed as VARCHAR because a bare NULL is refused as not a string; the page says \"If any argument is NULL, the function returns NULL without reporting any error\"; the page does not say; the recording decides on how a NULL result set reads. Catches: an error raised"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT COUNT(*) AS n FROM TABLE(TO_QUERY('SELECT TO_NUMBER(:n) AS a', n => NULL::VARCHAR))"
order = "ordered"
tags = ["null"]
