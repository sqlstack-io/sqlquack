category = "translation"
construct = "sf.functions.bitxor-agg.bitxor-agg"
session_profile = "utc-v1"

[[case]]
id = "t001_number"
description = "12, 10 and 14 per group (1100, 1010, 1110). Catches: another bitwise operator"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "12"],
  ["'q'", "6"],
  ["'p'", "10"],
  ["'q'", "3"],
  ["'p'", "14"],
]
query = "SELECT g, BITXOR_AGG(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_negative"
description = "A negative value in two's complement. Catches: the sign dropped (abs value) or a NUMBER(38) treated as unsigned"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["-6"],
  ["13"],
]
query = "SELECT BITXOR_AGG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_decimal"
description = "Halves, rounded to the nearest integer (half away from zero) before the operation. Catches: truncation (2.5 to 2) or half-to-even rounding"
columns = [{ name = "x", type = "NUMBER(10,1)" }]
rows = [
  ["2.5"],
  ["5.5"],
]
query = "SELECT BITXOR_AGG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_float"
description = "FLOAT values just below and above a half. Catches: truncation instead of rounding"
columns = [{ name = "x", type = "FLOAT" }]
rows = [
  ["6.7"],
  ["1.2"],
]
query = "SELECT BITXOR_AGG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_varchar"
description = "Numeric text and text that cannot be cast, which the page says is treated as NULL. Catches: an error for the text x, or text read as 0"
columns = [{ name = "x", type = "VARCHAR" }]
rows = [
  ["'6.6'"],
  ["'x'"],
  ["'3'"],
]
query = "SELECT BITXOR_AGG(x) AS r FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_null_expr1"
description = "NULL rows beside values, and a group of only NULL. Catches: NULL read as 0 (changing AND), or the NULL group 0"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'p'", "NULL"],
  ["'q'", "NULL"],
  ["'p'", "7"],
  ["'p'", "5"],
]
query = "SELECT g, BITXOR_AGG(x) AS r FROM input GROUP BY g ORDER BY g"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_empty_input"
description = "No rows. Catches: 0 or -1 instead of NULL"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT BITXOR_AGG(x) AS r FROM input WHERE ordinal < 0"
order = "ordered"
tags = ["empty-input"]

[[case]]
id = "t008_distinct"
description = "DISTINCT on a repeated value: 3 ^ 5 = 6, against 3 ^ 3 ^ 5 = 5. Catches: DISTINCT ignored"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["3"],
  ["3"],
  ["5"],
]
query = "SELECT BITXOR_AGG(DISTINCT x) AS r, BITXOR_AGG(x) AS p FROM input"
order = "ordered"
tags = ["duplicates"]
