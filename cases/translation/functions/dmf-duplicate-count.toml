category = "translation"
construct = "sf.functions.dmf-duplicate-count"
session_profile = "utc-v1"

[[case]]
id = "t001_count"
description = "a three times, b once and NULL twice; the page does not say; the recording decides whether repeated values count once, every copy, or every extra copy. Catches: the NULL pair left out"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'a'"],
  ["'a'"],
  ["'a'"],
  ["'b'"],
  ["NULL"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.DUPLICATE_COUNT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_query"
description = "Only NULLs, which the page says are counted as duplicates. Catches: 0 returned"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.DUPLICATE_COUNT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["null"]
