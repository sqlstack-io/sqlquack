category = "translation"
construct = "sf.functions.approx-count-distinct.approx-count-distinct-over.syntax"
session_profile = "utc-v1"

[[case]]
id = "t001_star"
description = "Distinct whole rows per partition (the partition column included), one with NULL. Catches: rows counted instead of distinct rows, or rows with a NULL counted"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'p'", "1", "'y'"],
  ["'p'", "2", "'x'"],
  ["'p'", "1", "'x'"],
  ["'p'", "3", "NULL"],
  ["'q'", "1", "'x'"],
]
query = "SELECT g, a, b, APPROX_COUNT_DISTINCT(*) OVER (PARTITION BY g) AS r FROM (SELECT g, a, b FROM input) ORDER BY g, a, b"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_star_empty_over"
description = "An empty OVER clause. Catches: a running count"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'p'", "1", "'y'"],
  ["'p'", "2", "'x'"],
  ["'p'", "1", "'x'"],
  ["'p'", "3", "NULL"],
]
query = "SELECT a, b, APPROX_COUNT_DISTINCT(*) OVER () AS r FROM (SELECT a, b FROM input) ORDER BY a, b"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_expr2"
description = "NULL partition keys. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["NULL", "1", "'x'"],
  ["'p'", "1", "'x'"],
  ["NULL", "2", "'x'"],
]
query = "SELECT g, a, APPROX_COUNT_DISTINCT(*) OVER (PARTITION BY g) AS r FROM (SELECT g, a FROM input) ORDER BY g, a"
order = "ordered"
tags = ["null"]
