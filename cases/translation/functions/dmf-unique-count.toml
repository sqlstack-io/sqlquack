category = "translation"
construct = "sf.functions.dmf-unique-count"
session_profile = "utc-v1"

[[case]]
id = "t001_count"
description = "a twice, b, c and two NULLs: 3 unique non-NULL values. Catches: NULL counted as a value (4), or only values occurring once counted (2)"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["'a'"],
  ["'a'"],
  ["'b'"],
  ["'c'"],
  ["NULL"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.UNIQUE_COUNT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_query"
description = "Only NULLs, which leave no unique non-NULL value. Catches: NULL counted as one value"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.UNIQUE_COUNT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["null"]
