category = "translation"
construct = "sf.functions.getvariable"
session_profile = "utc-v1"

[[case]]
id = "t001_unset"
description = "A variable name that no SET statement defined; the page does not say; the recording decides whether this is NULL or an error. Catches: NULL where Snowflake raises an error, or the reverse"
columns = [{ name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT GETVARIABLE('SQLQUACK_UNSET_VARIABLE') IS NULL AS n FROM input"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_name"
description = "A NULL name; the page does not say; the recording decides. Catches: an error where Snowflake returns NULL, or the reverse"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
]
query = "SELECT GETVARIABLE(v) IS NULL AS n FROM input"
order = "ordered"
tags = ["null"]
