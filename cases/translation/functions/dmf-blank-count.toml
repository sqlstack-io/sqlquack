category = "translation"
construct = "sf.functions.dmf-blank-count"
session_profile = "utc-v1"

[[case]]
id = "t001_count"
description = "An empty string, three spaces, ' a ' and a NULL: 2 blank. Catches: spaces not counted, or NULL counted"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["''"],
  ["'   '"],
  ["' a '"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.BLANK_COUNT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_query"
description = "Only NULLs, which the page says are not blank. Catches: NULL counted as blank"
columns = [{ name = "v", type = "VARCHAR" }]
rows = [
  ["NULL"],
  ["NULL"],
]
query = "SELECT SNOWFLAKE.CORE.BLANK_COUNT(SELECT v FROM input) AS r"
order = "ordered"
tags = ["null"]
