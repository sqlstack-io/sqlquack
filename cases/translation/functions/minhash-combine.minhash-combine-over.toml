category = "translation"
construct = "sf.functions.minhash-combine.minhash-combine-over"
session_profile = "utc-v1"

[[case]]
id = "t001_partition"
description = "States merged per partition, then compared with the state of the union. Catches: only one state kept"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT MINHASH_COMBINE(m) OVER (PARTITION BY k) AS m FROM (SELECT 1 AS k, m FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'r')) UNION ALL SELECT MINHASH(100, a) FROM input WHERE g IN ('p', 'r'))"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_expr"
description = "A NULL partition key. Catches: NULL-keyed rows split or dropped"
columns = [{ name = "g", type = "VARCHAR" }, { name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "VARCHAR" }]
rows = [
  ["'p'", "1", "'x'"],
  ["'q'", "2", "'y'"],
  ["'p'", "2", "'y'"],
  ["'q'", "1", "'x'"],
  ["'r'", "7", "'z'"],
]
query = "SELECT APPROXIMATE_SIMILARITY(m) AS r FROM (SELECT MINHASH_COMBINE(m) OVER (PARTITION BY k) AS m FROM (SELECT NULL AS k, m FROM (SELECT g, MINHASH(100, a) AS m FROM input GROUP BY g) WHERE g IN ('p', 'r')) UNION ALL SELECT MINHASH(100, a) FROM input WHERE g IN ('p', 'r'))"
order = "ordered"
tags = ["null"]
