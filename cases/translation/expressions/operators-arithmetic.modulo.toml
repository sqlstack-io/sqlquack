category = "translation"
construct = "sf.expressions.operators-arithmetic.modulo"
session_profile = "utc-v1"

[[case]]
id = "t001-num-num-380380"
description = "a NUMBER(38,0) % b NUMBER(38,0). Catches: floor-based modulo (2 instead of -1): MOD truncates toward zero"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["-7", "3"],
  ["7", "-3"],
  ["7", "3"],
]
query = "SELECT a % b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002-num-num-102380"
description = "a NUMBER(10,2) % b NUMBER(38,0). Catches: fractional remainder dropped"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["7.50", "2"],
  ["-7.50", "2"],
]
query = "SELECT a % b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003-num-num-102124"
description = "a NUMBER(10,2) % b NUMBER(12,4). Catches: result scale taken from one operand"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(12,4)" }]
rows = [
  ["5.25", "1.1000"],
  ["-0.75", "0.5000"],
]
query = "SELECT a % b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004-num-float-380"
description = "a NUMBER(38,0) % b FLOAT. Catches: FLOAT divisor rounded"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "FLOAT" }]
rows = [
  ["7", "2.5"],
  ["-7", "2.5"],
]
query = "SELECT a % b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005-float-float-"
description = "a FLOAT % b FLOAT. Catches: floor-based float modulo"
columns = [{ name = "a", type = "FLOAT" }, { name = "b", type = "FLOAT" }]
rows = [
  ["5.5", "2"],
  ["-5.5", "2"],
]
query = "SELECT a % b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006-null-a"
description = "NULL as a, the other operand set. Catches: NULL treated as 0"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["NULL", "3.00"],
]
query = "SELECT a % b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007-null-b"
description = "NULL as b, the other operand set. Catches: NULL treated as 0"
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["3.00", "NULL"],
]
query = "SELECT a % b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]

[[case]]
id = "t008-both-negative"
description = "Both operands negative. Catches: sign of the remainder taken from the divisor"
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["-7", "-3"],
  ["-1", "-5"],
]
query = "SELECT a % b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["boundary"]

[[case]]
id = "t009-mod-text"
description = "A non-numeric string operand. Catches: the string silently read as 0 instead of the conversion error"
columns = [{ name = "a", type = "VARCHAR" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [
  ["'abc'", "3"],
]
query = "SELECT a % b AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["error"]
