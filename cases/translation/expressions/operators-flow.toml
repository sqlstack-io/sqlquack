category = "translation"
construct = "sf.expressions.operators-flow"
session_profile = "utc-v1"

[[case]]
id = "t001_two_statements"
description = "The second statement reads the first, filtered, result; $1 and $2 in its SELECT list are the columns of that result, as the page says for its row-count example. Catches: the first statement's filter lost, or $n in the SELECT list read as a pipe reference"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
  ["3"],
]
query = "SELECT ordinal, a FROM input WHERE a > 1 ->> SELECT $1 AS o, $2 * 10 AS b FROM $1 ORDER BY o"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_counts_back"
description = "In the last of three statements, $2 is the first statement and $1 the second, counting back as the page shows. Catches: pipe numbers counted forward from the first statement, so $1 and $2 swap"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["4"],
  ["5"],
  ["6"],
]
query = "SELECT ordinal, a FROM input ->> SELECT COUNT(*) AS n FROM $1 ->> SELECT ordinal, a, (SELECT n FROM $1) AS n FROM $2 ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null"
description = "A NULL value read through a pipe reference; the page says the consumed result equals RESULT_SCAN of the earlier statement, so the NULL is kept. Catches: the NULL row dropped or its value replaced"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT ordinal, a FROM input ->> SELECT ordinal, a, a IS NULL AS missing FROM $1 ORDER BY ordinal"
order = "ordered"
tags = ["null"]
