category = "translation"
construct = "sf.expressions.session-variables"
session_profile = "utc-v1"

[[case]]
id = "t001_between"
setup = ["SET (min, max) = (40, 70)"]
description = "The page's example: two variables set in one statement bound a BETWEEN, so 40, 55 and 70 are kept. Catches: the variables read as text so the comparison is lexical, or only the first of the pair set"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["30"],
  ["40"],
  ["55"],
  ["70"],
  ["80"],
]
query = "SELECT ordinal, a FROM input WHERE a BETWEEN $min AND $max ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_types"
setup = ["SET my_variable1 = 10", "SET my_variable2 = 'example'"]
description = "The page's SET my_variable1 = 10 and SET my_variable2 = 'example': a number adds to a column and the text concatenates; the type comes from the expression. Catches: the number variable read as text (concatenated), or the text quoted twice"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
]
query = "SELECT ordinal, a + $my_variable1 AS n, $my_variable2 || '-' || a AS s FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_case_insensitive"
setup = ["SET MyVar = 5"]
description = "The page: SQL variables are identified by case-insensitive names. Catches: the name matched case-sensitively, so $myvar is unknown"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
]
query = "SELECT ordinal, $myvar + a AS r1, $MYVAR AS r2 FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_from_query"
setup = ["CREATE TABLE sv_src (k NUMBER(38,0))", "INSERT INTO sv_src VALUES (3), (7)", "SET top = (SELECT MAX(k) FROM sv_src)"]
description = "The page: a variable can be set from a query that returns a single result; here MAX over a table the setup creates, which is 7. Catches: the subquery stored as text, or evaluated per row"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["1"],
  ["2"],
]
query = "SELECT ordinal, a * $top AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t005_null"
setup = ["SET n = 10"]
description = "A NULL column added to a variable; the page gives no special rule, so standard NULL handling gives NULL. Catches: the NULL replaced by the variable"
columns = [{ name = "a", type = "NUMBER(38,0)" }]
rows = [
  ["NULL"],
  ["2"],
]
query = "SELECT ordinal, a + $n AS r FROM input ORDER BY ordinal"
order = "ordered"
tags = ["null"]
