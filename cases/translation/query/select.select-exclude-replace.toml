category = "translation"
construct = "sf.query.select.select-exclude-replace"
session_profile = "utc-v1"

[[case]]
id = "t001_exclude_replace"
description = "department_id excluded and last_name replaced by its upper case, in place. Catches: the replaced column moved to the end, or added twice"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * EXCLUDE department_id REPLACE (UPPER(last_name) AS last_name) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_values"
description = "REPLACE over the NULL first name: the expression gets NULL. Catches: NULL replaced by an empty string"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * EXCLUDE department_id REPLACE (first_name || '!' AS first_name) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["null"]
