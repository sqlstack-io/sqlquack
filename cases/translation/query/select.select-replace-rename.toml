category = "translation"
construct = "sf.query.select.select-replace-rename"
session_profile = "utc-v1"

[[case]]
id = "t001_replace_rename"
description = "department_id doubled, then employee_id renamed id. Catches: the modifiers swapped"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * REPLACE (department_id * 2 AS department_id) RENAME (employee_id AS id) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_values"
description = "The NULL department plus 1 stays NULL; first_name renamed. Catches: NULL read as 0"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * REPLACE (department_id + 1 AS department_id) RENAME (first_name AS fn) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["null"]
