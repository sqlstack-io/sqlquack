category = "translation"
construct = "sf.query.select.select-exclude-rename"
session_profile = "utc-v1"

[[case]]
id = "t001_exclude_rename"
description = "department_id excluded and first_name renamed fn. Catches: RENAME applied before EXCLUDE, or the renamed column moved"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * EXCLUDE department_id RENAME (first_name AS fn) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_values"
description = "Row 104 holds a NULL first name and department, which the modifiers pass through unchanged. Catches: the NULL first name dropped with the rename"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * EXCLUDE department_id RENAME (first_name AS fn) FROM input ORDER BY employee_id DESC"
order = "ordered"
tags = ["null"]
