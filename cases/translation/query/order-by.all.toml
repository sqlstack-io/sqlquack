category = "translation"
construct = "sf.query.order-by.all"
session_profile = "utc-v1"

[[case]]
id = "t001_all_desc"
description = "ORDER BY ALL DESC over (s, n): s first, then n, both descending, NULL first by default. Catches: only the first column ordered, or ASC applied"
columns = [{ name = "s", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'b'", "2"],
  ["'B'", "10"],
  ["'a'", "NULL"],
  ["'ab'", "-1"],
  ["NULL", "2"],
]
query = "SELECT s, n FROM input ORDER BY ALL DESC"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_nulls_last"
description = "ORDER BY ALL ASC NULLS LAST. Catches: the NULLS clause ignored"
columns = [{ name = "s", type = "VARCHAR" }, { name = "n", type = "NUMBER(38,0)" }]
rows = [
  ["'b'", "2"],
  ["'B'", "10"],
  ["'a'", "NULL"],
  ["'ab'", "-1"],
  ["NULL", "2"],
]
query = "SELECT s, n FROM input ORDER BY ALL ASC NULLS LAST"
order = "ordered"
tags = ["null"]
