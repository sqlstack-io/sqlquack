category = "translation"
construct = "sf.query.group-by-grouping-sets"
session_profile = "utc-v1"

[[case]]
id = "t001_sets"
description = "Three sets: by g, by x and the grand total. Catches: the sets combined as a cross product"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, x, GROUPING(g) AS gg, GROUPING(x) AS gx, COUNT(*) AS n FROM input GROUP BY GROUPING SETS ((g), (x), ()) ORDER BY gg, gx, g NULLS LAST, x NULLS LAST"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_duplicate_set"
description = "GROUPING SETS ((g), (g)); the page does not say; the recording decides whether the repeated set returns its rows twice. Catches: duplicates removed where Snowflake keeps them (or the reverse)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, COUNT(*) AS n FROM input GROUP BY GROUPING SETS ((g), (g)) ORDER BY g NULLS LAST, n"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_key"
description = "The NULL group of g against the rows of the (x) set, where g is NULL because the set leaves it out. Catches: the two merged"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT g, GROUPING(g) AS gg, COUNT(*) AS n FROM input GROUP BY GROUPING SETS ((g), ()) ORDER BY gg, g NULLS LAST"
order = "ordered"
tags = ["null"]
