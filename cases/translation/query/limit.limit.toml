category = "translation"
construct = "sf.query.limit.limit"
session_profile = "utc-v1"

[[case]]
id = "t001_offset"
description = "Rows 2 and 3 of the ordered input. Catches: OFFSET counted from 1, or ignored"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input ORDER BY ordinal LIMIT 2 OFFSET 1"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_zero"
description = "LIMIT 0, which returns no rows. Catches: LIMIT 0 read as no limit"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input ORDER BY ordinal LIMIT 0"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_null_count"
description = "LIMIT NULL; the page does not say; the recording decides. Catches: an error, or no rows, where Snowflake returns every row (or the reverse)"
columns = [{ name = "g", type = "VARCHAR" }, { name = "x", type = "NUMBER(38,0)" }]
rows = [
  ["'a'", "1"],
  ["'a'", "2"],
  ["'a'", "2"],
  ["'b'", "3"],
  ["'b'", "NULL"],
  ["NULL", "4"],
  ["NULL", "NULL"],
]
query = "SELECT ordinal FROM input ORDER BY ordinal LIMIT NULL"
order = "ordered"
tags = ["null"]
