category = "translation"
construct = "sf.query.select.select-ilike-replace"
session_profile = "utc-v1"

[[case]]
id = "t001_ilike_replace"
description = "Columns matching '%name', with first_name replaced by its length. Catches: the replaced column moved"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * ILIKE '%name' REPLACE (LENGTH(first_name) AS first_name) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_values"
description = "LENGTH of the NULL first name is NULL. Catches: NULL read as length 0"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * ILIKE 'first%' REPLACE (LENGTH(first_name) AS first_name) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["null"]
