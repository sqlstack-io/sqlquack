category = "translation"
construct = "sf.query.select.select-exclude-replace-rename"
session_profile = "utc-v1"

[[case]]
id = "t001_all_three"
description = "All three modifiers: department_id excluded, employee_id plus 1000 replaced, then last_name renamed. Catches: the modifiers applied in another order"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * EXCLUDE department_id REPLACE (employee_id + 1000 AS employee_id) RENAME (last_name AS ln) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_values"
description = "Row 104 holds a NULL first name and department, which the modifiers pass through unchanged. Catches: the NULL row dropped"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * EXCLUDE employee_id REPLACE (department_id * 10 AS department_id) RENAME (first_name AS fn) FROM input ORDER BY last_name"
order = "ordered"
tags = ["null"]
