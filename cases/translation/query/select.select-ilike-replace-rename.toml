category = "translation"
construct = "sf.query.select.select-ilike-replace-rename"
session_profile = "utc-v1"

[[case]]
id = "t001_ilike_replace_rename"
description = "ILIKE '%name', last_name upper-cased, then renamed. Catches: RENAME applied before REPLACE (the replacement lost)"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * ILIKE '%name' REPLACE (UPPER(last_name) AS last_name) RENAME (last_name AS ln) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_null_values"
description = "Row 104 holds a NULL first name and department, which the modifiers pass through unchanged. Catches: the NULL row dropped"
columns = [{ name = "employee_id", type = "NUMBER(38,0)" }, { name = "last_name", type = "VARCHAR" }, { name = "first_name", type = "VARCHAR" }, { name = "department_id", type = "NUMBER(38,0)" }]
rows = [
  ["101", "'Montgomery'", "'Pat'", "1"],
  ["102", "'Levine'", "'Terry'", "2"],
  ["103", "'Comstock'", "'Dana'", "2"],
  ["104", "'Okafor'", "NULL", "NULL"],
]
query = "SELECT * ILIKE '%name' REPLACE (UPPER(first_name) AS first_name) RENAME (first_name AS fn) FROM input ORDER BY employee_id"
order = "ordered"
tags = ["null"]
