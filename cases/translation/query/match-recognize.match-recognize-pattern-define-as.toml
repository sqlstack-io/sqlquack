category = "translation"
construct = "sf.query.match-recognize.match-recognize-pattern-define-as"
session_profile = "utc-v1"

[[case]]
id = "t001_all_rows_up"
description = "The page's rising-price example on its ABCD prices: matches d 2 to 4 and d 5 to 8, with MATCH_NUMBER, MATCH_SEQUENCE_NUMBER and CLASSIFIER for each row. Catches: a non-greedy UP+, a match allowed to start at d 1, or CLASSIFIER returning the next symbol"
columns = [{ name = "c", type = "VARCHAR" }, { name = "d", type = "NUMBER(38,0)" }, { name = "price", type = "NUMBER(38,0)" }]
rows = [
  ["'ABCD'", "1", "50"],
  ["'ABCD'", "2", "36"],
  ["'ABCD'", "3", "39"],
  ["'ABCD'", "4", "42"],
  ["'ABCD'", "5", "30"],
  ["'ABCD'", "6", "47"],
  ["'ABCD'", "7", "71"],
  ["'ABCD'", "8", "80"],
  ["'ABCD'", "9", "75"],
  ["'ABCD'", "10", "63"],
]
query = "SELECT c, d, price, mn, msq, cl FROM input MATCH_RECOGNIZE(PARTITION BY c ORDER BY d MEASURES MATCH_NUMBER() AS mn, MATCH_SEQUENCE_NUMBER() AS msq, CLASSIFIER() AS cl ALL ROWS PER MATCH PATTERN (ANY_ROW UP+) DEFINE ANY_ROW AS TRUE, UP AS price > LAG(price)) ORDER BY c, mn, msq"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t002_one_row_v_shape"
description = "The page's V-shape example: one summary row per match with FIRST and LAST of d and the counts of each symbol; skipping to the last rising row lets the next V start there. Catches: all rows returned instead of one, or matching resumed after the match so a shared row is not reused"
columns = [{ name = "c", type = "VARCHAR" }, { name = "d", type = "NUMBER(38,0)" }, { name = "price", type = "NUMBER(38,0)" }]
rows = [
  ["'ABCD'", "1", "50"],
  ["'ABCD'", "2", "36"],
  ["'ABCD'", "3", "39"],
  ["'ABCD'", "4", "42"],
  ["'ABCD'", "5", "30"],
  ["'ABCD'", "6", "47"],
  ["'ABCD'", "7", "71"],
  ["'ABCD'", "8", "80"],
  ["'ABCD'", "9", "75"],
  ["'ABCD'", "10", "63"],
  ["'XYZ'", "1", "89"],
  ["'XYZ'", "2", "24"],
  ["'XYZ'", "3", "37"],
  ["'XYZ'", "4", "63"],
  ["'XYZ'", "5", "65"],
  ["'XYZ'", "6", "56"],
]
query = "SELECT c, mn, start_d, end_d, n, n_down, n_up FROM input MATCH_RECOGNIZE(PARTITION BY c ORDER BY d MEASURES MATCH_NUMBER() AS mn, FIRST(d) AS start_d, LAST(d) AS end_d, COUNT(*) AS n, COUNT(down.*) AS n_down, COUNT(up.*) AS n_up ONE ROW PER MATCH AFTER MATCH SKIP TO LAST up PATTERN (start_row down+ up+) DEFINE down AS price < LAG(price), up AS price > LAG(price)) ORDER BY c, mn"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t003_with_unmatched_rows"
description = "The page: WITH UNMATCHED ROWS adds the rows outside any match, whose MEASURES are NULL. Catches: unmatched rows dropped, or given a match number"
columns = [{ name = "c", type = "VARCHAR" }, { name = "d", type = "NUMBER(38,0)" }, { name = "price", type = "NUMBER(38,0)" }]
rows = [
  ["'ABCD'", "1", "50"],
  ["'ABCD'", "2", "36"],
  ["'ABCD'", "3", "39"],
  ["'ABCD'", "4", "42"],
  ["'ABCD'", "5", "30"],
  ["'ABCD'", "6", "47"],
  ["'ABCD'", "7", "71"],
  ["'ABCD'", "8", "80"],
  ["'ABCD'", "9", "75"],
  ["'ABCD'", "10", "63"],
]
query = "SELECT c, d, price, mn, cl FROM input MATCH_RECOGNIZE(PARTITION BY c ORDER BY d MEASURES MATCH_NUMBER() AS mn, CLASSIFIER() AS cl ALL ROWS PER MATCH WITH UNMATCHED ROWS PATTERN (up+) DEFINE up AS price > LAG(price)) ORDER BY c, d"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t004_omit_empty_matches"
description = "The page: OMIT EMPTY MATCHES drops empty matches from the output, but an empty match still increments MATCH_NUMBER. Catches: empty matches shown, or MATCH_NUMBER counting only non-empty matches"
columns = [{ name = "c", type = "VARCHAR" }, { name = "d", type = "NUMBER(38,0)" }, { name = "price", type = "NUMBER(38,0)" }]
rows = [
  ["'ABCD'", "1", "50"],
  ["'ABCD'", "2", "36"],
  ["'ABCD'", "3", "39"],
  ["'ABCD'", "4", "42"],
  ["'ABCD'", "5", "30"],
  ["'ABCD'", "6", "47"],
  ["'ABCD'", "7", "71"],
  ["'ABCD'", "8", "80"],
  ["'ABCD'", "9", "75"],
  ["'ABCD'", "10", "63"],
]
query = "SELECT c, d, price, mn FROM input MATCH_RECOGNIZE(PARTITION BY c ORDER BY d MEASURES MATCH_NUMBER() AS mn ALL ROWS PER MATCH OMIT EMPTY MATCHES PATTERN (up*) DEFINE up AS price > LAG(price)) ORDER BY c, d"
order = "ordered"
tags = ["type-combination"]

[[case]]
id = "t006_null_price"
description = "A NULL price makes price > LAG(price) NULL, which is not TRUE, so the NULL row and the row after it are not rising rows; the page gives no other rule. Catches: NULL compared as zero or as a match, so a run continues through the NULL"
columns = [{ name = "c", type = "VARCHAR" }, { name = "d", type = "NUMBER(38,0)" }, { name = "price", type = "NUMBER(38,0)" }]
rows = [
  ["'N'", "1", "10"],
  ["'N'", "2", "20"],
  ["'N'", "3", "NULL"],
  ["'N'", "4", "40"],
  ["'N'", "5", "50"],
]
query = "SELECT c, d, price, mn, cl FROM input MATCH_RECOGNIZE(PARTITION BY c ORDER BY d MEASURES MATCH_NUMBER() AS mn, CLASSIFIER() AS cl ALL ROWS PER MATCH PATTERN (up+) DEFINE up AS price > LAG(price)) ORDER BY c, d"
order = "ordered"
tags = ["null"]

[[case]]
id = "t007_no_columns"
compile_error = true
description = "The page: omitting PARTITION BY and MEASURES with ONE ROW PER MATCH raises \"SELECT with no columns\". Catches: an empty result or every input row returned instead of the error"
columns = [{ name = "c", type = "VARCHAR" }, { name = "d", type = "NUMBER(38,0)" }, { name = "price", type = "NUMBER(38,0)" }]
rows = [
  ["'ABCD'", "1", "50"],
  ["'ABCD'", "2", "36"],
  ["'ABCD'", "3", "39"],
  ["'ABCD'", "4", "42"],
  ["'ABCD'", "5", "30"],
  ["'ABCD'", "6", "47"],
  ["'ABCD'", "7", "71"],
  ["'ABCD'", "8", "80"],
  ["'ABCD'", "9", "75"],
  ["'ABCD'", "10", "63"],
]
query = "SELECT * FROM input MATCH_RECOGNIZE(ORDER BY d ONE ROW PER MATCH PATTERN (up+) DEFINE up AS price > LAG(price))"
order = "ordered"
tags = ["error"]
