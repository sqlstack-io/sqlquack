category = "numeric"
construct = "node:div"
session_profile = "utc-v1"

[[case]]
id = "decimal_division"
description = "Decimal division, whose result scale Snowflake raises."
columns = [{ name = "a", type = "NUMBER(10,2)" }, { name = "b", type = "NUMBER(10,2)" }]
rows = [
  ["10.00", "3.00"],
  ["-1.00", "8.00"],
  ["0", "7"],
  ["NULL", "2"],
  ["99999999.99", "0.01"],
]
expression = "a / b"
tags = ["null", "zero", "negative", "boundary"]

[[case]]
id = "division_by_zero"
description = "Division by zero is an error, not NULL."
columns = [{ name = "a", type = "NUMBER(38,0)" }, { name = "b", type = "NUMBER(38,0)" }]
rows = [["1", "0"]]
expression = "a / b"
tags = ["zero"]
