id = "literal_100p0"
description = "The numeric literal 100.0: its value."
columns = [{ name = "k", type = "NUMBER(2,0)" }]
rows = [
  ["1"],
]
expression = "100.0"
tags = ["null", "zero", "negative", "boundary"]

[[case]]
id = "literal_100p0_arith"
description = "The numeric literal 100.0 in arithmetic with a NUMBER(10,2) column."
