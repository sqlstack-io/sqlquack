category = "temporal"
construct = "node:cast"
session_profile = "utc-v1"

[[case]]
id = "ntz9_to_varchar_dropped_digits"
description = "TO_VARCHAR of a nanosecond naive timestamp keeps three fractional digits. Catches: rounding where Snowflake truncates or the reverse, at .1235 against .1234999, and a carry into the next second, day and year."
columns = [{ name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123499999'"],
  ["'2024-02-29 13:45:01.123500000'"],
  ["'2024-02-29 13:45:01.123999999'"],
  ["'2024-02-29 13:45:01.000500000'"],
  ["'2024-02-29 13:45:01.999500000'"],
  ["'2024-12-31 23:59:59.999999999'"],
  ["'1969-12-31 23:59:59.999500000'"],
  ["NULL"],
]
expression = "TO_VARCHAR(t)"
tags = ["null", "boundary"]

[[case]]
id = "ntz9_cast_to_varchar_dropped_digits"
description = "A nanosecond naive timestamp cast to VARCHAR, the same digits as TO_VARCHAR. Catches: the cast and TO_VARCHAR treating the dropped digits differently."
columns = [{ name = "t", type = "TIMESTAMP_NTZ(9)" }]
rows = [
  ["'2024-02-29 13:45:01.123499999'"],
  ["'2024-02-29 13:45:01.123500000'"],
  ["'2024-02-29 13:45:01.999500000'"],
  ["'2024-12-31 23:59:59.999999999'"],
  ["NULL"],
]
expression = "t::VARCHAR"
tags = ["null", "boundary"]
